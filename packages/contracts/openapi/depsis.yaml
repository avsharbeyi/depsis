openapi: 3.1.0

info:
  title: DEPSIS API
  version: 0.1.0-phase1
  summary: Debian tabanlı çok kullanıcılı NAS platformu — Faz 1 yüzeyi
  description: |
    Bu belge tek doğruluk kaynağıdır. `apps/web` istemcisi buradan üretilir
    (`openapi-typescript`, ADR-0002); elle yazılmış istemci tipi bulunamaz.

    Kapsam: Faz 1 uçları. Konsol, uygulama kataloğu ve uzak erişim de burada — sırasıyla ADR-0018, ADR-0019 ve ADR-0020. Üçü de cihazın DIŞINDAKİ bir şeyi yönetiyor (bir kabuk, podman, zerotier-one); DEPSIS hiçbirini paketlemez, kuruluysa yönetir ve kurulu değilse 503 döner. Konsol ayrıcalıklı ajanda ÇALIŞMAZ: §2.2'nin serbest komut yasağı duruyor.
    Faz 2-3'e aittir ve kasıtlı olarak yoktur — tanımlanmamış bir uç, "yakında" diye
    duran boş bir uçtan iyidir.

    Sistem aracısı IPC şeması burada DEĞİLDİR. ADR-0006 gereği onu Rust sahiplenir ve
    schemars ile üretir: bir güven sınırının sözleşmesini, o sınırı uygulayan taraf
    tanımlamalıdır.

servers:
  - url: /api/v1

tags:
  - name: setup
    description: |
      Tek seferlik ilk kurulum. Bu uçlar kurulum tamamlandığında kalıcı olarak 410 döner
      (ADR-0009).
  - name: auth
    description: Oturum ve MFA. Faz 1'de MFA yalnız TOTP (ADR-0009).
  - name: files
    description: Dosya ağacı. Yetki her zaman id üzerinden çözülür, asla yol üzerinden (ADR-0005).
  - name: uploads
    description: tus 1.0.0 devam ettirilebilir yükleme (ADR-0008).
  - name: search
    description: Türkçe-duyarlı ad araması (ADR-0010).
  - name: system
    description: Telemetri ve işler.

security:
  - sessionCookie: []

paths:
  /health:
    get:
      tags: [system]
      summary: Canlılık ve hangi rolle bağlanıldığı
      security: []
      description: |
        Rolü de bildirir. Süs değil: ADR-0015 §4 satırları görebilen bir rolle açılmayı
        reddediyor, ama yanlış VERİTABANINA yönlendirilmiş bir dağıtım o kontrolü geçebilir —
        rolün görünür olması, operatörün bunu destek talebinden önce fark etme yoludur.
      responses:
        '200':
          description: Yanıt her durumda 200; sağlık gövdededir
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }

  /setup/status:
    get:
      tags: [setup]
      summary: Kurulum gerekiyor mu
      security: []
      description: |
        Kimlik doğrulaması yok, çünkü web arayüzü kimse giriş yapamadan önce hangi ekranı
        göstereceğini bilmek zorunda. Yalnız bir boole döner — organizasyon adı, yönetici
        adresi veya neyin var olduğuna dair bir ipucu yok.
      responses:
        '200':
          description: Durum
          content:
            application/json:
              schema:
                type: object
                required: [setupRequired]
                properties:
                  setupRequired: { type: boolean }

  /setup/claim:
    post:
      tags: [setup]
      summary: Sistemi tek seferlik belirteçle sahiplen
      security: []
      description: |
        İlk organizasyonu ve yöneticisini yaratır. Belirteç, kurulum beklerken API'nin her
        açılışta journal'a bastığı tek kullanımlık değerdir; okumak konsol veya SSH erişimi
        gerektirir ve ilk yöneticinin kim olacağına karar vermesi gereken yetki budur
        (ADR-0015 §5d).

        Doğrulama hataları burada ALANI SÖYLER, giriş yolunun aksine: karşı taraf makinenin
        sahibi, formu bir kez dolduruyor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupClaimRequest' }
      responses:
        '200':
          description: Sahiplenildi
          content:
            application/json:
              schema:
                type: object
                required: [status, organizationSlug]
                properties:
                  status: { type: string, enum: [ok] }
                  organizationSlug: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '410':
          description: Kurulum zaten tamamlandı; bu uç kalıcı olarak kapalı
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /auth/login:
    post:
      tags: [auth]
      summary: Parola ile oturum aç
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Oturum açıldı veya MFA gerekiyor
          headers:
            Set-Cookie:
              description: HttpOnly + Secure + SameSite=Lax oturum çerezi
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/mfa/verify:
    post:
      tags: [auth]
      summary: TOTP kodunu doğrula
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
      responses:
        '200':
          description: Doğrulandı; bekleyen çerez temizlendi ve oturum çerezi kuruldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaVerifyResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Bu oturumu sonlandır
      responses:
        '204':
          description: Sonlandırıldı

  /me:
    get:
      tags: [auth]
      summary: Oturum sahibinin profili
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Problem' }

  /me/mfa/enrolment:
    post:
      tags: [auth]
      summary: TOTP kaydını başlat
      description: |
        Bir sır üretir ve **onaylanmamış** olarak saklar. Onaylanmamış bir sır girişi
        engellemez: QR'ı okutup telefonu kaybeden bir kullanıcı aksi hâlde hiç kullanamadığı bir
        sır yüzünden kilitlenirdi — ve kurtarma kodları onayda veriliyor.

        Zaten onaylanmış bir kayıt varsa 409 döner; değiştirmek için önce kaldırmak gerekir.
      responses:
        '200':
          description: Okutulacak sır
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrolment' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /me/mfa/enrolment/confirm:
    post:
      tags: [auth]
      summary: Kaydı bir kodla onayla ve kurtarma kodlarını al
      description: |
        Kurtarma kodları **yalnız burada** okunabilir hâlde döner; saklanan yalnız hash'leri.
        Onay kodu da harcanır, dolayısıyla aynı 30 saniye içinde girişte kullanılamaz —
        arayüz bunu söylemeli.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Kayıt tamam; kodlar bir kez gösterilir
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        '401': { $ref: '#/components/responses/Problem' }

  /me/mfa:
    delete:
      tags: [auth]
      summary: TOTP kaydını kaldır
      description: |
        Parola yeniden isteniyor. §0.5: güvenlik riski taşıyan bir işlem sessizce
        yapılamaz — ikinci faktörü kaldırmak, ele geçirilmiş bir oturumun yapmak isteyeceği ilk
        şeydir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordConfirmation' }
      responses:
        '204':
          description: Kaldırıldı
        '401': { $ref: '#/components/responses/Problem' }

  /me/mfa/recovery-codes:
    post:
      tags: [auth]
      summary: Kurtarma kodlarını yenile
      description: |
        Eskiler geçersiz olur. Parola yeniden isteniyor, aynı §0.5 gerekçesiyle: yeni bir set
        üretmek, eskisini elinde tutan sahibi sessizce kilitleyebilir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordConfirmation' }
      responses:
        '200':
          description: Yeni kodlar, bir kez
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /users:
    get:
      tags: [users]
      summary: Organizasyonun hesaplarını listele
      description: |
        Yalnız yöneticiler. 403 döner, 404 değil — bu uç noktanın varlığı sır değil, kimin
        çağırabileceği sır. Başka kiracının nesnesi olan uç noktalar 404 döner ve bu fark
        tutarsızlık değil, karar.
      responses:
        '200':
          description: Hesaplar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [users]
      summary: Hesap oluştur
      description: |
        Parola sunucuda Argon2id ile özetlenir; düz metin hiçbir yerde saklanmaz.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [users]
      summary: Görünen ad, rol veya devre dışı durumunu değiştir
      description: |
        Parola ve e-posta BURADA DEĞİL. Yöneticinin belirlediği bir parola, yöneticinin bildiği
        bir paroladır — her hesabı denetimde ayırt edilemeyecek şekilde taklit edilebilir kılar.
        E-posta değişikliği ise parola sıfırlamanın nereye gideceğini sessizce taşır.

        Bir organizasyon en az bir etkin yönetici tutmak zorunda; bunu veritabanı trigger'ı
        uygular, çünkü iki yöneticinin birbirini eşzamanlı düşürmesi uygulama seviyesinde
        sayılamaz. Son yöneticiyi düşürmek 409 döner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /users/{id}/password-reset:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [users]
      summary: Bir hesap için tek kullanımlık parola sıfırlama bileti aç
      description: |
        Yalnız yöneticiler. Parolasını unutan bir kullanıcının üründen kurtarılmasının yolu.

        YÖNETİCİ PAROLAYI BELİRLEMİYOR ve `PATCH /users/{id}` bunun neden böyle olması
        gerektiğini yazıyor: "yöneticinin belirlediği bir parola, yöneticinin bildiği bir
        paroladır." Dönen şey elden verilecek tek kullanımlık bir jeton; parolayı kullanıcı
        kendisi seçiyor.

        Bu, taklidi imkânsız kılmıyor — bir NAS'ın yöneticisi zaten root eşdeğeri. Değiştirdiği
        şey, taklidin SESSİZ olmaktan çıkması: jeton tek kullanımlık, yani yönetici kullanırsa
        kullanıcının kendi denemesi başarısız olur ve kurban olayı öğrenir.

        Yöneticinin KENDİ parolası isteniyor. Bir oturum, birinin açık bırakılmış dizüstünü ödünç
        alan kişinin sahip olduğu şeydir ve bu uç, öyle bir dizüstünde bulunabilecek en kullanışlı
        şey: cihazdaki her hesaba açılan bir kapı.

        Jeton BİR KEZ gösteriliyor. Veritabanında yalnız SHA-256 özeti duruyor, yani bu yanıt
        değerin var olduğu tek yer; geri okuyabilecek ikinci bir uç yok.

        Kendine sıfırlama açmak 409: `POST /me/password` bunu zaten doğru yapıyor — mevcut parolayı
        istiyor ve mevcut oturumu ayakta bırakıyor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  maxLength: 1024
                  description: Çağıran YÖNETİCİNİN kendi parolası. Hedef kullanıcının değil.
      responses:
        '201':
          description: Bilet açıldı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetTicket' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /auth/password-reset:
    post:
      tags: [auth]
      summary: Bileti kullan ve yeni parolayı belirle
      description: |
        KİMLİK DOĞRULAMASIZ, ve bütün mesele bu: bu ucu kullanan kişi giriş yapamıyor. Yetkiyi
        veren şey, yöneticinin verdiği jeton.

        İKİNCİ FAKTÖR YİNE İSTENİYOR. Hesap MFA'ya kayıtlıysa doğrulayıcı kodu ya da kurtarma kodu
        gerekiyor; yoksa çalınmış bir kâğıt parçasıyla ikinci faktörün önünden dolaşılabilirdi —
        ikinci faktörün var olma sebebi tam olarak bunu engellemek. `code` şemada isteğe bağlı
        çünkü çağıran hesabın kayıtlı olup olmadığını bilemez, ve kodsuz isteği reddetmek bu soruyu
        çalınmış bir bileti elinde tutan birine cevaplamak olurdu.

        Kullanıcının BÜTÜN oturumları iptal ediliyor.

        HER BAŞARISIZLIK AYNI CEVABI VERİYOR. Bilinmeyen jeton, süresi dolmuş jeton, kullanılmış
        jeton, devre dışı hesaba ait jeton ve yanlış ikinci faktör — hepsi aynı 401. Ayırt
        edilebilir olsalardı bu uç, hangi biletlerin var olduğunu söyleyen bir kâhin olurdu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, maxLength: 512 }
                password: { type: string, minLength: 12, maxLength: 1024 }
                code:
                  type: string
                  maxLength: 64
                  description: Hesap ikinci faktöre kayıtlıysa zorunlu. Altı haneli kod ya da kurtarma kodu.
      responses:
        '200':
          description: Parola değişti
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /me/password:
    post:
      tags: [me]
      summary: Kendi parolasını değiştir
      description: |
        Mevcut parola, oturum zaten varken bile isteniyor: bir oturum, birinin açık bırakılmış
        dizüstünü ödünç aldığında sahip olduğu şeydir, ve bu adım olmadan hesabın sahibini kalıcı
        olarak dışarıda bırakmak için gereken tek şeydir.

        Diğer BÜTÜN oturumlar iptal edilir. Parola değişikliği insanın kimlik bilgilerinin
        başkasında olduğunu düşündüğünde yaptığı şeydir; o birini oturumda bırakmak değişikliği
        anlamsız kılar. Mevcut oturum ayakta kalır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Değiştirildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordChanged' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }

  /files:
    get:
      tags: [files]
      summary: Bir klasörün içeriğini listele
      description: |
        Cursor pagination zorunlu (§14). Offset kullanılmaz: bir NAS'ta küme sürekli
        değiştiği için offset sayfalama sessizce kayıt atlar.

        Yanıtta toplam sayı yoktur, yalnız hasMore. Filtrelenmiş bir liste yanında
        filtrelenmemiş bir sayaç, kiracının göremediği satırların varlığını sızdırır.
      parameters:
        - name: parentId
          in: query
          description: Yoksa kullanıcının kökleri döner.
          schema: { type: string, format: uuid }
        - name: shareId
          in: query
          required: false
          description: |
            Hangi paylaşım. Verilmezse kiracının varsayılanı — yani bu parametreden önceki her
            istemci aynen çalışmaya devam eder.

            Bu parametre olmadan dosya yöneticisi HER ZAMAN ilk paylaşımı gösteriyordu
            (`ORDER BY created_at LIMIT 1`), yani `POST /shares` ile açılan bir paylaşım
            Samba'ya yayımlanıyor ve web'de görünmüyordu.

            Başka bir kiracının paylaşımı 404 — var olmayan bir kimlikle aynı cevap, yoksa
            parametre hangi paylaşım kimliklerinin var olduğunu söyleyen bir kâhin olurdu.
          schema: { type: string, format: uuid }
        - name: trashed
          in: query
          description: |
            Doğruysa çöp kutusu listelenir ve `parentId` yok sayılır. Çöp bir klasör değil bir
            sütun (0008: `trashed_at`), yani ağaçta gezilecek bir yeri yok; ayrı bir uç nokta
            yerine bir süzgeç olması da bu yüzden.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, modified, size]
            default: name
      responses:
        '200':
          description: Sayfa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileEntryPage' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /files/folders:
    post:
      tags: [files]
      summary: Klasör oluştur
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFolderRequest' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileEntry' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /files/{id}:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [files]
      summary: Tek bir girdinin ayrıntısı
      responses:
        '200':
          description: Girdi
          headers:
            ETag:
              description: |
                Meta veri doğrulayıcısı. `PATCH /files/{id}` bunu `If-Match` olarak kabul eder.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileEntryDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [files]
      summary: Yeniden adlandır
      description: |
        Taşıma da burada: `parentId` alanı aynı satırın diğer kolonu ve dosya sistemi tarafında da tek bir rename(2). PAYLAŞIMLAR ARASI taşıma burada değil — dataset sınırını geçen bir rename EXDEV veriyor (ADR-0008) ve kopyala+sil işine dönüşmesi gerek; o /file-operations — taşımada hem kaynak
        hem hedef yetkisi gerekir (§6.2).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFileRequest' }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileEntry' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        # 501 KALDIRILDI. Taşıma artık ajanın `MoveEntry` işlemiyle gerçekten yapılıyor:
        # önce dosya sistemi, sonra veritabanı. Sıra bu yönde çünkü ters sırada, rename
        # başarısız olduğunda satır yeni yerini gösterir ve diskteki dosya eski yerinde kalır —
        # veritabanıyla diskin ayrışması, bu üründe kabul edilmeyen tek şey.
    delete:
      tags: [files]
      summary: Çöp kutusuna taşı
      description: |
        Bu bir JOB DEĞİL. Önceki hâli 202 + JobRef diyordu, çünkü büyük bir alt ağacı silmek
        uzun iş gibi görünüyordu; çöpe atmak tek satırda tek bayrak çıktı. Bayt silinmiyor —
        çöpü boşaltmak ajandan `unlink` isteyen ayrı bir karar. Var olmayan bir işe referans
        döndürmek, istemcinin sorgulayamayacağı bir kuyruk girdisi uydurmak olurdu.
      responses:
        '200':
          description: Çöp kutusuna taşındı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileEntry' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /files/{id}/content:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [files]
      summary: Dosya içeriğini indir
      description: |
        RFC 9110 §14 Range destekler. Sunucu dosyayı belleğe almaz, akıtır. Güçlü ETag ile
        If-Range; dosya değiştiyse 206 yerine 200 döner ve bozuk splice engellenir.
      parameters:
        - name: Range
          in: header
          schema: { type: string }
        - name: If-Range
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Tam içerik
          headers:
            Accept-Ranges:
              schema: { type: string }
            ETag:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Kısmi içerik
          headers:
            Content-Range:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Problem' }
        '416': { $ref: '#/components/responses/Problem' }

  /file-operations:
    post:
      tags: [files]
      summary: Kopyala — uzun süren iş olarak
      description: |
        Hem kaynak hem hedef yetkisi doğrulanır (§6.2): kaynakta `download`, hedefte `create`.
        `download`, `read` değil — `read` üstveridir (ad, boyut, tarih), kopyalama İÇERİĞİ alır.
        Bir dosyanın var olduğunu görebilmek, onun kopyasını kendi klasörüne çıkarabilmek
        anlamına gelmemeli.

        202 ve bir `JobRef` dönüyor. §17: bin dosyalık toplu bir işlem arayüzü kilitlemez ve
        durumu gerçek zamanlı güncellenir — iş kuyrukta çalışıyor, `GET /jobs/{jobId}` ve
        `GET /events` üzerinden izleniyor.

        ── Şu an ne sunuluyor ──────────────────────────────────────────────────

        `operation: copy` — evet.

        `operation: move` — hayır, 422. Tek girdi taşıma `PATCH /files/{id}`: tek bir
        `renameat2`, anında, ve kuyruğa sokmak yaygın durumu hiçbir kazanç olmadan yavaşlatır.
        PAYLAŞIMLAR ARASI taşıma gerçekten buraya ait — dataset sınırını geçen bir rename EXDEV
        verir (ADR-0008) ve kopyala+sil'e dönüşmesi gerekir — ama yarım uygulanmış bir taşıma,
        kopyalayıp silmeyi başaramadığında kullanıcının bir tane istediği yerde iki dosya
        bırakır. Yaklaşık yapmak yerine reddediliyor.

        `operation: restore` — hayır, 422. `POST /files/{id}/restore` var.

        `conflictPolicy: keep_both` — evet, ve şu an tek desteklenen. `replace` kullanıcının
        adlandırmadığı bir dosyayı yok ederdi; `RENAME_NOREPLACE` bunu syscall'a kadar
        engelliyor ve desteklemek ajana sahip olmadığı bir üzerine-yazma vermek demek olurdu.
        `version` var olmayan bir sürüm deposu istiyor. `skip` savunulabilir ve henüz yazılmadı;
        onun adı altında sessizce `keep_both` yapmaktansa reddetmek daha dürüst.

        ── Sınırlar ────────────────────────────────────────────────────────────

        Bir klasör kendi içine ya da kendi altındaki bir klasöre kopyalanamaz: 409. Her adım tek
        başına geçerli bir oluşturma olduğu için veritabanı bunu durdurmaz, sonu gelmeyen bir
        ağaç olurdu.

        100.000 girdiden büyük bir seçim reddediliyor. Performans sınırı değil: kopyalama, tek
        bir yükleme olmadan saklanan baytları çoğaltabilen iki işlemden biri, ve paylaşımın
        kökünü seçen birine sayıyı söylemek, bir saat sonra dolmuş bir dataset olarak
        keşfettirmekten iyi.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileOperationRequest' }
      responses:
        '202':
          description: İş kuyruğa alındı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '507':
          description: |
            Seçimin toplam boyutu havuzda kalan yerden büyük. Bir garanti değil bir nezaket
            kontrolü — eşzamanlılık altında yer, bu cevapla kopyalama arasında başka bir yükleme
            tarafından alınabilir; ajanın ENOSPC/EDQUOT sınıflandırması bu yüzden ayrıca var.
            Dönüştürdüğü şey yaygın durum: bir saat sonra yarısı kopyalanmış bir ağaçla
            başarısız olmak yerine, iki sayıyı hemen söylemek.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /uploads:
    post:
      tags: [uploads]
      summary: Devam ettirilebilir yükleme oluştur (tus creation)
      description: |
        Yükleme, hedefin kendi dataset'i içindeki .depsis/staging/ altına iner; ayrı bir
        staging dataset'i yoktur, çünkü dataset'ler arası yayınlama atomik olamaz (ADR-0008).

        Kota aşımı EDQUOT üretir ve bu 507 olarak döner, 500 olarak değil.
      parameters:
        - name: Upload-Length
          in: header
          required: true
          schema: { type: integer, format: int64 }
        - name: Upload-Metadata
          in: header
          required: true
          description: tus base64 metadata; filename ve parentId taşır.
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Oluşturuldu
          headers:
            Location:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '507': { $ref: '#/components/responses/Problem' }

  /uploads/{uploadId}:
    parameters:
      - name: uploadId
        in: path
        required: true
        schema: { type: string }
    head:
      tags: [uploads]
      summary: Kaldığı yeri sor (tus HEAD)
      responses:
        '200':
          description: Mevcut offset
          headers:
            Upload-Offset:
              schema: { type: integer, format: int64 }
            Upload-Length:
              schema: { type: integer, format: int64 }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [uploads]
      summary: Parça gönder (tus PATCH)
      description: |
        Gövde ham bayttır. Bu route'ta body parser kapalı olmalıdır; stream'e dokunan
        herhangi bir parser yüklemeyi sessizce bozar (ADR-0008).
      parameters:
        - name: Upload-Offset
          in: header
          required: true
          schema: { type: integer, format: int64 }
        - name: Upload-Checksum
          in: header
          description: sha256 base64. Tarayıcı SubtleCrypto yalnız SHA ailesini destekler.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204':
          description: Parça kabul edildi
          headers:
            Upload-Offset:
              schema: { type: integer, format: int64 }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '507': { $ref: '#/components/responses/Problem' }

  /search:
    get:
      tags: [search]
      summary: Ad araması
      description: |
        Sorgu normalize edilmiş kolona karşı çalışır (ADR-0010). İstanbul yazan da istanbul
        yazan da aynı sonucu alır; cagri yazmak Çağrı dosyalarını bulur.

        Sonuçlar yalnız çağıranın ACL/RLS kapsamındaki nesnelerden gelir. Sayaç ve öneriler
        de aynı kapsamdan üretilir.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: shareId
          in: query
          required: false
          description: |
            Hangi paylaşım. Verilmezse kiracının varsayılanı — yani bu parametreden önceki her
            istemci aynen çalışmaya devam eder.

            Bu parametre olmadan dosya yöneticisi HER ZAMAN ilk paylaşımı gösteriyordu
            (`ORDER BY created_at LIMIT 1`), yani `POST /shares` ile açılan bir paylaşım
            Samba'ya yayımlanıyor ve web'de görünmüyordu.

            Başka bir kiracının paylaşımı 404 — var olmayan bir kimlikle aynı cevap, yoksa
            parametre hangi paylaşım kimliklerinin var olduğunu söyleyen bir kâhin olurdu.
          schema: { type: string, format: uuid }
        - name: scope
          in: query
          description: Yoksa tüm erişilebilir alan.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Sonuçlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileEntryPage' }
        '422': { $ref: '#/components/responses/Problem' }

  /shares:
    get:
      tags: [system]
      summary: Paylaşımlar ve SMB adresleri
      description: |
        §9. Bir NAS'ın varlık sebebi Windows'tan bir sürücü olarak görünmek, ve o adresi
        kullanıcıya SÖYLEYEN bir yer yoksa özellik yarım kalır — kimse `\\depsis\belgeler`
        yazacağını tahmin edemez.

        `published`, ajanın Samba yapılandırmasını gerçekten yazıp yazmadığını söyler. Bu alan
        iyimser DEĞİL: DEPSIS'in veritabanında bir paylaşım satırı olması, smbd'nin onu sunduğu
        anlamına gelmiyor, ve ikisini aynı şeymiş gibi göstermek kullanıcıyı çalışmayan bir
        adresi denemeye gönderir.
      responses:
        '200':
          description: Paylaşımlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharePage' }

    post:
      tags: [system]
      summary: Paylaşım aç
      description: |
        Yalnız yöneticiler. §9'un eksik yarısı: bugüne kadar DEPSIS paylaşımları LİSTELİYOR ama
        açamıyordu — satırlar yalnız testlerden ve elle gelebiliyordu.

        Üç şey tek bir işlemde olur ve sırası önemlidir:

        1. **Dataset.** Ajan `zfs create -o acltype=posixacl` çalıştırır ve özelliği geri OKUR;
           `nfsv4` kendini kurulmuş gibi raporlayıp hiçbir şey uygulamadığı için (P0-B) bu
           doğrulama pazarlık konusu değil. Dataset `DEPSIS_SHARE_PARENT_DATASET` altına açılır
           ve oraya bağlı olduğu için paylaşım köküne düşer.
        2. **Satır.** `public.shares`. Dataset ÖNCE açılır: bir satır yazıp dataset'i açamamak,
           dosya yöneticisinde görünen ama açılamayan bir paylaşım bırakır.
        3. **Kök grant.** `grants` verilmezse paylaşımı açan yöneticiye tam izin yazılır.

        Üçüncüsü isteğe bağlı DEĞİL, ve sebebi bir güvenlik açığı: grant'ı olmayan bir paylaşım,
        §6.2 öncesi "kiracının herkesi yedi izin alır" davranışına geri düşen bir istisnayı
        canlı tutuyordu. `POST /shares` kök grant'ı aynı işlemde yazdığı için o istisna
        kaldırıldı (migration 0016). **Yeni paylaşım KAPALI doğar**: yalnız grant'ta adı geçen
        principal'lar ve organizasyon yöneticileri görür.

        POSIX ACL'lerin yazılması bir iş kuyruğuna girer ve `applyingJobId` onu adlandırır.
        `null` ise ajana ulaşılamadı: satır ve grant duruyor, dosya sistemi henüz haberdar değil.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareCreateRequest' }
      responses:
        '201':
          description: Açıldı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareCreated' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          # Ad zaten alınmış (veritabanında ya da dataset olarak).
          $ref: '#/components/responses/Problem'
        '422': { $ref: '#/components/responses/Problem' }
        '503':
          # Ajana ulaşılamıyor ya da DEPSIS_SHARE_PARENT_DATASET ayarlı değil.
          $ref: '#/components/responses/Problem'

  /system/smb:
    post:
      tags: [system]
      summary: Samba yapılandırmasını yeniden yayımla
      description: |
        Yalnız yöneticiler. Ajan yapılandırmayı atomik olarak yazar, `testparm` ile doğrular ve
        canlı bir bağlantı denemesi yapar; herhangi biri başarısız olursa ESKİSİNE GERİ DÖNER.

        Bu üç adımın üçü de gerekli ve sebebi ölçüldü (P0-B): geçersiz bir `full_audit` opname
        `testparm`'dan temiz geçiyor ve sonra smbd'nin BÜTÜN bağlantıları reddetmesine yol
        açıyor. Yalnız `testparm` koşan bir kapı, kapı değil.

        Uç nokta idempotent: aynı yapılandırma iki kez yayımlanabilir.
      responses:
        '200':
          description: Yayımlandı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmbPublishResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          # Ajan reddetti ve eskisine geri döndü. Paylaşımlar çalışmaya devam ediyor.
          $ref: '#/components/responses/Problem'
        '503': { $ref: '#/components/responses/Problem' }

  /system/trash-policy:
    get:
      tags: [system]
      summary: Çöp kutusunun saklama politikası ve neye mal olacağı
      description: |
        Yalnız yöneticiler. 403 döner, 404 değil — bu ucun varlığı sır değil, kimin
        çağırabileceği sır.

        `days` verilirse, KAYDEDİLMEMİŞ bir değer fiyatlanır: ayar ekranı bir sayıyı yazan
        kişiye, kaydetmeden önce ilk çalışmanın ne alacağını gösteriyor. Verilmezse kayıtlı
        politika fiyatlanır — yani bir sonraki zamanlanmış çalışmanın ne alacağı.

        ÖNİZLEME BİR KOLAYLIK DEĞİL, GÜVENLİK ARGÜMANININ PARÇASI. Bu politikayı açmak, kimse
        bakmazken, bir zamanlamaya göre, kalıcı olarak kullanıcı verisi silmeye başlamak demek.
        Sayı olmadan ayarlanan bir politika, körlemesine ayarlanmış bir politikadır.

        `impact.bytes` KÖKLERİN değil, altlarındaki DOSYALARIN toplamı.
        `file_entries_folder_has_no_size` bir klasörün `size_bytes` değerini 0'a sabitliyor, yani
        kökleri toplamak 10 GB'lık bir klasörü "1 öğe, 0 bayt" diye gösterirdi — yıkımın
        silahlandırıldığı ekranda, ölçülmeden raporlanmış bir geri kazanılabilir alan rakamı.
      parameters:
        - name: days
          in: query
          required: false
          description: Kaydedilmemiş bir değeri fiyatla. Verilmezse kayıtlı politika fiyatlanır.
          schema: { type: integer, minimum: 1, maximum: 3650 }
      responses:
        '200':
          description: Politika ve etkisi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashPolicy' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      tags: [system]
      summary: Saklama politikasını değiştir
      description: |
        `retentionDays: null` politikayı KAPATIR ve varsayılan budur: bir göç, kimsenin
        seçmediği bir anda kullanıcı verisi silmeye başlamamalı.

        En az 1 gün. Sıfır, "çöpe atmak kalıcı silmektir" demek olurdu — çöp kutusu bu üründe
        bir kullanıcı ile geri alınamaz veri kaybı arasındaki tek tıklama, ve yanlışlıkla 0
        yazmanın sonucu geri alınamaz. Veritabanı da kabul etmiyor.

        Kaydetmek bir temizlemeyi HEMEN kuyruğa alıyor. Ne alacağı kendisine gösterilmiş biri
        olmasını bekler; bir saat hiçbir şey olmaması, kaydedilmemiş bir ayar gibi okunur.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [retentionDays]
              properties:
                retentionDays:
                  type: integer
                  nullable: true
                  minimum: 1
                  maximum: 3650
      responses:
        '200':
          description: Kaydedildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashPolicy' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /system/telemetry:
    get:
      tags: [system]
      summary: Donanım ve depolama durumu
      description: |
        Kapasite zfs get değerlerinden gelir, statvfs'ten DEĞİL — ölçüldüğü üzere statvfs
        kotayı yanlış raporluyor (ADR-0008).

        Yetkisiz kullanıcıya sistem ayrıntısı gösterilmez; yanıt role göre daralır.
      responses:
        '200':
          description: Durum
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Telemetry' }
        '403': { $ref: '#/components/responses/Problem' }
        '503':
          # Havuz verisi yalnızca ayrıcalıklı ajandan gelebilir. Ajan yoksa doğru cevap boş bir
          # `pools` dizisi DEĞİL: o, "havuz yok" ile "bilmiyoruz"u aynı şeye çevirir ve bir
          # operatörün görmesi gereken en önemli farkı siler.
          $ref: '#/components/responses/Problem'

  /system/disks:
    get:
      tags: [system]
      summary: Kutudaki fiziksel diskler
      description: |
        `/system/telemetry` "bana söylenen diskler nasıl" sorusunu cevaplıyor ve bir operatörün
        `DEPSIS_SMART_DISKS`'e elle yazdığı listeye dayanıyor. Bu uç farklı bir soruyu
        cevaplıyor: **kutuda ne var.**

        §8.1 her yıkıcı depolama işleminden önce, etkilenen diskleri SERİ/WWN ile adlandıran bir
        analiz istiyor. Envanter olmadan o analiz üretilemez — havuz oluşturma sihirbazının
        olmamasının sebebi buydu.

        `serial` NULL OLABİLİR ve bu bir eksiklik değil: ADR-0000 ölçtü, SCSI VPD sayfa 0x80
        Hyper-V'de bozuk. Kimlik zinciri sayfa 0x83 (yani `wwn`), sonra partuuid, sonra ZFS
        etiket GUID'i. Yalnız seriye dayanan bir onay kutusu, projenin geliştirildiği
        hipervizörde boş bir alan gösterirdi.

        Yalnız yöneticiye. Diskin modeli, serisi ve neyin bağlı olduğu, bir kullanıcının
        görmesi gereken bir şey değil.
      responses:
        '200':
          description: Envanter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiskInventory' }
        '403': { $ref: '#/components/responses/Problem' }
        '503':
          # Boş bir `disks` dizisi DEĞİL. "Bu kutuda disk yok" ile "soramadık" arasındaki fark,
          # bir havuz sihirbazının önünde durduğu farkın ta kendisi.
          $ref: '#/components/responses/Problem'

  /system/storage:
    get:
      tags: [system]
      summary: Depolamanın kurulu olup olmadığı
      description: |
        Havuz sihirbazının bilmesi gereken her şey, tek çağrıda: kutuda hangi havuzlar var,
        paylaşımların sunulduğu dizin nerede, ve oraya bir veri kümesi bağlı mı.

        Bu uç iki yapılandırma değişkeninin cevabını **soruyor**: `DEPSIS_ZFS_POOLS` ve
        `DEPSIS_SHARE_PARENT_DATASET`. İkisi de hâlâ yazılabiliyor ve yazıldıklarında
        kazanıyorlar — ama artık zorunlu değiller, çünkü ürün havuzu kendisi kurabildiği andan
        sonra "sihirbazı bitir, sonra bir dosyayı düzenle ve API'yi yeniden başlat" savunulabilir
        bir akış değil.

        `parentDataset` boşsa `POST /shares` 503 veriyor. **Tahmin yok**: yanlış bir veri kümesi
        adı, hiçbir şeyin sunmadığı dataset'ler üretir — satır var, `zfs list` gösteriyor, ve
        paylaşım dosya yöneticisinde boş.

        Yalnız yöneticiye.
      responses:
        '200':
          description: Durum
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageSetup' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /storage/pools:
    post:
      tags: [system]
      summary: ZFS havuzu oluştur
      description: |
        **Bu uç disk siler.** §8.1'in sırası: analiz → plan → etkilenen disklerin seri/WWN
        listesi → yazılı onay → yeniden kimlik doğrulama → iş. Analiz `GET /system/disks`;
        gerisi burada.

        Üç reddediş AJANIN İÇİNDE, bir diyaloğun içinde değil — çünkü diyalog geçilen bir şeydir:

        1. `/`, `/boot` ya da `/boot/efi` taşıyan bir disk hiçbir onayla üye olamaz.
        2. Her disk için verilen `wwn`, havuz oluşturulduğu ANDA kutunun bildirdiğiyle eşleşmek
           zorunda. Sihirbazın diskleri listelediği ekranla düğmeye basıldığı an arasında bir disk
           çıkarılıp yerine başkası takılabilir, ve `/dev/disk/by-id` bir YUVAYI değil bir AYGITI
           adlandırır — yani ad tek başına hiçbir şeyi doğrulamaz.
        3. `-f` hiç geçilmiyor. `zpool create`, üstünde dosya sistemi olan bir aygıtı
           zorlanmadıkça reddeder; bu ürün o reddi geçersiz kılmıyor. **Üstünde bir şey olan bir
           diski temizlemek, operatörün kabuktan kendi yaptığı bir iştir.**

        `confirm` alanının işi niyeti kanıtlamak değil — onu parola yapıyor. İşi, tek tıkla
        geçilmesini engellemek.

        İş kuyruğa giriyor ve 202 dönüyor. Yeniden teslim güvenli: `zpool create` var olan bir
        havuz adı için başarısız olur, ve işleyici zaten önce havuzun var olup olmadığına bakıyor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePoolRequest' }
      responses:
        '202':
          description: İş kuyruğa alındı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          # Parola yanlış. Oturum geçerli olsa bile: §0.5, bu kadar riskli bir işlemi bir çerezin
          # gücüyle yapmıyor.
          $ref: '#/components/responses/Problem'
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /jobs:
    get:
      tags: [system]
      summary: İşleri listele — özellikle ölenleri
      description: |
        Yalnız yöneticiler. `GET /jobs/{jobId}` yalnızca kimliği ELİNDE OLANA cevap veriyor, ve bir
        işin ölmesi genellikle o kimliği taşıyan sayfa kapandıktan çok sonra oluyor. Böyle bir işi
        görebileceğin hiçbir yer yoktu.

        `dead`, `max_attempts` tükendiğinde veriliyor ve sessizce kaybolmuyor: satır
        `job_history`'ye taşınıyor. Ama taşınmak, birinin bakması demek değil — ADR-0003'ün
        "sistem alarmı üretir" cümlesinin karşılığı bu uç noktaydı ve yoktu.

        Neden önemli: ölen bir `permissions.apply` işi, veritabanında uygulanmış ama dosya
        sisteminde uygulanmamış bir izin demek. Yani web'de kapalı görünen bir klasör SMB'den
        açılmaya devam ediyor — §6.2'nin ve ADR-0004'ün adıyla yasakladığı iki gerçeklik. Deneme
        bütçesi bunu nadir kılıyor; nadir olan şey görünmez olmamalı.
      parameters:
        - name: status
          in: query
          required: false
          description: Verilmezse hepsi. Birden fazla için virgülle ayır.
          schema: { type: string, example: dead }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: İşler, en yenisi başta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPage' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [system]
      summary: Uzun süren bir işin durumu
      responses:
        '200':
          description: İş durumu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/Problem' }

  /events:
    get:
      tags: [events]
      summary: Olay akışı (Server-Sent Events)
      description: |
        §14'ün istediği gerçek zamanlı akış. TEK uç nokta: bir tarayıcı köken başına az sayıda
        bağlantı tutar ve ekran başına bir akış, dosya yöneticisi + işler + aktarımlar açıkken
        üçünü boş sokete harcardı. Olaylar tipli geliyor, istemci `event.type` üzerinden
        dağıtıyor — SSE'nin olay adının var olma sebebi bu.

        WebSocket değil. ADR-0018 bu kararı konsol için zaten yazdı ve buradaki gerekçe daha
        güçlü: bu akış doğası gereği tek yönlü, Nest'te `@Sse` çerçevede var, ve `EventSource`
        kendi kendine yeniden bağlanıp `Last-Event-ID` gönderiyor — §14'ün istediği tam olarak bu.

        ── Olay tipleri ────────────────────────────────────────────────────────

        `job` — kuyruktaki bir işin durumu değişti. Gövde: `JobEvent`. YALNIZ YÖNETİCİYE,
        çünkü `GET /jobs` de yalnız yöneticiye. Bir iş bittiğinde satır `job_queue`'dan
        `job_history`'ye geçiyor; akış ikisini de okuyor, yoksa her iş ilerler ve hiçbiri
        bitmezdi.

        `transfer` — bir yüklemenin konumu ilerledi ya da tamamlandı. Gövde: `TransferEvent`.
        YALNIZ YÜKLEMEYİ AÇAN KİŞİYE, çünkü `GET /transfers` de öyle. Kiracı geneli bir aktarım
        akışı, her üyeye diğer her üyenin ne yüklediğini dosya adıyla söylerdi.

        `ping` — 20 saniyede bir. Boştaki bir SSE bağlantısı yoldaki hiçbir şey için ölü bir
        bağlantıdan ayırt edilemez; ters vekil kapatır ve tarayıcı okumaya çalışana kadar fark
        etmez.

        ── Yeniden bağlanma ────────────────────────────────────────────────────

        Her olayın `id`'si, satırın `updated_at` değerinin epoch milisaniyesi. Tarayıcı yeniden
        bağlanırken bunu `Last-Event-ID` başlığıyla gönderiyor ve sunucu oradan devam ediyor.

        Teslimat EN AZ BİR KEZ: PostgreSQL mikrosaniye tutuyor, id milisaniye, ve devam noktası
        bir milisaniye geri sarılıyor. Kopya zararsız — her olay satırın tamamını taşıyor ve
        istemci id'ye göre değiştiriyor — ama bir eksik, ekranda sonsuza kadar "çalışıyor"
        kalan bir iş demek.

        Akış bir ANLIK GÖRÜNTÜ DEĞİL. Yeni açılan bir akış, o andan SONRA olanları taşıyor;
        istemci mevcut durumu sıradan REST ucundan alıyor. Dünkü bitmiş işleri yeni açılan bir
        ekrana tekrar oynatmak durum değil gürültü olurdu.
      responses:
        '200':
          description: Olay akışı
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '429':
          description: |
            Bu süreçte aynı anda tutulabilecek akış sayısına ulaşıldı. `Retry-After` taşır.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /notes:
    get:
      tags: [desk]
      summary: Kendi notlarını listele
      description: |
        Notlar yazarına özeldir. Bu, paylaşımlı bir not tahtasının daha kullanışlı olmadığı için
        değil — kimin kimin notunu okuyabileceği bir ACL sorusudur ve §6.2 Faz 2'dedir. İki
        seçenek arasından kimseyi şaşırtamayacak olan seçildi.

        Sayfalama yok: bir kişinin not sayısı, bir klasörün dosya sayısı gibi büyümüyor.
      responses:
        '200':
          description: Notlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotePage' }
    post:
      tags: [desk]
      summary: Not oluştur
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNoteRequest' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '422': { $ref: '#/components/responses/Problem' }

  /notes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [desk]
      summary: Notu düzenle
      description: |
        Yalnız yazarı. Başkasının notu 404 döner, 403 değil: 403 o notun var olduğunu söyler ve
        bir kiracının içinde bile "hangi notlar var" bir sızıntıdır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNoteRequest' }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [desk]
      summary: Notu sil
      description: Kalıcı. Bir notun çöp kutusu yok; metni saklamaya değecek bir bayt değil.
      responses:
        '204': { description: Silindi }
        '404': { $ref: '#/components/responses/Problem' }

  /tasks:
    get:
      tags: [desk]
      summary: İş panosu
      description: |
        Notların aksine PAYLAŞIMLI, ve bu tutarsızlık değil: bir iş birine atanır, ve göremediği
        bir iş atanmış sayılmaz. Pano organizasyondaki herkese açıktır.

        Tamamlananlar da döner — `doneAt` ile ayırt edilir. Filtreleme istemcinin işi, çünkü
        "bugün neyi bitirdik" panonun cevaplaması gereken sorulardan biri.
      responses:
        '200':
          description: İşler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
    post:
      tags: [desk]
      summary: İş ekle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [desk]
      summary: İşi güncelle — metin, atanan, tamamlanma, sıra
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTaskRequest' }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [desk]
      summary: İşi sil
      responses:
        '204': { description: Silindi }
        '404': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/files:
    get:
      tags: [tasks]
      summary: Göreve bağlı dosyalar
      description: |
        **Görev erişimi dosya erişimi vermiyor** (§7). Bu uç her bağ için dosyanın KENDİ izinlerini
        çözüyor ve çağıranın göremeyeceği satırları hiç döndürmüyor — göremediği bir dosyanın adı,
        yolu ya da paylaşımı bu yanıtta geçmiyor.

        Görülemeyenlerin SAYISI `hidden` alanında. Sıfır göstermek "burada başka bir şey yok"
        demek olurdu ve bu yanlış; sayıyı tamamen gizlemek bir görevi eksik gösterirdi. Sayı,
        "buraya bakman gereken bir şey var, ama sana değil" cümlesinin en az bilgi sızdıran hâli.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Bağlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskFileLinkPage' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [tasks]
      summary: Göreve dosya bağla
      description: |
        Bağlayanın o dosyada **en az `read`** izni olmak zorunda. Göremediği bir dosyayı bağlamak,
        onu görebilen birine "bu dosya var" demenin dolaylı yolu olurdu — ve daha kötüsü, bağın
        kendisi bir izin gibi okunabilirdi.

        Göremediği bir dosya için cevap **404**, 403 değil: 403 dosyanın var olduğunu söyler.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkTaskFileRequest' }
      responses:
        '201':
          description: Bağlandı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskFileLink' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/files/{linkId}:
    delete:
      tags: [tasks]
      summary: Bağı kaldır
      description: |
        Dosyaya dokunmuyor — yalnız bağı siliyor. Bağı kaldırmak için dosyayı GÖREBİLMEK gerekmiyor:
        göremediğin bir dosyanın bağı listende duruyorsa, onu kaldırabilmen gerekir, yoksa
        temizleyemeyeceğin bir satır kalır.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Kaldırıldı }
        '404': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/activity:
    get:
      tags: [tasks]
      summary: Görev denetim izi
      description: |
        §7: kim, neyi, ne zaman, hangi eski/yeni değerle değiştirdi. Silinen bir kullanıcının
        satırları KALIYOR, aktör anonimleşiyor — bir denetim kaydını hesapla birlikte silmek,
        onun en çok bakılacağı anı yok eder.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Aktivite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskActivityPage' }
        '404': { $ref: '#/components/responses/Problem' }

  /notifications:
    get:
      tags: [desk]
      summary: Bildirim merkezi
      description: |
        §7: "Hatırlatma, gecikme, mention ve görev değişiklikleri bildirim merkezine düşer."

        `task.comment` ve `task.mention` bir İŞARETÇİ, içeriğin kopyası değil: başlık yorumun
        metnini değil İŞİN metnini taşıyor. Sebep, aynı iş için okunmamış ikinci bir bildirimin
        yazılmaması — ilk başlık beş yorum sonra da ekranda duruyor, ve o başlık bir yorumun metni
        olsaydı yanıltıcı olurdu. Okuyan işe gidiyor ve hepsini orada görüyor.

        Bildirimler ALICI BAŞINA satır. Aynı olay iki kişiye iki farklı şey söylüyor — bir işin
        atanması, atanan için "sana iş geldi", eski atanan için "iş senden alındı" — ve tek satır
        ikisinden birini yanlış cümleyle karşılamak zorunda kalırdı.

        Kimse KENDİ yaptığı şey için bildirim almıyor.
      parameters:
        - name: unread
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Yalnız okunmamışlar.
      responses:
        '200':
          description: Gelen kutusu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }

  /notifications/read:
    post:
      tags: [desk]
      summary: Okundu işaretle
      description: |
        Gövdedeki id'ler, ya da gövde yoksa HEPSİ. Zaten okunmuş olanlar atlanıyor — yeniden
        işaretlemek "ne zaman okudum" cevabını bugüne kaydırırdı.

        Başkasının bildirimi sessizce atlanıyor: RLS kiracıyı tutuyor, kişiyi sorgu tutuyor, ve
        "bu senin değil" demek başkasının gelen kutusu hakkında bilgi vermek olurdu.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkNotificationsReadRequest' }
      responses:
        '200':
          description: Kaç tanesi işaretlendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationsRead' }

  /tags:
    get:
      tags: [tasks]
      summary: Kiracının etiket sözlüğü
      description: |
        Kullanım sayılarıyla, ada göre. Sayı, hangi etiketlerin gerçekten kullanıldığını ve
        hangilerinin bir kez yazılıp unutulduğunu söylüyor — bir sözlüğün bakımı için gereken tek
        bilgi.
      responses:
        '200':
          description: Etiketler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagPage' }
    post:
      tags: [tasks]
      summary: Etiket oluştur
      description: |
        HERKESE AÇIK. Oluşturmayı yöneticiye kilitlemek, etiketlemeyi bir talep sürecine çevirir ve
        kimse kullanmaz.

        AYNI AD VARSA VAR OLANI DÖNDÜRÜYOR, hata vermiyor: buradaki niyet "bu adda bir etiket
        olsun", ve zaten varsa istenen şey olmuş demektir. Bu, arayüzde hem seçmeye hem oluşturmaya
        izin veren tek bir kutu olmasını sağlıyor.

        Benzersizlik KATLANMIŞ ad üzerinden — kullanıcı adlarındaki `fold_identity`, yani
        büyük/küçük harf ve Türkçe i ailesi katlanıyor, aksanlar katlanmıyor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTagRequest' }
      responses:
        '201':
          description: Oluşturuldu ya da zaten vardı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '422': { $ref: '#/components/responses/Problem' }

  /tags/{tagId}:
    patch:
      tags: [tasks]
      summary: Etiketi yeniden adlandır ya da rengini değiştir
      description: |
        YALNIZ YÖNETİCİ. Bir adı değiştirmek, onu kullanan HER İŞİN anlamını değiştiriyor — bir
        üyenin yanlışlıkla yaptığı bir şeyin otuz işi etkilemesi, geri alınması en zor hata sınıfı.

        `POST /tags`'in tersine sessizce birleştirmiyor: ad başka bir etikete aitse 409. "Bunu şu ad
        yap" diyen biri, iki etiketin tek etikete dönüşeceğini bilmeli.
      parameters:
        - { name: tagId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTagRequest' }
      responses:
        '200':
          description: Değişti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tasks]
      summary: Etiketi sil
      description: |
        YALNIZ YÖNETİCİ, ve KİRACI ÇAPINDA: etiket her işten kalkıyor. Cevap kaç işten kalktığını
        söylüyor, ve arayüz onu silmeden ÖNCE soruyor — sessiz bir kaskat veri kaybının en sık
        biçimi, ve burada kaybedilen şey otuz işin sınıflandırması.
      parameters:
        - { name: tagId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Silindi
          content:
            application/json:
              schema:
                type: object
                required: [removedFrom]
                properties:
                  removedFrom:
                    type: integer
                    description: Etiketin kalktığı iş sayısı.
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/tags/{tagId}:
    put:
      tags: [tasks]
      summary: İşe etiket tak
      description: Zaten takılıysa hiçbir şey olmuyor; cevap yine 204.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tagId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Takıldı
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tasks]
      summary: Etiketi işten kaldır
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tagId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Kaldırıldı
        '404': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/checklist:
    get:
      tags: [tasks]
      summary: Görevin kontrol listesi
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Maddeler, kullanıcının dizdiği sırayla
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChecklistPage' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [tasks]
      summary: Kontrol listesine madde ekle
      description: |
        Madde listenin SONUNA ekleniyor ve sırasını sunucu hesaplıyor. İstemciden bir `position`
        almak, aynı anda madde ekleyen iki kişiyi aynı sırayı isteyen iki kişiye çevirirdi.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChecklistItemRequest' }
      responses:
        '201':
          description: Eklendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChecklistPage' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/checklist/{itemId}:
    patch:
      tags: [tasks]
      summary: Maddeyi tikle ya da tiki kaldır
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        '204':
          description: İşaretlendi
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tasks]
      summary: Maddeyi sil
      description: |
        GERÇEKTEN siliniyor, yorumların tersine. Fark bilinçli: bir yorum bir kişinin söylediği şey
        ve kaydı korunmalı; bir kontrol listesi maddesi bir hatırlatma, ve yanlış yazılmış bir
        hatırlatmanın "bu madde silindi" diye listede durması yalnız gürültü. Ne olduğu denetim
        izinde kalıyor.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Silindi
        '404': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/comments:
    get:
      tags: [tasks]
      summary: Görevin yorumları
      description: |
        ESKİ ÖNCE: bir tartışma yukarıdan aşağı okunuyor. (Bildirim listesi en yeni önce, çünkü
        orada okunacak olan son olay.)

        Silinmiş bir yorumun SATIRI dönüyor, GÖVDESİ dönmüyor — `deleted: true` ve boş bir `body`.
        Bir konuşmadan sessizce kaybolan bir replika okuyanı kendi hafızasından şüphe ettirir;
        "bu yorum silindi" ise okunabilir bir kayıt.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Yorumlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskCommentPage' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [tasks]
      summary: Yorum ekle
      description: |
        MENTION SUNUCUDA ÇÖZÜLÜYOR. İstek bir alıcı listesi TAŞIMIYOR ve taşıyamaz: öyle bir alan,
        gövdede adı hiç geçmeyen birine bildirim göndermenin yolu olurdu. Sunucu yalnız gövdede
        gerçekten yazan `@ad`'leri, yalnız kendi kiracısında çözüyor.

        Bulunamayan ad sessizce düşüyor — "böyle bir kullanıcı yok" demek, yorum kutusunu bir
        kullanıcı adı yoklama aracına çevirirdi.

        Yorum yazmak İZLEYİCİ YAPIYOR: konuşmaya girmek, devamını duymak istemek demek. Anılmak
        izleyici YAPMIYOR — bir kez anılmanın kişiyi işin bütün gelecek gürültüsüne kaydetmesi,
        insanların bildirimleri okumayı bırakma sebebi.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCommentRequest' }
      responses:
        '201':
          description: Eklendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskComment' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/comments/{commentId}:
    patch:
      tags: [tasks]
      summary: Kendi yorumunu düzenle
      description: |
        YALNIZ YAZAN, yönetici bile değil. Bir yöneticinin başkasının ağzından cümle
        değiştirebilmesi, yorum listesini alıntılanamaz yapardı — ve bir tartışma kaydının tek işi
        alıntılanabilir olmak. Yöneticinin yapabileceği şey silmek, ve silinen bir yorum silindiğini
        söylüyor.

        Düzenleme yeni bildirim üretmiyor, mention eklense bile: bir düzenlemeyle birine bildirim
        göndermek, yazılmış bir cümleyi sonradan bir çağrıya çevirmek olurdu.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCommentRequest' }
      responses:
        '200':
          description: Düzenlendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskComment' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tasks]
      summary: Yorumu sil
      description: |
        Yazan ya da yönetici. YUMUŞAK silme: satır ve gövdesi tabloda kalıyor, API gövdeyi bir daha
        döndürmüyor, ve `task_activity`'ye bir denetim satırı düşüyor. Bir yorumun silinmiş olması,
        en çok bakılacak an geldiğinde ne yazdığını da bilmeyi gerektirir.

        403, 404 DEĞİL: yorumun var olduğu zaten listede görünüyor, o yüzden gizlenecek bir şey yok
        ve "böyle bir yorum yok" demek okuyanı kendi ekranıyla çelişkiye düşürürdü.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Silindi
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/watchers:
    get:
      tags: [tasks]
      summary: Görevi kim izliyor
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: İzleyiciler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskWatcherPage' }
        '404': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/watch:
    put:
      tags: [tasks]
      summary: Bu işi izlemeye başla
      description: |
        YALNIZ ÇAĞIRAN İÇİN. Gövde yok ve bir `userId` parametresi de yok, bilerek: başkası adına
        abone olabilmek, bir kişiye istemediği bildirimleri göndermenin yolu olurdu, ve o kişinin
        geri almaktan başka yapabileceği bir şey olmazdı.

        Zaten izliyorsa hiçbir şey olmuyor; cevap yine 204.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: İzleniyor
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tasks]
      summary: İzlemeyi bırak
      description: |
        Nasıl abone olduğuna bakmıyor: atandığı için otomatik eklenmiş biri de çıkabiliyor. "Bu işi
        bırakamazsın, çünkü sana atandı" demek bildirimi bir cezaya çevirirdi — ve o kişi işi
        bıraktığında değil, bildirimleri okumayı bıraktığında kaybediliyor.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: İzlenmiyor
        '404': { $ref: '#/components/responses/Problem' }

  /me/preferences:
    get:
      tags: [me]
      summary: Arayüz tercihleri
      description: |
        Arka plan seçimi, ses, ve ana ekrandaki kısayolların yerleşimi. Sunucuda tutulur çünkü
        localStorage bir tarayıcıya aittir: telefondan giren aynı kişi kendi masasını bulmalı.

        Hiç yazılmamışsa boş bir belge döner, 404 değil — "tercih yok" bir hata değil, varsayılan.
      responses:
        '200':
          description: Tercihler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
    put:
      tags: [me]
      summary: Arayüz tercihlerini yaz
      description: |
        Tamamını değiştirir, birleştirmez. Kısmi birleştirme, iki sekmenin birbirinin kısayol
        yerleşimini yarım yazması demek olurdu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: Yazıldı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '422': { $ref: '#/components/responses/Problem' }

  /transfers:
    get:
      tags: [uploads]
      summary: Süren ve yakın zamanda biten aktarımlar
      description: |
        `upload_sessions` tablosundan okunur; ayrı bir kayıt tutulmaz. Bu, listenin
        SUNUCUNUN bildiği aktarımları gösterdiği anlamına gelir — başka bir sekmede başlayan bir
        yükleme de burada görünür, ki bir aktarım listesinin varlık sebebi tam olarak budur.

        İndirmeler burada YOK: indirme tek bir HTTP isteği ve sunucu tarafında durumu yok.
      responses:
        '200':
          description: Aktarımlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferPage' }

  /backups:
    get:
      tags: [system]
      summary: DEPSIS'in aldığı anlık görüntüler
      description: |
        Havuzdaki anlık görüntülerin listesi DEĞİL, ve bu fark önemli. Ajanın işlem kümesi kapalı
        (ADR-0006) ve içinde `CreateSnapshot` ile `DiffSnapshots` var ama "listele" yok. Biri
        Rust tarafına o işlemi ekleyene kadar dürüstçe gösterilebilecek şey, DEPSIS'in kendi
        aldıklarının kaydıdır. Kabuktan alınmış bir anlık görüntü burada görünmez ve arayüz bunu
        söylemek zorundadır.
      responses:
        '200':
          description: Anlık görüntüler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotPage' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [system]
      summary: Anlık görüntü al
      description: |
        Yalnız yöneticiler. Ajanın `CreateSnapshot` işlemi çağrılır; ajan doğrularsa satır yazılır.
        Sıra bu yönde: önce satır yazıp sonra ajanı çağırmak, ajan reddettiğinde var olmayan bir
        yedeği listeleyen bir kayıt bırakırdı.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSnapshotRequest' }
      responses:
        '201':
          description: Alındı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /files/{id}/permanent:
    parameters:
      - $ref: '#/components/parameters/FileId'
    delete:
      tags: [files]
      summary: Çöpten kalıcı olarak sil
      description: |
        Baytları siler. Geri alınamaz ve bu yüzden ÇÖPTEKİ bir girdide çalışır: çöpte olmayan bir
        girdi 409 alır. Bir tıklamayla kalıcı silme, bir tıklamayla veri kaybıdır; çöp kutusu o
        tıklamanın arasına giren şey.

        Klasör silmek ÖZYİNELEMELİ ve alttan yukarı: API ağacı biliyor, ajan bilmiyor. Her yaprak
        için bir `RemoveEntry` çağrısı gider ve klasörün kendisi en sona kalır. Bu, tek bir
        "rekürsif sil" işlemi eklemekten yavaş ama ajanın işlem kümesini `rm -rf` yetkisiyle
        genişletmiyor — kapalı kümenin bütün anlamı bu.

        Yarıda kesilirse silinenler silinmiş kalır: işlem atomik DEĞİL ve olamaz. Kısmen silinmiş
        bir ağaç çöpte durmaya devam eder ve tekrar çağırmak kaldığı yerden devam eder.
      responses:
        '204': { description: Silindi }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          # Çöpte olmayan bir girdi. 404 yanlış olurdu — girdi VAR, yalnızca bu işlem için
          # doğru durumda değil, ve kullanıcıya "önce çöpe at" demek gerekiyor.
          $ref: '#/components/responses/Problem'
        '503': { $ref: '#/components/responses/Problem' }

  /files/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/FileId'
    post:
      tags: [files]
      summary: Çöp kutusundan geri al
      description: |
        Geri alma, adın hâlâ boş olmasını gerektirir: çöpe atılmış bir dosya adını rehin tutmaz
        (0008'deki kısmi benzersizlik indeksleri), yani aynı adla yenisi oluşturulmuş olabilir.
        Böyle bir durumda 409 döner ve kullanıcıdan yeniden adlandırması beklenir — sessizce
        "(1)" eklemek, iki dosyadan hangisinin hangisi olduğunu kimsenin bilemeyeceği yerdir.
      responses:
        '200':
          description: Geri alındı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileEntry' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /console:
    post:
      tags: [console]
      summary: Yönetici konsolu oturumu aç
      description: |
        ADR-0018. Üç kapı: yönetici rolü, mevcut parola, ve süre sınırı.

        Parola oturum zaten varken de isteniyor. Bir oturum, birinin açık bıraktığı bilgisayarı
        ödünç alanın sahip olduğu şeydir; bir kabuk ise cihazın tamamıdır. Parola değişikliğinde
        aynı gerekçeyle aynı şey yapılıyor.

        Konsol AYRICALIKLI AJANDA ÇALIŞMAZ. Kendi systemd birimi olan ayrı bir servis, varsayılan
        olarak ayrıcalıksız bir kullanıcıyla. §2.2'nin "aracı serbest komut kabul etmemeli"
        kuralı bozulmadı; aracı bu işin hiçbir yerinde yok.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenConsoleRequest' }
      responses:
        '201':
          description: Oturum açıldı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleSession' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503':
          # Konsol servisi kapatılabilir bir birim — `systemctl disable depsis-console` özelliği
          # tamamen kapatır. Kapalıyken 500 değil 503 dönmek, "bozuk" ile "kapalı" arasındaki
          # farkı koruyor.
          $ref: '#/components/responses/Problem'
    get:
      tags: [console]
      summary: Açık konsol oturumları
      description: Yalnız yöneticiler. Bir yöneticinin "şu an kimin kabuğu açık" sorusu.
      responses:
        '200':
          description: Oturumlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleSessionPage' }
        '403': { $ref: '#/components/responses/Problem' }

  /console/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [console]
      summary: Oturumu kapat
      responses:
        '204': { description: Kapatıldı }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /console/{id}/input:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [console]
      summary: Konsola tuş gönder
      description: |
        Gövde ham metindir, satır değil: bir terminal karakter karakter çalışır ve Ctrl-C,
        sekme tamamlama, ok tuşları hep bayt dizileridir. Satır bazlı bir uç, terminal olmazdı.

        Denetim için satırlar ayrıca toplanır (`console_commands`), ama bu uç noktanın işi değil —
        konsol servisi tam bir satır gördüğünde yazar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsoleInput' }
      responses:
        '204': { description: İletildi }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '410':
          description: Oturum kapanmış — boşta kalma süresi ya da üst sınır.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /console/{id}/resize:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [console]
      summary: Pencere boyutunu bildir
      description: |
        Pty'nin satır/sütun sayısı. Bildirilmezse `top` ve `vim` yanlış boyutta çizer ve satır
        kaydırma bozulur — bir terminalin gerçekten terminal olup olmadığı buradan anlaşılır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsoleResize' }
      responses:
        '204': { description: Bildirildi }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /console/{id}/stream:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [console]
      summary: Konsol çıktısı (Server-Sent Events)
      description: |
        WebSocket değil. Nest'te SSE çerçevede zaten var, WS ise bir gateway ve ek bağımlılık
        istiyor; bir terminalin gecikme bütçesi insan yazma hızı ve SSE bunun için fazlasıyla
        yeterli. Tek yönlü olması eksiklik değil — giriş zaten ayrı ve küçük bir istek.

        Her olay bir `data:` satırı; içerik base64, çünkü terminal çıktısı UTF-8 sınırlarını
        ortadan bölebilen ham bayttır ve SSE metin taşır.
      responses:
        '200':
          description: Olay akışı
          content:
            text/event-stream:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /apps:
    get:
      tags: [apps]
      summary: Uygulama kataloğu ve kurulu olanlar
      description: |
        ADR-0019. Katalog küratörlüdür: kullanıcı imaj adı yazamaz. Serbest imaj adı, kullanıcının
        internetten indirilen keyfi kodu çalıştırabilmesi demektir.

        Her satırın durumu podman'dan OKUNUR, veritabanından değil. Bir kolona yazılsaydı cihaz
        yeniden başladığında yalan söylerdi.

        GET /apps HER ZAMAN 200 döner — podman kurulu olmasa bile. Katalog veritabanında duruyor
        ve onu listelemek için çalışma zamanı gerekmiyor; kurulu uygulamaların durumu ise
        `unknown` olur ve `runtime.available` false gelir.

        Önceki hâlinde burada bir 503 yayımlanmıştı ve o dal artık ulaşılamaz. Ulaşılamaz bir
        durum kodunu belgede bırakmak, belgelenmemiş bir koddan daha kötü: istemci onun için bir
        dal yazar ve o dal hiç çalışmaz. Aynı karar `GET /remote` için de verildi, aynı gerekçeyle.

        Değiştiren uçlar (kur/başlat/durdur/kaldır) 503 döndürmeye devam eder: orada yapılamayan
        gerçek bir iş var.
      responses:
        '200':
          description: |
            Uygulamalar. `runtime.available` false ise konteyner çalışma zamanı yok ve kurulu
            uygulamaların durumu `unknown`'dır.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppPage' }

  /apps/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
    post:
      tags: [apps]
      summary: Uygulamayı kur
      description: |
        Yalnız yöneticiler. İmaj indirilir ve konteyner oluşturulur; bağlama noktaları KATALOGDAN
        gelir, istekten değil. İstek yalnızca hangi paylaşımın hangi hedefe bağlanacağını seçer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstallAppRequest' }
      responses:
        '201':
          description: Kuruldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [apps]
      summary: Başlat veya durdur
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppStateRequest' }
      responses:
        '200':
          description: Uygulandı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [apps]
      summary: Uygulamayı kaldır
      description: |
        Konteyner silinir. BAĞLANAN PAYLAŞIMLARA VE İÇERİKLERİNE DOKUNULMAZ — bir uygulamayı
        kaldırmanın kullanıcının fotoğraflarını silmesi, bu üründe olabilecek en kötü şeylerden
        biri. Podman'a `v=false` geçilir, yani hiçbir volume kaldırılmaz.

        HİÇBİR VERİ SİLİNMEZ, uygulamanın kendi ayarları dahil: katalogdaki `/config` ve `/data`
        gibi hedefler volume değil, kullanıcının seçtiği paylaşıma bind mount. Belgenin önceki
        hâli ayar biriminin silindiğini söylüyordu ve bu doğru değildi — silinmiş bir şeyi
        söylemekten daha kötü olan tek şey, silinmediği hâlde silindiğini söylemek.

        Yanıt gövdesizdir (204), yani "ne silindi" diye anlatacağı bir yer de yok.
      responses:
        '204': { description: Kaldırıldı }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /apps/{slug}/logs:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
    get:
      tags: [apps]
      summary: Uygulamanın son günlük satırları
      description: |
        "Neden çalışmıyor" sorusunun tek dürüst cevabı çoğu zaman burada. Günlük olmadan bir
        uygulama kataloğu, çalışmadığında yapılacak hiçbir şey bırakmaz.
      parameters:
        - name: lines
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Günlük
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppLogs' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /remote:
    get:
      tags: [remote]
      summary: Uzak erişim durumu
      description: |
        ADR-0020. Düğüm kimliği ve katılınan ağlar. Her kullanıcı görebilir — kendi cihazının
        kimliğini bilmek bir sır değil.

        Bir ağın `authorized` alanı false ise cihaz o ağa KATILMIŞ ama ONAYLANMAMIŞTIR ve hiçbir
        trafik akmaz. Arayüz bunu "bağlanıyor" diye göstermemeli: kullanıcının ZeroTier Central'da
        bir kutu işaretlemesi gerekiyor ve bunu bilmezse ürünü bozuk sanar.

        Bu uç HER ZAMAN 200 döner — daemon kurulu değilse de. Belgenin önceki hâli hem 503 hem de
        `available` bayrağı tarif ediyordu ve ikisi aynı anda doğru olamaz; uygulayan ajan da bunu
        bir çelişki olarak bildirdi.

        200 seçildi çünkü ZeroTier'in KURULU OLMAMASI bir arıza değil, bir durum: cihazın
        çoğunluğu onsuz çalışıyor ve DEPSIS onu paketlemiyor. Bir arayüz kartının "uzak erişim
        kurulu değil, şöyle kurulur" yazabilmesi için okunabilir bir cevap gerekiyor, hata değil.
        Bunun `/system/telemetry`'nin 503'üyle çeliştiği doğru ama sebebi var: depolama ajanının
        yokluğu GERÇEKTEN bir arıza — havuzsuz bir NAS çalışmıyor demektir.

        Değiştiren uçlar (katıl/ayrıl) 503 döndürmeye devam eder: orada yapılamayan gerçek bir iş var.
      responses:
        '200':
          description: |
            Durum. `available: false` ise zerotier-one kurulu değil ya da çalışmıyor ve diğer
            alanlar boştur.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteStatus' }

  /remote/networks:
    post:
      tags: [remote]
      summary: Ağa katıl
      description: |
        Yalnız yöneticiler: bir ağa katılmak cihazı o ağdaki herkese görünür kılar ve bu bir
        yönetim kararı.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinNetworkRequest' }
      responses:
        '201':
          description: Katılındı — onay bekleniyor olabilir
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteNetwork' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /remote/networks/{networkId}:
    parameters:
      - name: networkId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9a-f]{16}$' }
    delete:
      tags: [remote]
      summary: Ağdan ayrıl
      responses:
        '204': { description: Ayrılındı }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /teams:
    get:
      tags: [teams]
      summary: Ekipler
      description: |
        §6.1'in hiyerarşisinde ekip, organizasyon ile kullanıcı arasındaki katman. İzinler ekibe
        verilir ve kullanıcı ekibe girer — ADR-0004'ün "ACL girdileri kullanıcıya değil gruba
        verilir" kuralı bu. POSIX ACL'ler ~30 girdiden sonra hantallaşıyor ve mask semantiği
        ısırıyor, yani bu bir düzen tercihi değil bir zorunluluk.

        Her kullanıcı listeyi görür: bir ekibin var olduğu, o ekipte olmayan birinden saklanacak
        bir şey değil ve izin verirken hedefi seçebilmek gerekiyor. Üyelik listesi ayrı bir uçta.
      responses:
        '200':
          description: Ekipler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamPage' }
    post:
      tags: [teams]
      summary: Ekip oluştur
      description: |
        Yalnız yöneticiler. Satır yazılır ve POSIX grubu ayrıca ayrılır; grup dosya sistemine
        yansıtılana kadar `posixGid` null kalır ve bu ekibe verilen izin SMB'de görünmez.
        Yanıt bunu saklamıyor — arayüzün söyleyebilmesi gerekiyor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTeamRequest' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /teams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [teams]
      summary: Ekibi yeniden adlandır
      description: |
        Yalnız organizasyon yöneticileri ya da o ekibin yöneticisi (§6.1: "Ekip yöneticisi —
        kendi ekibi içindeki kullanıcı, klasör ve görevler").
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTeamRequest' }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [teams]
      summary: Ekibi sil
      description: |
        Yalnız organizasyon yöneticileri. Ekibe verilmiş İZİNLER de gider (`ON DELETE CASCADE`) ve
        bu sessiz bir yan etki olamaz: silme, kaç klasörde kaç kişinin erişimini kaybedeceğini
        döndüren bir ön izleme ister. `?dryRun=true` ile çağrıldığında hiçbir şey silinmez ve
        yalnız etki döner — §6.2'nin "her izin değişimi dry-run ile etkilenecek kullanıcı/klasör
        sayısını göstermeli" şartı burada da geçerli, çünkü ekip silmek toplu bir izin
        değişikliğidir.
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Ön izleme (yalnız dryRun=true ile)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionImpact' }
        '204': { description: Silindi }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /teams/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [teams]
      summary: Ekip üyeleri
      responses:
        '200':
          description: Üyeler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMemberPage' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [teams]
      summary: Üye ekle veya üyeliğini güncelle
      description: |
        PUT, POST değil: aynı kullanıcıyı iki kez eklemek bir hata değil, aynı durumu iki kez
        istemektir. `teamAdmin` bayrağını değiştirmek de aynı çağrı.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamMembershipRequest' }
      responses:
        '200':
          description: Üyelik yazıldı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /teams/{id}/members/{userId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [teams]
      summary: Üyeyi çıkar
      description: |
        Bir kişiyi ekipten çıkarmak, o ekibin bütün izinlerini o kişiden almaktır. §6.2'nin
        deny'sız modelinde "şu kişi hariç herkes" demenin TEK yolu bu, o yüzden sık kullanılacak
        ve etkisi görünür olmalı: `?dryRun=true` kaç klasörün erişimini kaybedeceğini döndürür.
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Ön izleme (yalnız dryRun=true ile)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionImpact' }
        '204': { description: Çıkarıldı }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /files/{id}/permissions:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [permissions]
      summary: Bu klasörün izinleri
      description: |
        İki ayrı şey döner ve karıştırılmamalı:

        - `effective` — ÇAĞIRANIN bu klasörde gerçekten yapabildikleri, miras hesaplandıktan
          sonra. Arayüz düğmeleri buna göre çizer.
        - `grants` — bu düğümde AÇIKÇA yazılmış izin satırları. Yalnız `manage` iznine sahip
          olana döner; olmayan için boş dizi gelir, çünkü kimin nereye erişebildiği kendi başına
          bir bilgidir.

        `inheritedFrom`, `effective` kümesinin hangi atadan geldiğini söyler (bu düğümün kendisi
        ise kendi kimliği, hiç grant yoksa null). ADR-0021'in miras kuralı temsilci başına EN
        YAKIN atayı seçtiği için "bu izin nereden geliyor" cevaplanabilir bir soru ve
        cevaplanmalı — aksi hâlde bir yöneticinin izni nereden kaldıracağını bulması imkânsız.
      responses:
        '200':
          description: İzinler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderPermissions' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [permissions]
      summary: Bu klasörün açık izinlerini yaz
      description: |
        `manage` izni gerekiyor — `modify` YETMEZ. Bir klasöre yazabilen herkesin o klasörün
        iznini de değiştirebilmesi, yetki modelinin kendi kendini geçersiz kılmasıdır (ADR-0021).

        Gövde bu düğümdeki grant'ların TAMAMINI değiştirir. Kısmi birleştirme, iki yöneticinin
        birbirinin izin listesini yarım yazması demek olurdu.

        `?dryRun=true` ile hiçbir şey yazılmaz ve yalnız etki döner. §6.2 bunu şart koşuyor ve
        gerekçesi somut: miras bir alt ağacın tamamını değiştiriyor, yani "şu klasörü ekibe
        açayım" tıklaması kişinin farkında olmadığı beş yüz dosyayı açabilir.

        İzinler dosya sistemine ANINDA yansımaz. POSIX ACL'lerin yeniden yazılması bir iş
        kuyruğu görevi ve tamamlanana kadar iki katman ayrışıktır (ADR-0021'in kabul edilen
        borcu); yanıt `applyingJobId` ile bunu söyler ve arayüz "izinler uygulanıyor"
        gösterebilir.
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetFolderPermissionsRequest' }
      responses:
        '200':
          description: Yazıldı, ya da dryRun ise ön izleme
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionWriteResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /shares/{id}/permissions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [permissions]
      summary: Paylaşım kökünün izinleri
      description: |
        `/files/{id}/permissions` ile aynı şey, kök için. Ayrı bir uç nokta olmasının sebebi
        kimlik uzayları: bir paylaşım `file_entries` satırı DEĞİL, ve bir uç noktanın iki farklı
        tablodan kimlik kabul etmesi, hangisinin bulunamadığını söyleyemeyen bir 404 üretir.
      responses:
        '200':
          description: İzinler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderPermissions' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [permissions]
      summary: Paylaşım kökünün açık izinlerini yaz
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetFolderPermissionsRequest' }
      responses:
        '200':
          description: Yazıldı, ya da dryRun ise ön izleme
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionWriteResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: depsis_session
      description: |
        Sunucu tarafı oturum. JWT kullanılmaz — güvenlik olayında tüm oturumların iptal
        edilebilmesi gerekiyor ve stateless token bunu ucuz yapmıyor (ADR-0009).

  parameters:
    FileId:
      name: id
      in: path
      required: true
      description: Kararlı dosya kimliği. Yol asla kimlik olarak kullanılmaz (ADR-0005).
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Opak. İstemci bunu üretmez ve ayrıştırmaz; kodlaması sunucuya aittir.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Kullanıcı ve uç kapsamında benzersiz. Aynı anahtar farklı bir istek parmak iziyle
        gelirse 409 döner. RFC yoktur — IETF taslağı Expired and archived durumundadır — bu
        yüzden semantik burada tanımlanır (ADR-0008).
      schema: { type: string, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      description: Çakışma kontrolü. Eşleşmezse 412.
      schema: { type: string }

  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail:
          type: string
          description: Secret, dosya içeriği veya çağıranın görmeye yetkili olmadığı yol içermez.
        instance: { type: string }
        code:
          type: string
          description: Kapalı küme. Kaynak tanım packages/contracts/src/errors.ts.
        correlationId:
          type: string
          description: Her yanıtta ve aynı isteğin her log satırında bulunur (§14).
        errors:
          type: array
          items: { $ref: '#/components/schemas/ProblemFieldError' }
        retryAfter: { type: integer, minimum: 0 }

    JobEvent:
      type: object
      description: |
        `event: job` olayının gövdesi. Medya tipi `text/event-stream` olduğu için şema oradan
        referans verilemiyor — bu tanım, akışın taşıdığı JSON'ın sözleşmedeki karşılığı.
      required: [id, kind, status, progress, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, dead] }
        progress: { type: number, minimum: 0, maximum: 1 }
        createdAt: { type: string, format: date-time }
        error:
          type: object
          required: [title]
          properties:
            title: { type: string }

    TransferEvent:
      type: object
      description: '`event: transfer` olayının gövdesi.'
      required: [id, filename, lengthBytes, offsetBytes, completed]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        lengthBytes: { type: integer, format: int64 }
        offsetBytes: { type: integer, format: int64 }
        completed: { type: boolean }

    TrashPolicy:
      type: object
      required: [retentionDays, updatedAt, impact]
      properties:
        retentionDays:
          type: integer
          nullable: true
          description: '`null`: süresiz sakla. Varsayılan bu.'
        updatedAt: { type: string, format: date-time, nullable: true }
        impact:
          type: object
          required: [entries, files, bytes, oldestTrashedAt]
          properties:
            entries:
              type: integer
              description: |
                Süresi dolmuş ÜST DÜZEY girdiler. Çöpe atılmış bir klasör, içinde ne olursa olsun
                bir kez sayılır.
            files:
              type: integer
              description: Onların altındaki dosyalar, özyinelemeli. Temizlemenin süresini bu belirler.
            bytes:
              type: integer
              format: int64
              description: |
                Geri kazanılacak baytlar. KÖKLERİN değil, altlarındaki DOSYALARIN toplamı — bir
                klasörün `size_bytes` değeri 0 olduğu için kökleri toplamak yalan söylerdi.
            oldestTrashedAt: { type: string, format: date-time, nullable: true }

    PasswordResetTicket:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
          description: |
            Tek kullanımlık. Bir daha gösterilmiyor — sunucuda yalnız SHA-256 özeti duruyor.
        expiresAt: { type: string, format: date-time }

    ProblemFieldError:
      type: object
      required: [pointer, code, message]
      properties:
        pointer: { type: string }
        code: { type: string }
        message: { type: string }

    FileName:
      type: string
      minLength: 1
      maxLength: 255
      description: |
        Windows'ta yasak karakterler, ayrılmış adlar (CON, PRN, AUX, NUL, COM1 vb.) ve
        sondaki nokta/boşluk sunucu tarafında reddedilir — SMB istemcileri o dosyalara
        erişemezdi.

    LoginRequest:
      type: object
      required: [username, password]
      description: |
        Kullanıcı adı ve parola. İki alan da bir zamanlar başka bir şeydi ve ikisi de gerçek bir
        giriş hatasından sonra değişti.

        `organizationSlug` KALDIRILDI. Şema "kiracı, kullanıcıdan önce çözülmek zorunda" diyordu ve
        bu doğru — ama `system_setup` bir singleton, yani bir DEPSIS kutusunda tam olarak bir
        organizasyon var ve hep olacak. Tek cevabı olan bir soruyu sormanın tek etkisi, yanlış
        cevaplanabilmesiydi: sonunda tek boşluk olan bir slug sunucunun biçim kontrolünü geçemiyor
        ve yanlış paroladan ayırt edilemeyen bir retle dönüyor. Sunucu artık kutunun kendi
        organizasyonunu çözüyor (`resolve_sole_organization`) ve birden fazla olursa reddediyor.

        `email` yerine `username`. Yerel ağdaki bir NAS posta göndermiyor ve hiçbir adresi
        doğrulamıyor; adres, yazılacak ve yanlış yazılacak ikinci bir şeydi. Adres alanı duruyor
        ama isteğe bağlı ve kimlik doğrulamada kullanılmıyor.
      properties:
        username:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
        organizationSlug:
          type: string
          maxLength: 63
          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
          description: |
            İSTEĞE BAĞLI ve arayüz bunu hiç göndermiyor. Yalnız kutuda birden fazla organizasyon
            varsa gerekiyor — sahiplenilmiş bir cihazda asla olmayan bir durum. Alan silinmedi
            çünkü kapsadığı varsayımın çökerek değil, zarifçe bozulması gerekiyor.
        password: { type: string, maxLength: 1024 }

    MfaVerifyRequest:
      type: object
      required: [code]
      description: |
        `challengeId` taşımıyor — meydan okuma çerezde (bkz. LoginResult).
      properties:
        code:
          type: string
          maxLength: 64
          description: |
            TOTP kodu VEYA kurtarma kodu. Ayrı uç yok ve desen dar değil, ikisi de kasıtlı:
            sunucu hangisi olduğunu ŞEKİLDEN anlıyor, çağırana sormuyor. Soran bir arayüz,
            saldırganın zayıf bulduğu dala yönlendirme yapmasına izin verirdi.

    LoginResult:
      type: object
      required: [status]
      description: |
        Kimlik bilgisi yanlışsa 401 döner ve gövde kullanıcının var olup olmadığını ayırt
        ettirmez.

        `challengeId` YOK, ve bu kasıtlı bir değişiklik: bekleyen giriş bir gövde alanı değil,
        `HttpOnly` + `SameSite=Strict` bir çerez. Gövdedeki bir kimlik script tarafından
        okunabilir ve istemciler arasında taşınabilirdi; çerez okunamıyor. Gövde yalnız hangi
        ekranın gösterileceğini söylüyor.
      properties:
        status:
          type: string
          enum: [ok, mfa_required]

    MfaVerifyResult:
      type: object
      required: [status, usedRecoveryCode]
      description: |
        204 değil, çünkü söylenmeye değer bir şey var: bir kurtarma kodu harcandıysa arayüz
        kaç tane kaldığını gösterip yeniden kayda yönlendirebilmeli. Kullanıcıyı arayıp
        bulmaya bırakmak, fark etmekle bitirmek arasındaki fark.
      properties:
        status: { type: string, enum: [ok] }
        usedRecoveryCode: { type: boolean }

    HealthStatus:
      type: object
      required: [status, database, role]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [reachable, unreachable] }
        role:
          type: [string, 'null']
          description: Bağlanılan veritabanı rolü; erişilemiyorsa null.

    SetupClaimRequest:
      type: object
      required: [token, organizationSlug, organizationName, adminUsername, adminPassword]
      properties:
        token: { type: string, maxLength: 128 }
        organizationSlug:
          type: string
          maxLength: 63
          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
        organizationName: { type: string, maxLength: 200 }
        adminUsername:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
        adminPassword:
          type: string
          minLength: 12
          maxLength: 1024
          description: |
            Yalnız uzunluk tabanı. Bileşim kuralı (bir büyük, bir rakam, bir sembol) arama
            uzayını genişletmekten çok daraltıyor ve NIST SP 800-63B tam bu yüzden tavsiyeyi
            geri çekti.

    CurrentUser:
      type: object
      required: [id, username, role, organizationSlug, mfaEnrolled, recoveryCodesRemaining]
      description: |
        `username` değil `email` — LoginRequest ile aynı düzeltme, aynı gerekçeyle.

        `permissions` alanı KALDIRILDI. Şemanın ilk hâlinde vardı, ama ACL modeli henüz yok ve bu
        alan bugün her istekte boş bir dizi dönerdi. Her zaman boş dönen bir alan, "bu kullanıcının
        hiçbir yetkisi yok" diyen bir alandır — arayüz de ona bakıp her şeyi gizlerdi. Yetkiler
        geldiğinde alan da geri gelir; o zamana kadar yokluğu, yalan söylemesinden iyi.
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email:
          type: [string, 'null']
          description: |
            İSTEĞE BAĞLI ve kimlik doğrulamada KULLANILMIYOR. Yerel ağdaki bir NAS posta
            göndermiyor ve hiçbir adresi doğrulamıyor; giriş kullanıcı adıyla yapılıyor.
        role:
          type: string
          enum: [admin, member]
          description: |
            Arayüzün yönetici ekranlarını gösterip göstermeyeceğini bilmesi için. Bir YETKİ KARARI
            DEĞİL — sunucu her isteği kendi kontrol ediyor; bu yalnızca kullanıcıya çağıramayacağı
            bir düğmeyi göstermemek için.
        organizationSlug: { type: string }
        mfaEnrolled:
          type: boolean
          description: Onaylanmış bir TOTP kaydı var mı.
        recoveryCodesRemaining:
          type: integer
          description: Harcanmamış kurtarma kodu sayısı. Kayıt yoksa 0.

    MfaEnrolment:
      type: object
      required: [otpauthUri, secretBase32]
      properties:
        otpauthUri:
          type: string
          description: QR olarak gösterilecek otpauth:// bağlantısı.
        secretBase32:
          type: string
          description: Tarama yapamayan bir uygulama için aynı sır, metin olarak.

    RecoveryCodes:
      type: object
      required: [codes]
      description: |
        Kodlar yalnız üretildikleri anda okunabilir; sunucu hash'lerini saklıyor. İkinci kez
        istemenin yolu yenilemek, ve yenilemek eskileri geçersiz kılar.
      properties:
        codes:
          type: array
          items: { type: string }

    PasswordConfirmation:
      type: object
      required: [password]
      description: |
        §0.5 gereği yeniden kimlik doğrulama. Oturum çerezi kimin olduğunu söyler; bu, o kişinin
        hâlâ klavyenin başında olduğunu söyler.
      properties:
        password: { type: string, maxLength: 1024 }

    Permission:
      type: string
      description: |
        Allow-only. deny yoktur — POSIX ACL'de deny ACE diye bir şey yok ve uygulanan
        substrat onu ifade edemez (ADR-0004).
      enum:
        - list
        - read
        - download
        - create
        - modify
        - move
        - delete
        - share
        - manage_acl
        - view_versions
        - view_audit

    User:
      type: object
      required: [id, username, role, disabled, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: [string, 'null'] }
        role:
          type: string
          enum: [admin, member]
        disabled: { type: boolean }
        createdAt: { type: string, format: date-time }

    UserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }

    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
          description: |
            Giriş kimliği. '@' içeremez — bir kullanıcı adının bir adresle karıştırılabilmesi,
            ne insan ne de gelecekteki bir ayrıştırıcı için iyi bir fikir.
        role:
          type: string
          enum: [admin, member]
          default: member
        password:
          type: string
          minLength: 12
          description: |
            Uzunluk tabanı, kompozisyon kuralı değil. "Bir rakam, bir sembol" kuralı insanları
            ölçülebilir biçimde `Passw0rd!`e itiyor ve dört karakter daha uzunluktan az kazandırıyor.

    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        role:
          type: string
          enum: [admin, member]
        disabled: { type: boolean }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 12 }

    PasswordChanged:
      type: object
      required: [status, otherSessionsRevoked]
      properties:
        status: { type: string, enum: [ok] }
        otherSessionsRevoked: { type: integer }

    FileEntry:
      type: object
      required: [id, parentId, name, kind, size, modifiedAt, permissions]
      properties:
        permissions:
          type: array
          description: |
            ÇAĞIRANIN bu girdide yapabildikleri, miras hesaplandıktan sonra (ADR-0021).

            Satır başına, klasör başına değil, ve bunun bir maliyeti var: bir sayfa çizmek, o
            sayfadaki her girdi için ata zincirini yürümek demek. Yine de satır başına, çünkü
            alternatifi arayüzün klasörün iznine bakıp her satıra aynı düğmeleri koyması ve alt
            klasöre dar bir grant konmuş satırda o düğmenin 403 alması — yani sunucunun
            reddedeceği bir şeyi teklif eden bir arayüz.

            Sunucu bunu sayfa başına TEK ata yürüyüşüyle hesaplar: aynı klasördeki satırların
            atası ortak, ve yalnız kendi grant'ı olan satırlar ek iş çıkarır.
          items: { $ref: '#/components/schemas/FolderPermission' }
        id: { type: string, format: uuid }
        parentId:
          type: [string, 'null']
          format: uuid
        name: { type: string }
        kind:
          type: string
          enum: [file, folder]
        size: { type: integer, format: int64 }
        modifiedAt: { type: string, format: date-time }
        mimeType: { type: string }
        trashedAt:
          type: string
          format: date-time
          description: Yalnız çöp listesinde. Yoksa girdi çöpte değil.
        expiresAt:
          type: string
          format: date-time
          description: |
            Bu girdinin kalıcı olarak silineceği an: `trashedAt` + saklama süresi.

            Saklama politikası kapalıysa YOK, ve yokluğu "süresiz" demek. Bir tarih göstermek,
            sonra o tarihte hiçbir şey olmaması, çöp kutusunun tutmadığı bir söz olurdu.

            KENDİ ÜST DÜZEYİNDE olmayan bir girdi de yok: çöpe atılmış bir klasörün içindeki
            dosya, kendi tarihinde değil, kökünün tarihinde gider. Kendi tarihini göstermek,
            temizlemenin uymadığı bir geri sayım göstermek olurdu.

    FileEntryDetail:
      allOf:
        - $ref: '#/components/schemas/FileEntry'
        - type: object
          properties:
            createdAt: { type: string, format: date-time }
            ownerId: { type: string, format: uuid }
            checksum:
              type: string
              description: Sunucu tarafı kanonik digest.
            effectivePermissions:
              type: array
              items: { $ref: '#/components/schemas/Permission' }

    FileEntryPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FileEntry' }
        nextCursor: { type: string }
        hasMore:
          type: boolean
          description: |
            Toplam sayı bilerek yok. Filtrelenmemiş bir sayaç, kiracının göremediği
            satırların varlığını sızdırır.

    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        shareId:
          type: [string, 'null']
          format: uuid
          description: |
            ÜST DÜZEY bir klasörün hangi paylaşımda açılacağı. `parentId` verildiğinde yok sayılır:
            üst klasör paylaşımı zaten belirliyor ve iki cevap bir fazla olurdu. Verilmezse
            kiracının varsayılanı.
        parentId: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/FileName' }

    UpdateFileRequest:
      type: object
      minProperties: 1
      description: |
        Yeniden adlandırma ve taşıma tek uçta, çünkü ikisi de aynı satırın aynı iki kolonu:
        `name` ve `parent_id`. Dosya sistemi tarafında da tek bir rename(2) çağrısı.

        Taşıma AYNI PAYLAŞIM içinde. Paylaşımlar arası taşıma bir rename DEĞİL — ölçüldüğü üzere
        dataset'ler arası rename(2) EXDEV veriyor (ADR-0008) — ve kopyala+sil işine dönüşmesi
        gerekir; o iş /file-operations'ın konusu ve henüz yazılmadı. Başka bir paylaşımın
        klasörüne taşıma isteği 409 döner, sessizce yanlış yere koymaz.
      properties:
        name: { $ref: '#/components/schemas/FileName' }
        parentId:
          type: [string, 'null']
          format: uuid
          description: null, paylaşımın köküne taşır.

    RenameRequest:
      deprecated: true
      description: UpdateFileRequest ile değiştirildi. Üretilmiş istemcilerin kırılmaması için duruyor.
      type: object
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/FileName' }

    FileOperationRequest:
      type: object
      required: [operation, sourceIds, destinationId]
      properties:
        operation:
          type: string
          enum: [move, copy, restore]
          description: |
            Şu an yalnız `copy` uygulanıyor. `move` için `PATCH /files/{id}`, `restore` için
            `POST /files/{id}/restore`; ikisi de burada 422 döner.
        sourceIds:
          type: array
          minItems: 1
          maxItems: 10000
          items: { type: string, format: uuid }
        destinationId:
          type: string
          format: uuid
          nullable: true
          description: Hedef klasör. `null`, paylaşımın kökü demek.
        conflictPolicy:
          type: string
          enum: [replace, keep_both, version, skip]
          default: keep_both
          description: |
            Şu an yalnız `keep_both` uygulanıyor; diğerleri 422 ile reddediliyor. Neden
            reddedildikleri uç noktanın açıklamasında.

    JobRef:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string, format: uuid }

    Job:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        status:
          type: string
          enum: [queued, running, succeeded, failed, dead]
          description: |
            dead, max_attempts aşıldığında verilir ve sessizce kaybolmaz — sistem alarmı
            üretir (ADR-0003).
        progress: { type: number, minimum: 0, maximum: 1 }
        createdAt: { type: string, format: date-time }
        error: { $ref: '#/components/schemas/ProblemDetails' }

    JobPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Job' }

    Telemetry:
      type: object
      required: [pools, cpu, memory]
      properties:
        pools:
          type: array
          items: { $ref: '#/components/schemas/PoolStatus' }
        cpu:
          type: object
          properties:
            loadAverage:
              type: array
              items: { type: number }
            temperatureCelsius: { type: number }
        memory:
          type: object
          properties:
            totalBytes: { type: integer, format: int64 }
            usedBytes: { type: integer, format: int64 }
        disks:
          type: array
          description: |
            Ajanın `ReadSmartSummary` işleminden. Hangi disklerin sorulacağı yapılandırmadan
            gelir, keşiften değil — havuz adlarıyla aynı gerekçe: ajanın işlem kümesi kapalı ve
            içinde "diskleri listele" yok, eklemek Rust tarafındaki sözleşmeyi değiştirmek demek.
          items: { $ref: '#/components/schemas/DiskStatus' }

    PoolStatus:
      type: object
      required: [name, health, used, available]
      properties:
        name: { type: string }
        health:
          type: string
          # İlk altısı zpoolprops(7)'nin `health` özelliği için saydığı değerler. Enum bunlardan
          # ikisini (REMOVED, OFFLINE) kaçırıyordu: ajan `zpool list -H -o health` çıktısını ham
          # geçiriyor, yani diski çekilmiş bir havuz enum dışında bir değer yayar ve üretilmiş her
          # istemcinin doğrulaması kırılırdı.
          #
          # SUSPENDED özellik belgesinde geçmiyor ama pratikte bildiriliyor (bağlantısı kopmuş bir
          # havuz G/Ç'yi donduğunda). Dışarıda bırakmak, gerçekten ciddi bir durumu UNKNOWN olarak
          # göstermek olurdu.
          #
          # UNKNOWN, API'nin tanımadığı bir değeri ASLA uydurmaması içindir. Bilinmeyen bir
          # dizgiyi ONLINE'a çevirmek, operatöre yanlış yeşil göstermenin en kısa yolu.
          enum: [ONLINE, DEGRADED, FAULTED, OFFLINE, REMOVED, UNAVAIL, SUSPENDED, UNKNOWN]
        used: { type: integer, format: int64 }
        available: { type: integer, format: int64 }
        usedBySnapshots: { type: integer, format: int64 }
        scrubState: { type: string }

    Note:
      type: object
      required: [id, title, body, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 65536 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NotePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Note' }

    CreateNoteRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 65536 }

    UpdateNoteRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 65536 }

    Task:
      type: object
      required: [id, body, status, priority, assigneeId, doneAt, position, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        body: { type: string, maxLength: 2000 }
        status:
          type: string
          enum: [draft, assigned, in_progress, in_review, done, cancelled]
          description: |
            §7'nin durum makinesi. `doneAt` KALDIRILMADI ve bu bir tereddüt değil: durum "ne
            olduğu", `doneAt` "ne zaman olduğu", ve ikincisinin cevabı birinciden türetilemez.
            Şema ikisinin ANLAŞMASINI zorluyor — `done` olmayan bir görevde `doneAt` dolu olamaz.

            Geçişler `İncelemede → DevamEdiyor` dahil serbest bırakılmadı; izinli olanlar
            `TaskStatusTransitionRefused` ile reddediliyor. Sunucu tarafında zorlanmasının sebebi,
            bir durum makinesinin yalnız arayüzde yaşadığında bir durum makinesi olmaması.
        priority:
          type: string
          enum: [low, normal, high, urgent]
        dueAt:
          type: [string, 'null']
          format: date-time
          description: |
            Tarih değil ZAMAN DAMGASI. "Yarın" bir zaman diliminde yarın, başkasında bugün; bir
            son tarihin hangi ana denk geldiği, gecikmiş olup olmadığını belirleyen şeyin ta
            kendisi.
        parentId:
          type: [string, 'null']
          format: uuid
          description: |
            Parçası olduğu iş. TEK SEVİYE: bir alt görevin kendi alt görevi olamıyor, ve bunu
            veritabanındaki `tasks_one_level_deep` tetikleyicisi tutuyor — keyfi derinlikte bir
            ağaç, bir yapılacaklar panosunu bir dosya yöneticisine çevirir.

            Üst işi silmek parçalarını da siliyor. Arayüz silmeden önce kaç parçanın gideceğini
            söylüyor; sessiz bir kaskat, veri kaybının en sık biçimi.
        subtaskDone:
          type: integer
          description: Kaç parçası kapandı (`done` ya da `cancelled`). Parçası yoksa 0.
        subtaskTotal: { type: integer }
        checklistDone: { type: integer }
        checklistTotal: { type: integer }
        tags:
          type: array
          description: Bu işin etiketleri, ada göre. `uses` burada YOK — satırda görünen şey ad ve renk.
          items: { $ref: '#/components/schemas/Tag' }
        linkedFileCount:
          type: integer
          description: |
            Bu görevin ÇAĞIRANIN GÖREBİLDİĞİ kaç dosyaya bağlı olduğu. Toplam sayı değil, ve fark
            §7'nin kuralı: görev erişimi gizli dosya erişimi vermemeli. Göremediği bir dosyanın
            varlığını sayıdan çıkarmak da bir sızıntı olurdu.
        # Atanmamış bir iş gerçek bir durum: "birinin yapması lazım". Oluştururken bir isim
        # dayatmak, paylaşımlı listelerin kullanılmaz hâle gelme biçimidir.
        assigneeId: { type: [string, 'null'], format: uuid }
        assigneeUsername: { type: [string, 'null'] }
        # Boolean değil zaman damgası. "Bitti" ile "dün 14:02'de bitti" aynı yeri kaplıyor ve
        # ikincisi birincisinin cevaplayamadığı soruları cevaplıyor.
        doneAt: { type: [string, 'null'], format: date-time }
        position: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TaskPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Task' }

    TaskFileLink:
      type: object
      required: [id, fileEntryId, name, kind, path, shareId, linkedAt]
      properties:
        id: { type: string, format: uuid }
        fileEntryId: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [file, folder] }
        path: { type: string }
        shareId: { type: string, format: uuid }
        linkedBy: { type: [string, 'null'] }
        linkedAt: { type: string, format: date-time }

    TaskFileLinkPage:
      type: object
      required: [items, hidden]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskFileLink' }
        hidden:
          type: integer
          description: |
            Bu görevde bağlı olup ÇAĞIRANIN GÖREMEDİĞİ dosya sayısı.

            Sayının kendisi bildiriliyor ama dosyalar hakkında hiçbir şey bildirilmiyor — ne ad,
            ne yol, ne paylaşım. Sebep: sıfır göstermek "burada başka bir şey yok" demek olurdu
            ve bu yanlış; sayıyı gizlemek de bir görevi eksik gösterip kimsenin sormayacağı bir
            boşluk bırakırdı. Sayı, "buraya bakman gereken bir şey var, ama sana değil"
            cümlesinin en az bilgi sızdıran hâli.

    LinkTaskFileRequest:
      type: object
      required: [fileEntryId]
      properties:
        fileEntryId: { type: string, format: uuid }

    TaskActivity:
      type: object
      required: [id, field, at]
      properties:
        id: { type: string, format: uuid }
        actorUsername: { type: [string, 'null'] }
        field:
          type: string
          enum:
            [
              status,
              priority,
              due_at,
              assignee_id,
              body,
              file_link,
              comment,
              parent_id,
              checklist,
              tag,
            ]
          description: |
            `comment` yalnız bir yorumun SİLİNMESİ için düşüyor, eklenmesi için değil: yorum
            listesinin kendisi eklendiğinin kaydı, ve iki yere yazmak iki farklı doğruluk kaynağı
            demek. Kaybolan şeyin izi ise başka hiçbir yerde kalmıyor — `oldValue` silinen gövdenin
            ilk 200 karakteri, `newValue` null.
        oldValue: { type: [string, 'null'] }
        newValue: { type: [string, 'null'] }
        at: { type: string, format: date-time }

    TaskActivityPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskActivity' }

    CreateTaskRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
        assigneeId: { type: [string, 'null'], format: uuid }
        parentId:
          type: [string, 'null']
          format: uuid
          description: Verilirse iş bunun parçası olarak doğuyor. Tek seviye; bkz. `Task.parentId`.

    UpdateTaskRequest:
      type: object
      minProperties: 1
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
        assigneeId: { type: [string, 'null'], format: uuid }
        # `done` KALDI ve `status` ile birlikte gönderilemez. Eski istemciler onu kullanıyor ve
        # ikisini aynı istekte kabul etmek "hangisi kazanır" sorusunu doğurur — cevabı olan ama
        # kimsenin bilmediği bir soru. `done: true` → `status: done`, `done: false` → `assigned`
        # ya da `draft`, atanan varsa birincisi.
        done: { type: boolean }
        status:
          type: string
          enum: [draft, assigned, in_progress, in_review, done, cancelled]
        priority: { type: string, enum: [low, normal, high, urgent] }
        dueAt: { type: [string, 'null'], format: date-time }
        position: { type: number }

    Tag:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 40 }
        color:
          type: string
          enum: [iris, mint, cyan, amber, rose, slate]
          description: |
            SABİT BİR PALET, serbest bir hex alanı değil. Karanlık zemine karşı görünmeyen bir
            etiket, olmayan bir etiket — ve serbest renk, arayüzü birkaç hafta içinde okunmaz kılar.
        uses:
          type: integer
          description: Kaç işte kullanıldığı. Yalnız `GET /tags` dolduruyor; bir işin çipinde yok.

    TagPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Tag' }

    CreateTagRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        color: { type: string, enum: [iris, mint, cyan, amber, rose, slate] }

    UpdateTagRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        color: { type: string, enum: [iris, mint, cyan, amber, rose, slate] }

    ChecklistItem:
      type: object
      required: [id, body, doneAt, doneByUsername]
      properties:
        id: { type: string, format: uuid }
        body: { type: string, maxLength: 500 }
        doneAt: { type: [string, 'null'], format: date-time }
        doneByUsername:
          type: [string, 'null']
          description: Kim tikledi. Hesap kapandıysa null; madde kalıyor.

    ChecklistPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ChecklistItem' }

    ChecklistItemRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 500 }

    TaskComment:
      type: object
      required: [id, authorUsername, body, deleted, editedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        authorUsername:
          type: [string, 'null']
          description: Hesap silindiyse null; yorum kalıyor, çünkü yorum işin bilgisi.
        body:
          type: string
          maxLength: 4000
          description: Silinmiş bir yorumda BOŞ. `deleted` ile birlikte okunuyor.
        deleted: { type: boolean }
        editedAt:
          type: [string, 'null']
          format: date-time
          description: |
            null = hiç düzenlenmedi. Arayüz farkı söylüyor: sonradan değişmiş bir cümleyi hiç
            değişmemiş gibi göstermek, alıntılanabilir olmayan bir kayıt üretir.
        createdAt: { type: string, format: date-time }

    TaskCommentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskComment' }

    TaskCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }

    TaskWatcher:
      type: object
      required: [userId, username, source, since]
      properties:
        userId: { type: string, format: uuid }
        username: { type: [string, 'null'] }
        source:
          type: string
          enum: [manual, created, assigned, commented]
          description: |
            Kendi mi seçti, yoksa bir eylem yüzünden mi eklendi. Bugün ikisi de aynı davranıyor;
            ayrım, kaybolmaması için taşınıyor.
        since: { type: string, format: date-time }

    TaskWatcherPage:
      type: object
      required: [items, watching]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskWatcher' }
        watching:
          type: boolean
          description: |
            Çağıranın kendi durumu. Listeden türetilmek yerine ayrı bir alan: arayüzün sorduğu soru
            "ben izliyor muyum", ve onu her istemcinin listede kendini araması gerekmiyor.

    Notification:
      type: object
      required: [id, kind, title, readAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum:
            [
              task.assigned,
              task.unassigned,
              task.status,
              task.due,
              task.overdue,
              task.comment,
              task.mention,
            ]
        taskId: { type: [string, 'null'], format: uuid }
        taskBody:
          type: [string, 'null']
          description: |
            İşin ŞU ANKİ gövdesi, `title` ise o AN üretilmiş cümle. İkisi birden var çünkü ikisi
            farklı soruları cevaplıyor: "ne olmuştu" ve "o iş şimdi ne durumda".
        title: { type: string, maxLength: 300 }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    NotificationPage:
      type: object
      required: [items, unread]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        unread:
          type: integer
          description: |
            Okunmamış TOPLAM sayı — `items` filtrelenmiş ya da kırpılmış olsa bile. Zilin
            gösterdiği sayı bu, ve listenin uzunluğundan türetilemez.

    MarkNotificationsReadRequest:
      type: object
      properties:
        ids:
          type: array
          maxItems: 200
          items: { type: string, format: uuid }
          description: Verilmezse hepsi işaretleniyor.

    NotificationsRead:
      type: object
      required: [marked, unread]
      properties:
        marked: { type: integer }
        unread: { type: integer }

    Preferences:
      type: object
      description: |
        Arayüz tercihleri. Şema BİLEREK dar: sunucu bu belgeyi doğruluyor ve tanımadığı bir alan
        reddediliyor. Doğrulanmayan bir jsonb kolonu, biri okuyana kadar bozuk durumun biriktiği
        yerdir; arayüz her değiştiğinde bir migration yazmamak için jsonb seçildi, sınırsız çöp
        kabul etmek için değil.
      properties:
        background:
          type: object
          required: [kind]
          additionalProperties: false
          description: |
            `kind` ne olduğunu, diğer iki alan hangisi olduğunu söyler ve BOŞ BIRAKILAMAZLAR:
            `solid` ise `preset`, `file` ise `fileId` zorunlu. Şema bunu tek başına ifade
            edemiyor (oneOf ile edilebilirdi ama üretilmiş istemciyi okunmaz hâle getirirdi),
            o yüzden burada yazılı: eksik bırakan istek 422 alır.

            `fileId` çöpteki bir kayda ya da bir klasöre işaret edemez — arayüzün her açılışta
            404 veren bir arka plan istemesi, sessizce bozuk bir tercihtir.
          properties:
            kind:
              type: string
              # `sky` çizilen galaksi; `solid` düz bir gradyan; `file` kullanıcının kendi
              # yüklediği görsel — bir dosya kimliği, bir URL değil, çünkü baytlar zaten
              # /files/{id}/content üzerinden ve aynı yetkiyle geliyor.
              enum: [sky, solid, file]
            preset: { type: string, maxLength: 32 }
            fileId: { type: string, format: uuid }
        sound: { type: boolean }
        shortcuts:
          type: array
          maxItems: 60
          items:
            type: object
            required: [id, cell]
            additionalProperties: false
            properties:
              id: { type: string, maxLength: 128 }
              label: { type: string, maxLength: 64 }
              cell: { type: integer, minimum: 0, maximum: 999 }
      additionalProperties: false

    Transfer:
      type: object
      required: [id, filename, lengthBytes, offsetBytes, state, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        lengthBytes: { type: integer, format: int64 }
        offsetBytes: { type: integer, format: int64 }
        state:
          type: string
          enum: [active, stalled, completed]
          description: |
            `stalled`, sunucunun bir yargısı: son yazmadan bu yana bir dakikadan fazla geçmiş bir
            yükleme. Tarayıcı sekmesi kapandığında yükleme "bitmiş" görünmesin diye var — bir
            aktarım listesinin en çok işe yaradığı an, bir aktarımın durduğu andır.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TransferPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transfer' }

    Snapshot:
      type: object
      required: [id, dataset, name, fullName, createdAt]
      properties:
        id: { type: string, format: uuid }
        dataset: { type: string }
        name: { type: string }
        fullName: { type: string }
        createdBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    SnapshotPage:
      type: object
      required: [items, complete]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Snapshot' }
        complete:
          type: boolean
          description: |
            Her zaman false. Ajanda "anlık görüntüleri listele" işlemi yok, yani bu liste havuzun
            envanteri değil DEPSIS'in kendi kaydı. Alan bir yer tutucu değil: istemcinin bunu
            kullanıcıya söylemesi gerekiyor ve söylemesi gerektiğini sözleşmeden öğrenmeli.

    CreateSnapshotRequest:
      type: object
      required: [dataset]
      properties:
        dataset: { type: string, minLength: 1, maxLength: 255 }
        name:
          type: string
          maxLength: 63
          pattern: '^[A-Za-z0-9_][A-Za-z0-9._-]{0,62}$'
          description: Yoksa sunucu zaman damgasından üretir.

    DiskStatus:
      type: object
      required: [id, healthy]
      properties:
        id:
          type: string
          description: |
            /dev/disk/by-id altındaki kararlı ad. `/dev/sdX` DEĞİL — ajan onu yapı gereği
            reddediyor, çünkü sdX yeniden başlatmada başka bir diski gösterebilir (risk R1).
        healthy: { type: boolean }
        temperatureCelsius: { type: integer }

    StorageSetup:
      type: object
      required: [pools, shareRoot]
      properties:
        pools:
          type: array
          items: { type: string }
          description: Kutudaki havuzlar. `DEPSIS_ZFS_POOLS` yazılıysa yalnız oradakiler.
        shareRoot: { $ref: '#/components/schemas/ShareRoot' }
        parentDataset:
          type: string
          description: |
            Yeni paylaşımların altında açılacağı veri kümesi. `DEPSIS_SHARE_PARENT_DATASET`
            yazılıysa o, yoksa paylaşım kökünde bağlı olan. Yoksa `POST /shares` 503 veriyor.

    ShareRoot:
      type: object
      required: [empty]
      properties:
        path:
          type: string
          description: |
            Ajanın `DEPSIS_SHARES_ROOT`'u. Çağıran bir dizin adlandıramıyor — bu alan ajanın
            kendi yapılandırmasından geliyor.
        dataset:
          type: string
          description: |
            Tam olarak oraya bağlı veri kümesi. **Tam olarak**, "içeren" değil: `/srv`'e bağlı bir
            veri kümesi `/srv/depsis`'i tutan değildir, ve öyle saymak paylaşım ağacını kurulmuş
            gibi gösterirdi.
        empty:
          type: boolean
          description: |
            Dizinde hiç girdi var mı. Bildiriliyor, çünkü `zfs create -o mountpoint=X` X'in
            üstüne şikâyet etmeden bağlanıyor: altındaki her şey görünmez oluyor, silinmeden,
            diski işgal etmeye devam ederek.

    CreatePoolRequest:
      type: object
      required: [name, topology, disks, confirm, password]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_.:-]{0,62}$'
          description: |
            Havuz adı. İçinde `/` OLAMAZ — o bir dataset yolu olurdu. Harfle başlamak zorunda:
            `-` ile başlayan bir ad `zpool` tarafından seçenek olarak okunur (P0-E).
        topology:
          type: string
          enum: [single, mirror, raidz1, raidz2]
          description: |
            Çok diskli **stripe bilerek ifade edilemez**: herhangi bir diski kaybetmenin bütün
            havuzu kaybettirdiği düzen, dosya saklamak için var olan bir cihazda bir listeden
            yanlış maddeyi seçerek ulaşılabilecek bir şey olmamalı.

            En az disk sayısı: `single` 1 (ve yalnız 1), `mirror` 2, `raidz1` 3, `raidz2` 4. İki
            diskli bir `raidz1`, bir aynanın yedekliliğini başka bir şey vaat eden bir kelimeyle
            anlatır.
        disks:
          type: array
          minItems: 1
          maxItems: 24
          items: { $ref: '#/components/schemas/PoolDisk' }
        prepareShareRoot:
          type: boolean
          default: false
          description: |
            Havuz kurulduktan sonra `<havuz>/depsis` veri kümesini açıp paylaşım köküne bağla.

            Bu, sihirbazdan sonra kalan son kabuk adımını kaldırıyor: onsuz havuz var ama
            `POST /shares` hâlâ 503 veriyor. Bağlanacak yer ÇAĞIRANIN SEÇTİĞİ BİR ŞEY DEĞİL —
            ajanın kendi `DEPSIS_SHARES_ROOT`'u — ve ajan, oraya zaten bir veri kümesi bağlıysa ya
            da dizin boş değilse reddediyor.
        confirm:
          type: string
          description: |
            Havuz adının aynısı. İşi niyeti kanıtlamak DEĞİL — onu parola yapıyor — tek tıkla
            geçilmesini engellemek.
        password:
          type: string
          maxLength: 1024
          description: Mevcut parola. Oturum varken de isteniyor (§0.5).

    PoolDisk:
      type: object
      required: [byId, wwn]
      properties:
        byId:
          type: string
          description: '`GET /system/disks` yanıtındaki `byId`. Yol değil, tek bileşen.'
        wwn:
          type: string
          description: |
            Aynı yanıttaki `wwn`. Süs değil: ajan havuzu kurmadan hemen önce envanteri YENİDEN
            okuyup bunu karşılaştırıyor, ve bu, sihirbaz ile düğme arasında disk değiştirilmesine
            dayanan tek kontrol. `wwn` bildirmeyen bir disk havuza katılamaz.

    JobAccepted:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string, format: uuid }

    DiskInventory:
      type: object
      required: [disks, complete]
      properties:
        disks:
          type: array
          items: { $ref: '#/components/schemas/DiskInventoryEntry' }
        complete:
          type: boolean
          description: |
            Liste tam mı. Ajan `MAX_DISKS`'te kesiyor; kesilmiş bir envanterden yazılan bir onay
            metni, etkileyeceği disklerin bir alt kümesini adlandırırdı.

    DiskInventoryEntry:
      type: object
      required: [kname, sizeBytes, rotational, removable, holds, mounted, holdsSystem]
      properties:
        byId:
          type: string
          description: |
            `/dev/disk/by-id` altındaki kararlı ad — `DEPSIS_SMART_DISKS`'e yazılacak olan, ve
            `ReadSmartSummary`'nin aldığı. Çekirdek kararlı bir bağ vermediyse yok.
        kname:
          type: string
          description: |
            Çekirdek adı (`sda`, `nvme0n1`). Kararlı adın YANINDA gösterilmek için — operatör
            kasadaki etikette bunu okuyor — ama kimlik olarak asla: `/dev/sdX` yeniden
            başlatmada başka bir fiziksel diski gösterebilir (risk R1).
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        model: { type: string }
        serial:
          type: string
          description: |
            Yok olabilir. VPD sayfa 0x80 Hyper-V'de bozuk (ADR-0000); kimlik için `wwn`
            kullanılır.
        wwn: { type: string, description: SCSI VPD sayfa 0x83. Kimlik zincirinin ilk halkası. }
        rotational: { type: boolean }
        removable:
          type: boolean
          description: Çıkarılabilir. Giden bir USB belleği, bir vdev'i de götürür.
        transport: { type: string, description: '`sata`, `nvme`, `usb`, …' }
        holds:
          type: array
          items: { type: string }
          description: |
            Diskte hâlihazırda ne var: bölüm tablosu türü ve bulunan dosya sistemi imzaları.
            **BOŞ, tek güvenli durum.** Buradaki her şey, bu diske havuz kurmanın bir şeyi yok
            edeceği anlamına geliyor.
        mounted: { type: boolean, description: Bir bölümü bir yere bağlı. }
        holdsSystem:
          type: boolean
          description: |
            `/`, `/boot` ya da `/boot/efi` bu diskte. Kendi alanı, çünkü bu asla bir yorum
            meselesi olmamalı: bu diski silmek cihazın kendisini siler, ve API onu bir onay
            metniyle değil doğrudan reddediyor.

    OpenConsoleRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          maxLength: 1024
          description: Mevcut parola. Oturum varken de isteniyor (ADR-0018).
        cols: { type: integer, minimum: 20, maximum: 500, default: 80 }
        rows: { type: integer, minimum: 5, maximum: 200, default: 24 }

    ConsoleSession:
      type: object
      required: [id, username, privileged, openedAt, idleTimeoutSeconds, maxAgeSeconds]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        privileged:
          type: boolean
          description: |
            Konsolun root olarak çalışıp çalışmadığı. Varsayılan false ve açmak birim dosyasını
            elle düzenlemeyi gerektirir — bir onay kutusuyla açılabilen root kabuk, kaza ile
            açılabilen root kabuktur.
        openedAt: { type: string, format: date-time }
        idleTimeoutSeconds: { type: integer }
        maxAgeSeconds: { type: integer }

    ConsoleSessionPage:
      type: object
      required: [items, available]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConsoleSession' }
        available:
          type: boolean
          description: Konsol servisi çalışıyor mu. Kapalıysa liste boş döner ve bu bir hata değil.

    ConsoleInput:
      type: object
      required: [data]
      properties:
        data:
          type: string
          maxLength: 8192
          description: base64. Terminal girdisi ham bayttır ve UTF-8 sınırlarını bölebilir.

    ConsoleResize:
      type: object
      required: [cols, rows]
      properties:
        cols: { type: integer, minimum: 20, maximum: 500 }
        rows: { type: integer, minimum: 5, maximum: 200 }

    AppCatalogueEntry:
      type: object
      required: [slug, name, summary, icon, image, tag, containerPort, mounts]
      properties:
        slug: { type: string }
        name: { type: string }
        summary: { type: string }
        icon: { type: string }
        image: { type: string }
        tag:
          type: string
          description: |
            Sabitlenmiş sürüm. `latest` veritabanı kısıtıyla reddediliyor — bir gün çalışan bir
            uygulamanın ertesi gün sessizce başka bir sürüme geçmesi, bir NAS'ta veri kaybının
            ucuz yollarından biri.
        containerPort: { type: integer }
        mounts:
          type: array
          items:
            type: object
            required: [target, mode, purpose]
            properties:
              target: { type: string }
              mode: { type: string, enum: [ro, rw] }
              purpose: { type: string }

    App:
      type: object
      required: [catalogue, installed]
      properties:
        catalogue: { $ref: '#/components/schemas/AppCatalogueEntry' }
        installed: { type: boolean }
        state:
          type: string
          enum: [running, stopped, starting, error, unknown]
          description: |
            Podman'dan okunur, veritabanından değil. Bir kolona yazılsaydı cihaz yeniden
            başladığında yalan söylerdi.
        url:
          type: [string, 'null']
          description: 127.0.0.1 üzerindeki adres. Konteynerler LAN'a doğrudan açılmaz.
        hostPort: { type: [integer, 'null'] }
        installedAt: { type: [string, 'null'], format: date-time }

    AppPage:
      type: object
      required: [items, runtime]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/App' }
        runtime:
          type: object
          required: [available]
          properties:
            available: { type: boolean }
            version: { type: string }
            rootless:
              type: boolean
              description: |
                Köksüz çalışıp çalışmadığı. false ise kurulum ADR-0019'un ayrıcalık kararından
                sapmış demektir ve arayüz bunu uyarı olarak göstermeli.

    InstallAppRequest:
      type: object
      required: [mounts]
      properties:
        mounts:
          type: array
          description: |
            Katalogdaki her `target` için bir paylaşım. Host tarafı bir PAYLAŞIM KİMLİĞİ, bir yol
            değil — kullanıcının verdiği bir yol, kullanıcının seçtiği bir yolu bağlamak olurdu.
          items:
            type: object
            required: [target, shareId]
            properties:
              target: { type: string }
              shareId: { type: string, format: uuid }

    AppStateRequest:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [running, stopped] }

    AppLogs:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items: { type: string }

    RemoteStatus:
      type: object
      required: [available, networks]
      properties:
        available:
          type: boolean
          description: zerotier-one kurulu ve çalışıyor mu. DEPSIS onu paketlemiyor.
        nodeId: { type: [string, 'null'] }
        online: { type: boolean }
        version: { type: [string, 'null'] }
        networks:
          type: array
          items: { $ref: '#/components/schemas/RemoteNetwork' }

    RemoteNetwork:
      type: object
      required: [networkId, status, authorized, addresses]
      properties:
        networkId: { type: string }
        name: { type: [string, 'null'] }
        label: { type: [string, 'null'] }
        status:
          type: string
          enum:
            [
              OK,
              ACCESS_DENIED,
              NOT_FOUND,
              REQUESTING_CONFIGURATION,
              PORT_ERROR,
              AUTHENTICATION_REQUIRED,
              UNKNOWN,
            ]
        authorized:
          type: boolean
          description: |
            false ise cihaz ağa KATILMIŞ ama ONAYLANMAMIŞTIR ve hiçbir trafik akmaz. Arayüz bunu
            "bağlanıyor" diye göstermemeli — kullanıcının ZeroTier Central'da bir kutu
            işaretlemesi gerekiyor.
        addresses:
          type: array
          items: { type: string }
        joinedAt: { type: [string, 'null'], format: date-time }

    JoinNetworkRequest:
      type: object
      required: [networkId]
      properties:
        networkId:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: |
            Tam 16 onaltılık hane. Ajan tarafında da kendi tipiyle doğrulanıyor; bir yol parçası
            olarak birleştirilecek bir değerin iki yerde doğrulanması, bir yerde unutulmasından
            ucuz.
        label: { type: string, maxLength: 64 }

    Share:
      type: object
      required: [id, name, readOnly, published, uncPath]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        readOnly: { type: boolean }
        published:
          type: boolean
          description: |
            Samba bu paylaşımı GERÇEKTEN sunuyor mu. Veritabanında bir satır olması yetmez —
            ikisini aynı şeymiş gibi göstermek, kullanıcıyı çalışmayan bir adresi denemeye
            göndermektir.
        uncPath:
          type: string
          description: Windows'un Gezgin'e yazacağı adres, örn. `\\depsis\belgeler`.
        dataset: { type: string }

    SharePage:
      type: object
      required: [items, smbAvailable]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Share' }
        smbAvailable:
          type: boolean
          description: |
            Ajana ulaşılabiliyor ve Samba kurulu mu. false ise `published` alanlarının hepsi
            false'tur ve bu bir arıza değil, kurulmamış bir bileşendir.

    ShareCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          # Ajanın `SafeComponent`'i ile birebir aynı, ve migration 0008'in `shares_name_format`
          # kısıtıyla da. Üçü ayrı yerde ama tek bir kural: bu tablonun kabul edip ajanın
          # reddettiği bir ad, veritabanında var olup diskte olmayan bir paylaşımdır.
          pattern: '^[A-Za-z0-9_][A-Za-z0-9._-]{0,62}$'
          description: |
            Paylaşımın adı, ve aynı zamanda SMB adresindeki son bileşen. Büyük/küçük harf ve
            Türkçe i ailesi katlanarak karşılaştırılır: `Belgeler` varken `belgeler` açılamaz,
            çünkü SMB istemcileri ikisini ayırt edemez.
        readOnly:
          type: boolean
          default: false
        quotaBytes:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: |
            `refquota`. Snapshot'ları HARİÇ tutar, yani yönetici anlık görüntü politikası bir
            kullanıcıyı kendi alanının dışına kilitleyemez (ADR-0008). null: kota yok.
        grants:
          type: array
          description: |
            Paylaşımın kökündeki başlangıç izinleri. Verilmezse paylaşımı açan yöneticiye tam
            izin yazılır — boş bir dizi DEĞİL: grant'sız bir paylaşım, kaldırılan istisnayı geri
            getirir, ve `422` ile reddedilir.
          minItems: 1
          items: { $ref: '#/components/schemas/Grant' }

    ShareCreated:
      type: object
      required: [share, applyingJobId]
      properties:
        share: { $ref: '#/components/schemas/Share' }
        applyingJobId:
          type: [string, 'null']
          format: uuid
          description: |
            POSIX ACL'leri yazacak işin kimliği. null ise ajana ulaşılamadı ve dosya sistemi
            henüz bu paylaşımın izinlerini bilmiyor — arayüz bunu göstermek zorunda, çünkü
            web'in kapalı dediği bir klasörün SMB'den açılması §6.2'nin adıyla yasakladığı şey.

    SmbPublishResult:
      type: object
      required: [shares, verified]
      properties:
        shares: { type: integer }
        verified:
          type: boolean
          description: |
            Canlı bağlantı denemesi geçti mi. false ise yapılandırma yazıldı ama doğrulanamadı ve
            ESKİSİNE GERİ DÖNÜLDÜ — yani paylaşımlar çalışmaya devam ediyor, yeni yapılandırma
            uygulanmadı.

    FolderPermission:
      type: string
      description: |
        §6.2'nin saydığı on bir izin, birebir. `manage` (izin yönet) ayrı: bir klasöre yazabilen
        herkesin o klasörün iznini de değiştirebilmesi, yetki modelinin kendi kendini geçersiz
        kılmasıdır.
      enum: [list, read, download, create, modify, move, delete, share, manage, versions, audit]

    Team:
      type: object
      required: [id, name, memberCount, posixGid, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        memberCount: { type: integer }
        posixGid:
          type: [integer, 'null']
          description: |
            Dosya sistemindeki grup. NULL, grubun HENÜZ YARATILMADIĞI anlamına gelir — ve bu
            durumdaki bir ekibe verilen izin uygulama katmanında görünür, SMB'de görünmez.
            Arayüz bunu söylemek zorunda; iki gerçeklik üretmemenin bedeli bu alanı okumak.
        createdAt: { type: string, format: date-time }

    TeamPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Team' }

    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }

    UpdateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }

    TeamMember:
      type: object
      required: [userId, username, teamAdmin, addedAt]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        teamAdmin:
          type: boolean
          description: §6.1'in "Ekip yöneticisi" satırı — kendi ekibi içindeki kullanıcı ve klasörler.
        addedAt: { type: string, format: date-time }

    TeamMemberPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TeamMember' }

    TeamMembershipRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
        teamAdmin: { type: boolean, default: false }

    Grant:
      type: object
      required: [permissions]
      description: |
        Tam olarak biri dolu: `userId` ya da `teamId`. İkisi birden dolu ya da ikisi birden boş
        bir satır, veritabanı kısıtıyla da reddediliyor — burada da yazılı olması, üretilmiş
        istemcinin sunucuya sormadan bilebilmesi için.
      properties:
        userId: { type: [string, 'null'], format: uuid }
        teamId: { type: [string, 'null'], format: uuid }
        displayName:
          type: string
          description: Kullanıcı adı ya da ekip adı. Yalnız yanıtta; istek bunu yok sayar.
        permissions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/FolderPermission' }

    FolderPermissions:
      type: object
      required: [effective, grants, canManage]
      properties:
        effective:
          type: array
          description: |
            ÇAĞIRANIN bu klasörde gerçekten yapabildikleri, miras hesaplandıktan sonra. Arayüz
            düğmeleri buna göre çizer. Organizasyon yöneticisi için her zaman tam küme.
          items: { $ref: '#/components/schemas/FolderPermission' }
        inheritedFrom:
          type: [string, 'null']
          format: uuid
          description: |
            `effective` kümesinin geldiği düğüm. Bu düğümün kendisiyse kendi kimliği; hiç grant
            yoksa null. "Bu izin nereden geliyor" cevaplanabilir bir soru olmalı, yoksa bir
            yöneticinin onu nereden kaldıracağını bulması imkânsız.
        grants:
          type: array
          description: |
            Bu düğümde AÇIKÇA yazılmış satırlar. `canManage` false ise BOŞ döner — kimin nereye
            erişebildiği kendi başına bir bilgi ve onu görmek de bir yetki.
          items: { $ref: '#/components/schemas/Grant' }
        canManage:
          type: boolean
          description: Çağıranın `manage` izni var mı. Arayüzün izin sekmesini göstermesi buna bağlı.

    SetFolderPermissionsRequest:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          description: |
            Bu düğümdeki grant'ların TAMAMI. Boş dizi, bu düğümdeki bütün açık izinleri kaldırır
            ve mirası yeniden yürürlüğe sokar — silmenin yolu bu, çünkü boş bir izin kümesi
            taşıyan bir grant satırı veritabanı tarafından reddediliyor.
          items: { $ref: '#/components/schemas/Grant' }

    PermissionImpact:
      type: object
      required: [foldersAffected, usersGaining, usersLosing]
      description: |
        §6.2: "Her izin değişimi dry-run ile etkilenecek kullanıcı/klasör sayısını göstermeli."
        Sayılar, mirasın ulaştığı ALT AĞACIN tamamı üzerinden hesaplanır — tıklamanın gerçek
        yarıçapı bu, değişen satır sayısı değil.
      properties:
        foldersAffected: { type: integer }
        usersGaining:
          type: array
          description: Bu değişiklikten sonra erişimi ARTAN kullanıcılar.
          items: { $ref: '#/components/schemas/AffectedUser' }
        usersLosing:
          type: array
          description: |
            Erişimi AZALAN kullanıcılar. Ayrı bir liste, çünkü bir yöneticinin durup düşünmesi
            gereken taraf bu — birine erişim vermek geri alınabilir, birinden almak o kişinin
            işini o an durdurur.
          items: { $ref: '#/components/schemas/AffectedUser' }

    AffectedUser:
      type: object
      required: [userId, username, before, after]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        before:
          type: array
          items: { $ref: '#/components/schemas/FolderPermission' }
        after:
          type: array
          items: { $ref: '#/components/schemas/FolderPermission' }

    PermissionWriteResult:
      type: object
      required: [applied, impact]
      properties:
        applied:
          type: boolean
          description: false ise dryRun'dı ve hiçbir şey yazılmadı.
        impact: { $ref: '#/components/schemas/PermissionImpact' }
        applyingJobId:
          type: [string, 'null']
          format: uuid
          description: |
            POSIX ACL'leri yeniden yazan iş. İzinler dosya sistemine ANINDA yansımıyor ve
            tamamlanana kadar iki katman ayrışık (ADR-0021'in kabul edilen borcu). Arayüz bunu
            "izinler uygulanıyor" diye göstermeli; sessizce tamamlanmış gibi davranmak, SMB'den
            hâlâ erişilebilen bir klasörü kapalı sanmaktır.

            Ajan ulaşılamazsa null olur ve yazma yine de yapılır — uygulama katmanı doğru,
            dosya sistemi geride. Bu durumun görünür olması, gizlenmesinden iyidir.
