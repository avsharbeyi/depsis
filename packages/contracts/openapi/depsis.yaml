openapi: 3.1.0

info:
  title: DEPSIS API
  version: 0.1.0-phase1
  summary: Debian tabanlı çok kullanıcılı NAS platformu — Faz 1 yüzeyi
  description: |
    Bu belge tek doğruluk kaynağıdır. `apps/web` istemcisi buradan üretilir
    (`openapi-typescript`, ADR-0002); elle yazılmış istemci tipi bulunamaz.

    Kapsam: Faz 1 uçları. Konsol, uygulama kataloğu ve uzak erişim de burada — sırasıyla ADR-0018, ADR-0019 ve ADR-0020. Üçü de cihazın DIŞINDAKİ bir şeyi yönetiyor (bir kabuk, podman, zerotier-one); DEPSIS hiçbirini paketlemez, kuruluysa yönetir ve kurulu değilse 503 döner. Konsol ayrıcalıklı ajanda ÇALIŞMAZ: §2.2'nin serbest komut yasağı duruyor.
    Faz 2-3'e aittir ve kasıtlı olarak yoktur — tanımlanmamış bir uç, "yakında" diye
    duran boş bir uçtan iyidir.

    Sistem aracısı IPC şeması burada DEĞİLDİR. ADR-0006 gereği onu Rust sahiplenir ve
    schemars ile üretir: bir güven sınırının sözleşmesini, o sınırı uygulayan taraf
    tanımlamalıdır.

servers:
  - url: /api/v1

tags:
  - name: setup
    description: |
      Tek seferlik ilk kurulum. Bu uçlar kurulum tamamlandığında kalıcı olarak 410 döner
      (ADR-0009).
  - name: auth
    description: Oturum ve MFA. Faz 1'de MFA yalnız TOTP (ADR-0009).
  - name: files
    description: Dosya ağacı. Yetki her zaman id üzerinden çözülür, asla yol üzerinden (ADR-0005).
  - name: uploads
    description: tus 1.0.0 devam ettirilebilir yükleme (ADR-0008).
  - name: search
    description: Türkçe-duyarlı ad araması (ADR-0010).
  - name: system
    description: Telemetri ve işler.
  - name: audit
    description: Cihazın denetim kaydı — kim, neyi, ne zaman. Eklenir; değişmez, silinmez.

security:
  - sessionCookie: []

paths:
  /health:
    get:
      tags: [system]
      summary: Canlılık ve hangi rolle bağlanıldığı
      security: []
      description: |
        Rolü de bildirir. Süs değil: ADR-0015 §4 satırları görebilen bir rolle açılmayı
        reddediyor, ama yanlış VERİTABANINA yönlendirilmiş bir dağıtım o kontrolü geçebilir —
        rolün görünür olması, operatörün bunu destek talebinden önce fark etme yoludur.
      responses:
        '200':
          description: Yanıt her durumda 200; sağlık gövdededir
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }

  /setup/status:
    get:
      tags: [setup]
      summary: Kurulum gerekiyor mu
      security: []
      description: |
        Kimlik doğrulaması yok, çünkü web arayüzü kimse giriş yapamadan önce hangi ekranı
        göstereceğini bilmek zorunda. Yalnız bir boole döner — organizasyon adı, yönetici
        adresi veya neyin var olduğuna dair bir ipucu yok.
      responses:
        '200':
          description: Durum
          content:
            application/json:
              schema:
                type: object
                required: [setupRequired]
                properties:
                  setupRequired: { type: boolean }

  /setup/claim:
    post:
      tags: [setup]
      summary: Sistemi tek seferlik belirteçle sahiplen
      security: []
      description: |
        İlk organizasyonu ve yöneticisini yaratır. Belirteç, kurulum beklerken API'nin her
        açılışta journal'a bastığı tek kullanımlık değerdir; okumak konsol veya SSH erişimi
        gerektirir ve ilk yöneticinin kim olacağına karar vermesi gereken yetki budur
        (ADR-0015 §5d).

        Doğrulama hataları burada ALANI SÖYLER, giriş yolunun aksine: karşı taraf makinenin
        sahibi, formu bir kez dolduruyor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupClaimRequest' }
      responses:
        '200':
          description: Sahiplenildi
          content:
            application/json:
              schema:
                type: object
                required: [status, organizationSlug]
                properties:
                  status: { type: string, enum: [ok] }
                  organizationSlug: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '410':
          description: Kurulum zaten tamamlandı; bu uç kalıcı olarak kapalı
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /auth/login:
    post:
      tags: [auth]
      summary: Parola ile oturum aç
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Oturum açıldı veya MFA gerekiyor
          headers:
            Set-Cookie:
              description: HttpOnly + Secure + SameSite=Lax oturum çerezi
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/mfa/verify:
    post:
      tags: [auth]
      summary: TOTP kodunu doğrula
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
      responses:
        '200':
          description: Doğrulandı; bekleyen çerez temizlendi ve oturum çerezi kuruldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaVerifyResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Bu oturumu sonlandır
      responses:
        '204':
          description: Sonlandırıldı

  /me:
    get:
      tags: [auth]
      summary: Oturum sahibinin profili
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Problem' }

  /me/mfa/enrolment:
    post:
      tags: [auth]
      summary: TOTP kaydını başlat
      description: |
        Bir sır üretir ve **onaylanmamış** olarak saklar. Onaylanmamış bir sır girişi
        engellemez: QR'ı okutup telefonu kaybeden bir kullanıcı aksi hâlde hiç kullanamadığı bir
        sır yüzünden kilitlenirdi — ve kurtarma kodları onayda veriliyor.

        Zaten onaylanmış bir kayıt varsa 409 döner; değiştirmek için önce kaldırmak gerekir.
      responses:
        '200':
          description: Okutulacak sır
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrolment' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /me/mfa/enrolment/confirm:
    post:
      tags: [auth]
      summary: Kaydı bir kodla onayla ve kurtarma kodlarını al
      description: |
        Kurtarma kodları **yalnız burada** okunabilir hâlde döner; saklanan yalnız hash'leri.
        Onay kodu da harcanır, dolayısıyla aynı 30 saniye içinde girişte kullanılamaz —
        arayüz bunu söylemeli.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Kayıt tamam; kodlar bir kez gösterilir
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        '401': { $ref: '#/components/responses/Problem' }

  /me/mfa:
    delete:
      tags: [auth]
      summary: TOTP kaydını kaldır
      description: |
        Parola yeniden isteniyor. §0.5: güvenlik riski taşıyan bir işlem sessizce
        yapılamaz — ikinci faktörü kaldırmak, ele geçirilmiş bir oturumun yapmak isteyeceği ilk
        şeydir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordConfirmation' }
      responses:
        '204':
          description: Kaldırıldı
        '401': { $ref: '#/components/responses/Problem' }

  /me/mfa/recovery-codes:
    post:
      tags: [auth]
      summary: Kurtarma kodlarını yenile
      description: |
        Eskiler geçersiz olur. Parola yeniden isteniyor, aynı §0.5 gerekçesiyle: yeni bir set
        üretmek, eskisini elinde tutan sahibi sessizce kilitleyebilir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordConfirmation' }
      responses:
        '200':
          description: Yeni kodlar, bir kez
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /directory/users:
    get:
      tags: [users]
      summary: Kime izin verilebileceğini bilmek için ad ve kimlik
      description: |
        HER OTURUM. `/users`'ın aksine burada `AdminGuard` yok, ve bunun nedeni §6.2'nin `manage`
        iznidir: bir klasörün yönetimi sıradan bir üyeye devredilebilir, o üye izin verebilir, ama
        `/users` ona 403 döner. Arayüz o 403'ü boş bir listeye çevirdiği sürece devredilmiş yetki
        "kutuda hiç kullanıcı yok" gibi görünüyordu — çalışan bir yetki, çalışmayan bir ekran.

        DÖNEN ŞEY BİR AD VE BİR KİMLİKTİR, BAŞKA HİÇBİR ŞEY DEĞİL. Rol, e-posta, kapatılma
        durumu, oluşturulma zamanı — hiçbiri yok. Kullanıcı adları zaten her üyeye görünüyor: iş
        panosunda atanan kişi, dosya listesinde sahip, yorumda yazar. Bu uç yeni bir şey
        sızdırmıyor, var olanı seçilebilir hâle getiriyor.
      responses:
        '200':
          description: Kuruluşun hesap adları
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectoryPage' }
        '401': { $ref: '#/components/responses/Problem' }

  /audit:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: Cihazın denetim kaydı
      description: |
        Kim, neyi, ne zaman. Yalnız yönetici — 403 döner, 404 değil, çünkü ucun varlığı sır değil.
        Satırlar üyelerin adlarını, kimlik doğrulama olaylarında IP'lerini ve hangi nesneye
        dokunduklarını taşıyor; bu uç kiracının İÇİNDEKİ mahremiyetin de sınırıdır ve sıradan
        üyeye açık değildir.

        Kayıt EKLENİR, değişmez, silinmez: uygulamanın veritabanı rolünün bu tabloda UPDATE ve
        DELETE yetkisi hiç yok (migration 0036). Yazan bir uç da yok — satırlar yalnız sunucunun
        kendi kodunda, denetlenen işlemin akışı içinde doğar; dışarıdan satır yazdırmanın bir
        yolu yoktur.

        Sayfalama imleçli: `nextBefore` doluysa bir sonraki sayfa `before` olarak onu verir.
        `action` bir önek de olabilir: `auth`, `auth.login` ve altındakilerin hepsini kapsar.
      parameters:
        - name: before
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Olaylar, en yeni önce
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /users:
    get:
      tags: [users]
      summary: Organizasyonun hesaplarını listele
      description: |
        Yalnız yöneticiler. 403 döner, 404 değil — bu uç noktanın varlığı sır değil, kimin
        çağırabileceği sır. Başka kiracının nesnesi olan uç noktalar 404 döner ve bu fark
        tutarsızlık değil, karar.
      responses:
        '200':
          description: Hesaplar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [users]
      summary: Hesap oluştur
      description: |
        Parola sunucuda Argon2id ile özetlenir; düz metin hiçbir yerde saklanmaz.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [users]
      summary: Görünen ad, rol veya devre dışı durumunu değiştir
      description: |
        Parola ve e-posta BURADA DEĞİL. Yöneticinin belirlediği bir parola, yöneticinin bildiği
        bir paroladır — her hesabı denetimde ayırt edilemeyecek şekilde taklit edilebilir kılar.
        E-posta değişikliği ise parola sıfırlamanın nereye gideceğini sessizce taşır.

        Bir organizasyon en az bir etkin yönetici tutmak zorunda; bunu veritabanı trigger'ı
        uygular, çünkü iki yöneticinin birbirini eşzamanlı düşürmesi uygulama seviyesinde
        sayılamaz. Son yöneticiyi düşürmek 409 döner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /users/{id}/password-reset:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [users]
      summary: Bir hesap için tek kullanımlık parola sıfırlama bileti aç
      description: |
        Yalnız yöneticiler. Parolasını unutan bir kullanıcının üründen kurtarılmasının yolu.

        YÖNETİCİ PAROLAYI BELİRLEMİYOR ve `PATCH /users/{id}` bunun neden böyle olması
        gerektiğini yazıyor: "yöneticinin belirlediği bir parola, yöneticinin bildiği bir
        paroladır." Dönen şey elden verilecek tek kullanımlık bir jeton; parolayı kullanıcı
        kendisi seçiyor.

        Bu, taklidi imkânsız kılmıyor — bir NAS'ın yöneticisi zaten root eşdeğeri. Değiştirdiği
        şey, taklidin SESSİZ olmaktan çıkması: jeton tek kullanımlık, yani yönetici kullanırsa
        kullanıcının kendi denemesi başarısız olur ve kurban olayı öğrenir.

        Yöneticinin KENDİ parolası isteniyor. Bir oturum, birinin açık bırakılmış dizüstünü ödünç
        alan kişinin sahip olduğu şeydir ve bu uç, öyle bir dizüstünde bulunabilecek en kullanışlı
        şey: cihazdaki her hesaba açılan bir kapı.

        Jeton BİR KEZ gösteriliyor. Veritabanında yalnız SHA-256 özeti duruyor, yani bu yanıt
        değerin var olduğu tek yer; geri okuyabilecek ikinci bir uç yok.

        Kendine sıfırlama açmak 409: `POST /me/password` bunu zaten doğru yapıyor — mevcut parolayı
        istiyor ve mevcut oturumu ayakta bırakıyor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  maxLength: 1024
                  description: Çağıran YÖNETİCİNİN kendi parolası. Hedef kullanıcının değil.
      responses:
        '201':
          description: Bilet açıldı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetTicket' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /auth/password-reset:
    post:
      tags: [auth]
      summary: Bileti kullan ve yeni parolayı belirle
      description: |
        KİMLİK DOĞRULAMASIZ, ve bütün mesele bu: bu ucu kullanan kişi giriş yapamıyor. Yetkiyi
        veren şey, yöneticinin verdiği jeton.

        İKİNCİ FAKTÖR YİNE İSTENİYOR. Hesap MFA'ya kayıtlıysa doğrulayıcı kodu ya da kurtarma kodu
        gerekiyor; yoksa çalınmış bir kâğıt parçasıyla ikinci faktörün önünden dolaşılabilirdi —
        ikinci faktörün var olma sebebi tam olarak bunu engellemek. `code` şemada isteğe bağlı
        çünkü çağıran hesabın kayıtlı olup olmadığını bilemez, ve kodsuz isteği reddetmek bu soruyu
        çalınmış bir bileti elinde tutan birine cevaplamak olurdu.

        Kullanıcının BÜTÜN oturumları iptal ediliyor.

        HER BAŞARISIZLIK AYNI CEVABI VERİYOR. Bilinmeyen jeton, süresi dolmuş jeton, kullanılmış
        jeton, devre dışı hesaba ait jeton ve yanlış ikinci faktör — hepsi aynı 401. Ayırt
        edilebilir olsalardı bu uç, hangi biletlerin var olduğunu söyleyen bir kâhin olurdu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, maxLength: 512 }
                password: { type: string, minLength: 12, maxLength: 1024 }
                code:
                  type: string
                  maxLength: 64
                  description: Hesap ikinci faktöre kayıtlıysa zorunlu. Altı haneli kod ya da kurtarma kodu.
      responses:
        '200':
          description: Parola değişti
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /me/password:
    post:
      tags: [me]
      summary: Kendi parolasını değiştir
      description: |
        Mevcut parola, oturum zaten varken bile isteniyor: bir oturum, birinin açık bırakılmış
        dizüstünü ödünç aldığında sahip olduğu şeydir, ve bu adım olmadan hesabın sahibini kalıcı
        olarak dışarıda bırakmak için gereken tek şeydir.

        Diğer BÜTÜN oturumlar iptal edilir. Parola değişikliği insanın kimlik bilgilerinin
        başkasında olduğunu düşündüğünde yaptığı şeydir; o birini oturumda bırakmak değişikliği
        anlamsız kılar. Mevcut oturum ayakta kalır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Değiştirildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordChanged' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }

  /files:
    get:
      tags: [files]
      summary: Bir klasörün içeriğini listele
      description: |
        Cursor pagination zorunlu (§14). Offset kullanılmaz: bir NAS'ta küme sürekli
        değiştiği için offset sayfalama sessizce kayıt atlar.

        Yanıtta toplam sayı yoktur, yalnız hasMore. Filtrelenmiş bir liste yanında
        filtrelenmemiş bir sayaç, kiracının göremediği satırların varlığını sızdırır.
      parameters:
        - name: parentId
          in: query
          description: Yoksa kullanıcının kökleri döner.
          schema: { type: string, format: uuid }
        - name: shareId
          in: query
          required: false
          description: |
            Hangi paylaşım. Verilmezse kiracının varsayılanı — yani bu parametreden önceki her
            istemci aynen çalışmaya devam eder.

            Bu parametre olmadan dosya yöneticisi HER ZAMAN ilk paylaşımı gösteriyordu
            (`ORDER BY created_at LIMIT 1`), yani `POST /shares` ile açılan bir paylaşım
            Samba'ya yayımlanıyor ve web'de görünmüyordu.

            Başka bir kiracının paylaşımı 404 — var olmayan bir kimlikle aynı cevap, yoksa
            parametre hangi paylaşım kimliklerinin var olduğunu söyleyen bir kâhin olurdu.
          schema: { type: string, format: uuid }
        - name: trashed
          in: query
          description: |
            Doğruysa çöp kutusu listelenir ve `parentId` yok sayılır. Çöp bir klasör değil bir
            sütun (0008: `trashed_at`), yani ağaçta gezilecek bir yeri yok; ayrı bir uç nokta
            yerine bir süzgeç olması da bu yüzden.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, modified, size]
            default: name
      responses:
        '200':
          description: Sayfa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileEntryPage' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /files/folders:
    post:
      tags: [files]
      summary: Klasör oluştur
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFolderRequest' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileEntry' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /files/{id}:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [files]
      summary: Tek bir girdinin ayrıntısı
      responses:
        '200':
          description: Girdi
          headers:
            ETag:
              description: |
                Meta veri doğrulayıcısı. `PATCH /files/{id}` bunu `If-Match` olarak kabul eder.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileEntryDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [files]
      summary: Yeniden adlandır
      description: |
        Taşıma da burada: `parentId` alanı aynı satırın diğer kolonu ve dosya sistemi tarafında da tek bir rename(2). PAYLAŞIMLAR ARASI taşıma burada değil — dataset sınırını geçen bir rename EXDEV veriyor (ADR-0008) ve kopyala+sil işine dönüşmesi gerek; o /file-operations — taşımada hem kaynak
        hem hedef yetkisi gerekir (§6.2).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFileRequest' }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileEntry' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        # 501 KALDIRILDI. Taşıma artık ajanın `MoveEntry` işlemiyle gerçekten yapılıyor:
        # önce dosya sistemi, sonra veritabanı. Sıra bu yönde çünkü ters sırada, rename
        # başarısız olduğunda satır yeni yerini gösterir ve diskteki dosya eski yerinde kalır —
        # veritabanıyla diskin ayrışması, bu üründe kabul edilmeyen tek şey.
    delete:
      tags: [files]
      summary: Çöp kutusuna taşı
      description: |
        Bu bir JOB DEĞİL. Önceki hâli 202 + JobRef diyordu, çünkü büyük bir alt ağacı silmek
        uzun iş gibi görünüyordu; çöpe atmak tek satırda tek bayrak çıktı. Bayt silinmiyor —
        çöpü boşaltmak ajandan `unlink` isteyen ayrı bir karar. Var olmayan bir işe referans
        döndürmek, istemcinin sorgulayamayacağı bir kuyruk girdisi uydurmak olurdu.
      responses:
        '200':
          description: Çöp kutusuna taşındı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileEntry' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /files/{id}/thumbnail:
    get:
      tags: [files]
      summary: Gömülü küçük resim
      description: |
        SUNUCU HİÇBİR GÖRÜNTÜNÜN KODUNU ÇÖZMÜYOR. Telefon ve fotoğraf makinesi JPEG'leri küçük
        resmi zaten içinde taşıyor — EXIF'in IFD1 bölümünde, tam bir JPEG olarak — ve bu uç onu
        bayt dilimleyerek çıkarıyor. Kodlanmış piksel verisine hiç dokunulmuyor.

        Alternatifi, sunucuya bir görüntü kütüphanesi koyup güvenilmeyen kullanıcı baytlarını
        oturumları tutan sürecin içinde çözmek olurdu. Bir NAS'ın en çok yüklenen şeyi fotoğraf,
        yani o kod her gün güvenilmeyen veri görürdü.

        **`download` izni istiyor, `read` değil:** bir küçük resim içeriğin küçültülmüş bir
        kopyası, ve adını görebilen ama baytlarını alamayan birine onu göstermek izni atlatmak
        olurdu.

        **Küçük resmi olmayan dosya için 204, 404 değil.** Girdinin kendisi var — çağıran onu
        görüyor ve indirebiliyor — olmayan tek şey gömülü bir küçük resim, ki ekran görüntülerinin
        ve EXIF'siz resimlerin çoğunda olmaması normal. Ayrıca 4xx tarayıcı konsoluna bir hata
        satırı yazıyor: yüz fotoğrafın seksen tanesinde küçük resim yoksa bir klasörü açmak seksen
        kırmızı satır demek, ve gerçek hataların görülmemesinin yolu bu. 404 yalnız gerçek yokluk
        için: girdi yok, ya da çağıran onu göremiyor.

        Cevap her zaman `image/jpeg`, ve `X-Depsis-Orientation` (1–8) EXIF yönlendirmesini
        taşıyor: gömülü küçük resim ana görüntüyle aynı yönde saklanıyor, ve döndürme istemcide bir
        CSS dönüşümü olarak yapılıyor — pikselleri sunucuda çevirmek, tam da kaçınılan şeyi
        yapmak olurdu.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Küçük resim
          headers:
            X-Depsis-Orientation:
              description: EXIF yönlendirmesi, 1–8. Bilinmiyorsa 1.
              schema: { type: integer, minimum: 1, maximum: 8 }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '204':
          description: Girdi var ve görülebiliyor, ama gömülü küçük resmi yok.
        '404':
          description: Girdi yok ya da çağıran onu göremiyor.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /files/{id}/content:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [files]
      summary: Dosya içeriğini indir
      description: |
        RFC 9110 §14 Range destekler. Sunucu dosyayı belleğe almaz, akıtır. Güçlü ETag ile
        If-Range; dosya değiştiyse 206 yerine 200 döner ve bozuk splice engellenir.
      parameters:
        - name: Range
          in: header
          schema: { type: string }
        - name: If-Range
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Tam içerik
          headers:
            Accept-Ranges:
              schema: { type: string }
            ETag:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Kısmi içerik
          headers:
            Content-Range:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Problem' }
        '416': { $ref: '#/components/responses/Problem' }

  /file-operations:
    post:
      tags: [files]
      summary: Kopyala — uzun süren iş olarak
      description: |
        Hem kaynak hem hedef yetkisi doğrulanır (§6.2): kaynakta `download`, hedefte `create`.
        `download`, `read` değil — `read` üstveridir (ad, boyut, tarih), kopyalama İÇERİĞİ alır.
        Bir dosyanın var olduğunu görebilmek, onun kopyasını kendi klasörüne çıkarabilmek
        anlamına gelmemeli.

        202 ve bir `JobRef` dönüyor. §17: bin dosyalık toplu bir işlem arayüzü kilitlemez ve
        durumu gerçek zamanlı güncellenir — iş kuyrukta çalışıyor, `GET /jobs/{jobId}` ve
        `GET /events` üzerinden izleniyor.

        ── Şu an ne sunuluyor ──────────────────────────────────────────────────

        `operation: copy` — evet.

        `operation: move` — hayır, 422. Tek girdi taşıma `PATCH /files/{id}`: tek bir
        `renameat2`, anında, ve kuyruğa sokmak yaygın durumu hiçbir kazanç olmadan yavaşlatır.
        PAYLAŞIMLAR ARASI taşıma gerçekten buraya ait — dataset sınırını geçen bir rename EXDEV
        verir (ADR-0008) ve kopyala+sil'e dönüşmesi gerekir — ama yarım uygulanmış bir taşıma,
        kopyalayıp silmeyi başaramadığında kullanıcının bir tane istediği yerde iki dosya
        bırakır. Yaklaşık yapmak yerine reddediliyor.

        `operation: restore` — hayır, 422. `POST /files/{id}/restore` var.

        `conflictPolicy: keep_both` — evet, ve şu an tek desteklenen. `replace` kullanıcının
        adlandırmadığı bir dosyayı yok ederdi; `RENAME_NOREPLACE` bunu syscall'a kadar
        engelliyor ve desteklemek ajana sahip olmadığı bir üzerine-yazma vermek demek olurdu.
        `version` var olmayan bir sürüm deposu istiyor. `skip` savunulabilir ve henüz yazılmadı;
        onun adı altında sessizce `keep_both` yapmaktansa reddetmek daha dürüst.

        ── Sınırlar ────────────────────────────────────────────────────────────

        Bir klasör kendi içine ya da kendi altındaki bir klasöre kopyalanamaz: 409. Her adım tek
        başına geçerli bir oluşturma olduğu için veritabanı bunu durdurmaz, sonu gelmeyen bir
        ağaç olurdu.

        100.000 girdiden büyük bir seçim reddediliyor. Performans sınırı değil: kopyalama, tek
        bir yükleme olmadan saklanan baytları çoğaltabilen iki işlemden biri, ve paylaşımın
        kökünü seçen birine sayıyı söylemek, bir saat sonra dolmuş bir dataset olarak
        keşfettirmekten iyi.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileOperationRequest' }
      responses:
        '202':
          description: İş kuyruğa alındı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '507':
          description: |
            Seçimin toplam boyutu havuzda kalan yerden büyük. Bir garanti değil bir nezaket
            kontrolü — eşzamanlılık altında yer, bu cevapla kopyalama arasında başka bir yükleme
            tarafından alınabilir; ajanın ENOSPC/EDQUOT sınıflandırması bu yüzden ayrıca var.
            Dönüştürdüğü şey yaygın durum: bir saat sonra yarısı kopyalanmış bir ağaçla
            başarısız olmak yerine, iki sayıyı hemen söylemek.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /uploads:
    post:
      tags: [uploads]
      summary: Devam ettirilebilir yükleme oluştur (tus creation)
      description: |
        Yükleme, hedefin kendi dataset'i içindeki .depsis/staging/ altına iner; ayrı bir
        staging dataset'i yoktur, çünkü dataset'ler arası yayınlama atomik olamaz (ADR-0008).

        Kota aşımı EDQUOT üretir ve bu 507 olarak döner, 500 olarak değil.
      parameters:
        - name: Upload-Length
          in: header
          required: true
          schema: { type: integer, format: int64 }
        - name: Upload-Metadata
          in: header
          required: true
          description: tus base64 metadata; filename ve parentId taşır.
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Oluşturuldu
          headers:
            Location:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '507': { $ref: '#/components/responses/Problem' }

  /uploads/{uploadId}/resolve:
    post:
      tags: [files]
      summary: Ad cakismasini kullanicinin karariyla bitir
      description: |
        Cakisma YAYIMLAMA aninda, yani son parcadan SONRA ortaya cikiyor: dosya butunuyle ara
        alanda duruyor. Bu yuzden cozum "yeniden yukle" degil "yayimlamayi tekrar dene" --
        kullanici bir gigabayti ikinci kez gondermiyor.

        `keep-both`: yeni dosya "ad (2).uzanti" ile iniyor; kopyalama yolunun kullandigi
        adlandirma kuralinin aynisi.

        `replace`: ESKISI COPE GIDIYOR, silinmiyor. Ustune yazmak urunun hicbir katmaninda yok ve
        olmamasi bilincli (ADR-0008); "degistir" diyen kullanicinin istedigi sey yeni dosyanin o
        adi almasi, eskisinin geri getirilemez olmasi degil.
      parameters:
        - name: uploadId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy]
              additionalProperties: false
              properties:
                policy: { type: string, enum: [keep-both, replace] }
      responses:
        '200':
          description: Dosya yayimlandi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileEntry' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /uploads/{uploadId}:
    parameters:
      - name: uploadId
        in: path
        required: true
        schema: { type: string }
    head:
      tags: [uploads]
      summary: Kaldığı yeri sor (tus HEAD)
      responses:
        '200':
          description: Mevcut offset
          headers:
            Upload-Offset:
              schema: { type: integer, format: int64 }
            Upload-Length:
              schema: { type: integer, format: int64 }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [uploads]
      summary: Parça gönder (tus PATCH)
      description: |
        Gövde ham bayttır. Bu route'ta body parser kapalı olmalıdır; stream'e dokunan
        herhangi bir parser yüklemeyi sessizce bozar (ADR-0008).
      parameters:
        - name: Upload-Offset
          in: header
          required: true
          schema: { type: integer, format: int64 }
        - name: Upload-Checksum
          in: header
          description: sha256 base64. Tarayıcı SubtleCrypto yalnız SHA ailesini destekler.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204':
          description: Parça kabul edildi
          headers:
            Upload-Offset:
              schema: { type: integer, format: int64 }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '507': { $ref: '#/components/responses/Problem' }

  /search:
    get:
      tags: [search]
      summary: Ad araması
      description: |
        Sorgu normalize edilmiş kolona karşı çalışır (ADR-0010). İstanbul yazan da istanbul
        yazan da aynı sonucu alır; cagri yazmak Çağrı dosyalarını bulur.

        Sonuçlar yalnız çağıranın ACL/RLS kapsamındaki nesnelerden gelir. Sayaç ve öneriler
        de aynı kapsamdan üretilir.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: shareId
          in: query
          required: false
          description: |
            Hangi paylaşım. Verilmezse kiracının varsayılanı — yani bu parametreden önceki her
            istemci aynen çalışmaya devam eder.

            Bu parametre olmadan dosya yöneticisi HER ZAMAN ilk paylaşımı gösteriyordu
            (`ORDER BY created_at LIMIT 1`), yani `POST /shares` ile açılan bir paylaşım
            Samba'ya yayımlanıyor ve web'de görünmüyordu.

            Başka bir kiracının paylaşımı 404 — var olmayan bir kimlikle aynı cevap, yoksa
            parametre hangi paylaşım kimliklerinin var olduğunu söyleyen bir kâhin olurdu.
          schema: { type: string, format: uuid }
        - name: scope
          in: query
          description: Yoksa tüm erişilebilir alan.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Sonuçlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileEntryPage' }
        '422': { $ref: '#/components/responses/Problem' }

  /shares:
    get:
      tags: [system]
      summary: Paylaşımlar ve SMB adresleri
      description: |
        §9. Bir NAS'ın varlık sebebi Windows'tan bir sürücü olarak görünmek, ve o adresi
        kullanıcıya SÖYLEYEN bir yer yoksa özellik yarım kalır — kimse `\\depsis\belgeler`
        yazacağını tahmin edemez.

        `published`, ajanın Samba yapılandırmasını gerçekten yazıp yazmadığını söyler. Bu alan
        iyimser DEĞİL: DEPSIS'in veritabanında bir paylaşım satırı olması, smbd'nin onu sunduğu
        anlamına gelmiyor, ve ikisini aynı şeymiş gibi göstermek kullanıcıyı çalışmayan bir
        adresi denemeye gönderir.
      responses:
        '200':
          description: Paylaşımlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharePage' }

    post:
      tags: [system]
      summary: Paylaşım aç
      description: |
        Yalnız yöneticiler. §9'un eksik yarısı: bugüne kadar DEPSIS paylaşımları LİSTELİYOR ama
        açamıyordu — satırlar yalnız testlerden ve elle gelebiliyordu.

        Üç şey tek bir işlemde olur ve sırası önemlidir:

        1. **Dataset.** Ajan `zfs create -o acltype=posixacl` çalıştırır ve özelliği geri OKUR;
           `nfsv4` kendini kurulmuş gibi raporlayıp hiçbir şey uygulamadığı için (P0-B) bu
           doğrulama pazarlık konusu değil. Dataset `DEPSIS_SHARE_PARENT_DATASET` altına açılır
           ve oraya bağlı olduğu için paylaşım köküne düşer.
        2. **Satır.** `public.shares`. Dataset ÖNCE açılır: bir satır yazıp dataset'i açamamak,
           dosya yöneticisinde görünen ama açılamayan bir paylaşım bırakır.
        3. **Kök grant.** `grants` verilmezse paylaşımı açan yöneticiye tam izin yazılır.

        Üçüncüsü isteğe bağlı DEĞİL, ve sebebi bir güvenlik açığı: grant'ı olmayan bir paylaşım,
        §6.2 öncesi "kiracının herkesi yedi izin alır" davranışına geri düşen bir istisnayı
        canlı tutuyordu. `POST /shares` kök grant'ı aynı işlemde yazdığı için o istisna
        kaldırıldı (migration 0016). **Yeni paylaşım KAPALI doğar**: yalnız grant'ta adı geçen
        principal'lar ve organizasyon yöneticileri görür.

        POSIX ACL'lerin yazılması bir iş kuyruğuna girer ve `applyingJobId` onu adlandırır.
        `null` ise ajana ulaşılamadı: satır ve grant duruyor, dosya sistemi henüz haberdar değil.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareCreateRequest' }
      responses:
        '201':
          description: Açıldı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareCreated' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          # Ad zaten alınmış (veritabanında ya da dataset olarak).
          $ref: '#/components/responses/Problem'
        '422': { $ref: '#/components/responses/Problem' }
        '503':
          # Ajana ulaşılamıyor ya da DEPSIS_SHARE_PARENT_DATASET ayarlı değil.
          $ref: '#/components/responses/Problem'

  /system/smb:
    post:
      tags: [system]
      summary: Samba yapılandırmasını yeniden yayımla
      description: |
        Yalnız yöneticiler. Ajan yapılandırmayı atomik olarak yazar, `testparm` ile doğrular ve
        canlı bir bağlantı denemesi yapar; herhangi biri başarısız olursa ESKİSİNE GERİ DÖNER.

        Bu üç adımın üçü de gerekli ve sebebi ölçüldü (P0-B): geçersiz bir `full_audit` opname
        `testparm`'dan temiz geçiyor ve sonra smbd'nin BÜTÜN bağlantıları reddetmesine yol
        açıyor. Yalnız `testparm` koşan bir kapı, kapı değil.

        Uç nokta idempotent: aynı yapılandırma iki kez yayımlanabilir.
      responses:
        '200':
          description: Yayımlandı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmbPublishResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          # Ajan reddetti ve eskisine geri döndü. Paylaşımlar çalışmaya devam ediyor.
          $ref: '#/components/responses/Problem'
        '503': { $ref: '#/components/responses/Problem' }

  /system/trash-policy:
    get:
      tags: [system]
      summary: Çöp kutusunun saklama politikası ve neye mal olacağı
      description: |
        Yalnız yöneticiler. 403 döner, 404 değil — bu ucun varlığı sır değil, kimin
        çağırabileceği sır.

        `days` verilirse, KAYDEDİLMEMİŞ bir değer fiyatlanır: ayar ekranı bir sayıyı yazan
        kişiye, kaydetmeden önce ilk çalışmanın ne alacağını gösteriyor. Verilmezse kayıtlı
        politika fiyatlanır — yani bir sonraki zamanlanmış çalışmanın ne alacağı.

        ÖNİZLEME BİR KOLAYLIK DEĞİL, GÜVENLİK ARGÜMANININ PARÇASI. Bu politikayı açmak, kimse
        bakmazken, bir zamanlamaya göre, kalıcı olarak kullanıcı verisi silmeye başlamak demek.
        Sayı olmadan ayarlanan bir politika, körlemesine ayarlanmış bir politikadır.

        `impact.bytes` KÖKLERİN değil, altlarındaki DOSYALARIN toplamı.
        `file_entries_folder_has_no_size` bir klasörün `size_bytes` değerini 0'a sabitliyor, yani
        kökleri toplamak 10 GB'lık bir klasörü "1 öğe, 0 bayt" diye gösterirdi — yıkımın
        silahlandırıldığı ekranda, ölçülmeden raporlanmış bir geri kazanılabilir alan rakamı.
      parameters:
        - name: days
          in: query
          required: false
          description: Kaydedilmemiş bir değeri fiyatla. Verilmezse kayıtlı politika fiyatlanır.
          schema: { type: integer, minimum: 1, maximum: 3650 }
      responses:
        '200':
          description: Politika ve etkisi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashPolicy' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      tags: [system]
      summary: Saklama politikasını değiştir
      description: |
        `retentionDays: null` politikayı KAPATIR ve varsayılan budur: bir göç, kimsenin
        seçmediği bir anda kullanıcı verisi silmeye başlamamalı.

        En az 1 gün. Sıfır, "çöpe atmak kalıcı silmektir" demek olurdu — çöp kutusu bu üründe
        bir kullanıcı ile geri alınamaz veri kaybı arasındaki tek tıklama, ve yanlışlıkla 0
        yazmanın sonucu geri alınamaz. Veritabanı da kabul etmiyor.

        Kaydetmek bir temizlemeyi HEMEN kuyruğa alıyor. Ne alacağı kendisine gösterilmiş biri
        olmasını bekler; bir saat hiçbir şey olmaması, kaydedilmemiş bir ayar gibi okunur.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [retentionDays]
              properties:
                retentionDays:
                  type: integer
                  nullable: true
                  minimum: 1
                  maximum: 3650
      responses:
        '200':
          description: Kaydedildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashPolicy' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /system/disks/{diskId}/label:
    put:
      tags: [system]
      summary: Diske takma ad ver
      description: |
        `diskId`, diskin `/dev/disk/by-id` adi. Bos bir ad gonderilirse ad KALDIRILIYOR: "adi yok"
        bos bir metinle degil, satirin olmamasiyla anlatiliyor.

        Ad diskin kendisine degil, KIRACIYA ait: iki kiraciyi tasiyan bir kutuda birinin verdigi
        ad otekinin ekraninda gorunmuyor.
      parameters:
        - name: diskId
          in: path
          required: true
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              additionalProperties: false
              properties:
                label: { type: string, maxLength: 64 }
      responses:
        '204': { description: Ad kaydedildi ya da kaldirildi }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /system/telemetry:
    get:
      tags: [system]
      summary: Donanım ve depolama durumu
      description: |
        Kapasite zfs get değerlerinden gelir, statvfs'ten DEĞİL — ölçüldüğü üzere statvfs
        kotayı yanlış raporluyor (ADR-0008).

        Yetkisiz kullanıcıya sistem ayrıntısı gösterilmez; yanıt role göre daralır.
      responses:
        '200':
          description: Durum
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Telemetry' }
        '403': { $ref: '#/components/responses/Problem' }
        '503':
          # Havuz verisi yalnızca ayrıcalıklı ajandan gelebilir. Ajan yoksa doğru cevap boş bir
          # `pools` dizisi DEĞİL: o, "havuz yok" ile "bilmiyoruz"u aynı şeye çevirir ve bir
          # operatörün görmesi gereken en önemli farkı siler.
          $ref: '#/components/responses/Problem'

  /system/disks:
    get:
      tags: [system]
      summary: Kutudaki fiziksel diskler
      description: |
        `/system/telemetry` "bana söylenen diskler nasıl" sorusunu cevaplıyor ve bir operatörün
        `DEPSIS_SMART_DISKS`'e elle yazdığı listeye dayanıyor. Bu uç farklı bir soruyu
        cevaplıyor: **kutuda ne var.**

        §8.1 her yıkıcı depolama işleminden önce, etkilenen diskleri SERİ/WWN ile adlandıran bir
        analiz istiyor. Envanter olmadan o analiz üretilemez — havuz oluşturma sihirbazının
        olmamasının sebebi buydu.

        `serial` NULL OLABİLİR ve bu bir eksiklik değil: ADR-0000 ölçtü, SCSI VPD sayfa 0x80
        Hyper-V'de bozuk. Kimlik zinciri sayfa 0x83 (yani `wwn`), sonra partuuid, sonra ZFS
        etiket GUID'i. Yalnız seriye dayanan bir onay kutusu, projenin geliştirildiği
        hipervizörde boş bir alan gösterirdi.

        Yalnız yöneticiye. Diskin modeli, serisi ve neyin bağlı olduğu, bir kullanıcının
        görmesi gereken bir şey değil.
      responses:
        '200':
          description: Envanter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiskInventory' }
        '403': { $ref: '#/components/responses/Problem' }
        '503':
          # Boş bir `disks` dizisi DEĞİL. "Bu kutuda disk yok" ile "soramadık" arasındaki fark,
          # bir havuz sihirbazının önünde durduğu farkın ta kendisi.
          $ref: '#/components/responses/Problem'

  /system/power/reboot:
    post:
      tags: [system]
      summary: Cihazi yeniden baslat
      description: |
        Guc menusunde "Yenile" yazan bir dugme vardi ve yalnizca TARAYICI SAYFASINI tazeliyordu.
        Bir guc simgesinin altinda "yenile" yazmasi, yapmadigi bir seyi vaat etmekti.

        YALNIZ KURUCU YONETICI. Kutuyu kapatmak, o kutudaki herkesin isini kesiyor.

        PAROLA ISTENMIYOR, guncelleme uygulamaktan farkli olarak: yeniden baslatmak veri
        kaybettirmiyor ve geri alinabilir: ekrandaki onay kutusu yetiyor. Ayni kokenden gelmesi
        ise sart, cunku bu govdesi olmayan ve tek cagriyla etki eden bir islem.

        202: istek systemd'ye birakildi, kapanma ondan sonra basliyor. Ajanin susmasi bu tek
        islemde hata sayilmiyor: kapanma basladiysa olacak olan sey zaten bu.
      responses:
        '202': { description: Yeniden baslatma istegi kabul edildi }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /system/storage:
    get:
      tags: [system]
      summary: Depolamanın kurulu olup olmadığı
      description: |
        Havuz sihirbazının bilmesi gereken her şey, tek çağrıda: kutuda hangi havuzlar var,
        paylaşımların sunulduğu dizin nerede, ve oraya bir veri kümesi bağlı mı.

        Bu uç iki yapılandırma değişkeninin cevabını **soruyor**: `DEPSIS_ZFS_POOLS` ve
        `DEPSIS_SHARE_PARENT_DATASET`. İkisi de hâlâ yazılabiliyor ve yazıldıklarında
        kazanıyorlar — ama artık zorunlu değiller, çünkü ürün havuzu kendisi kurabildiği andan
        sonra "sihirbazı bitir, sonra bir dosyayı düzenle ve API'yi yeniden başlat" savunulabilir
        bir akış değil.

        `parentDataset` boşsa `POST /shares` 503 veriyor. **Tahmin yok**: yanlış bir veri kümesi
        adı, hiçbir şeyin sunmadığı dataset'ler üretir — satır var, `zfs list` gösteriyor, ve
        paylaşım dosya yöneticisinde boş.

        Yalnız yöneticiye.
      responses:
        '200':
          description: Durum
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageSetup' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /system/processes:
    get:
      operationId: listProcesses
      tags: [system]
      summary: Arka planda ne koşuyor — görev yöneticisi
      description: |
        Kutudaki kullanıcı süreçleri, bellek kullanımıyla. Sistem süreçleri `protected: true`
        ile gelir: arayüz onlara kapatma düğmesi çizmez, ve çizseydi de ajan aynı kuraldan
        reddederdi — sınırın iki yüzü tek kaynaktan konuşur. Yalnız kurucu yönetici.
      responses:
        '200':
          description: Süreçler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessPage' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /system/processes/kill:
    post:
      operationId: killProcess
      tags: [system]
      summary: Sistemden olmayan bir süreci kapat
      description: |
        SIGTERM — süreç kendini toplar; ısrar eden kullanıcı yeniden basar. `comm` süs değil:
        pid yeniden kullanılabilir, ve ajan sinyalden hemen önce `/proc/<pid>/comm`'u okuyup
        bu adla karşılaştırır — bayat bir listeden gelen kapatma yanlış şeyi vuramaz. Sistem
        süreçleri hiçbir istekle kapanmaz.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KillProcessRequest' }
      responses:
        '200':
          description: Sinyal gönderildi
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /system/disks/wipe:
    post:
      operationId: wipeDisk
      tags: [system]
      summary: Bir diski sıfırla — havuz sihirbazının kabul edeceği hâle getir
      description: |
        YIKICI: diskteki her şey geri dönüşsüz silinir. Tören havuz kurmanınkiyle aynı (§8.1):
        ne silineceği ekranda, yazılı onay (`SİL`), parolayla yeniden kimlik doğrulama.

        Asıl reddeden taraf ajan, ve iki reddi hiçbir onay geçemez: sistem diski ve üzerinde
        BAĞLI bir şey olan disk. WWN silme anında yeniden doğrulanır — onay ekranı açıkken
        yuvası değiştirilen disk silinmez, reddedilir. İçerik ret sebebi değildir (silmenin var
        olma nedeni içerik), çıkarılabilirlik de değildir: USB bellek SİLİNEBİLİR; havuza
        KATILAMAZ.

        Yalnız kurucu yönetici.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiskWipeRequest' }
      responses:
        '200':
          description: Disk boş; wipefs'in kendi dökümü
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiskWipeResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /system/update:
    get:
      operationId: updateStatus
      tags: [system]
      summary: Kutu hangi sürümde, ve bir güncelleme sürüyor mu
      description: |
        Üç kaynağın birleşimi: kurulumun yazdığı sürüm, güncelleyicinin durum dosyası, ve
        systemd'nin güncelleme birimleri hakkında söyledikleri. Sonuncusu olmadan olmaz —
        güncelleyici durumu yazmaya fırsat bulamadan öldüyse (güç kesintisi) dosya sonsuza kadar
        "installing" der, ve birimin gerçekten koşup koşmadığını yalnız systemd bilir.

        Yalnız kurucu yönetici.
      responses:
        '200':
          description: Güncellemenin bütün durumu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateStatus' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /system/update/check:
    post:
      operationId: checkUpdate
      tags: [system]
      summary: Yeni bir sürüm var mı diye bak — indirmez, kurmaz
      description: |
        Denetimi BAŞLATIR ve hemen döner: ağ beklemek, ajanın sıralı kontrol soketini kilitlemek
        demek olurdu. Sonuç birkaç saniye içinde `GET /system/update` ile görülür.

        Cihaz kendiliğinden sürüm denetimi yapmaz — ne zamanlayıcısı vardır ne de açılışta
        çalışır. Bir NAS'ın sahibinin haberi olmadan dışarıya bağlanmaması, denetimin bir düğmeye
        bağlı olmasının sebebidir.

        Yalnız kurucu yönetici.
      responses:
        '200':
          description: Denetim başladı; durum yanıtta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateStatus' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /system/update/apply:
    post:
      operationId: applyUpdate
      tags: [system]
      summary: Denetimin bulduğu sürümü kur
      description: |
        **Kutunun üzerindeki bütün DEPSIS yazılımını değiştirir** ve kurulum sırasında arayüz
        birkaç kez kesilir. Kaynaktan derlendiği için yavaş kutularda saatler sürebilir.

        HANGİ SÜRÜMÜN KURULACAĞINI BU İSTEK SEÇMEZ: kurulacak şey, son denetimin bulduğu
        sürümdür. Ekranda bir sürüm görüp onaylayan yönetici tam onu kurmuş olur, ve o an ile
        düğme arasında depoya giren bir commit onaylanmamış kod olarak kalır.

        Kurulum düşerse cihaz eski sürüme geri alınır ve çalışır durumda bırakılır.

        Parolayla yeniden kimlik doğrulama gerekir: bu işlem kök yetkiyle koşacak kodu değiştirir.
        Yalnız kurucu yönetici.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateApplyRequest' }
      responses:
        '200':
          description: Güncelleme başladı; durum yanıtta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateStatus' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /system/license:
    get:
      operationId: licenseStatus
      tags: [system]
      summary: Cihazın lisansı
      description: |
        Kime, hangi plan, kaç yuva ve ne zamana kadar. Oturum açmış herkes okuyabilir: bir
        cihazın ne zaman desteksiz kalacağı, onu kullanan herkesin görebilmesi gereken bir olgu.

        Lisans anahtarı İMZALI bir veridir ve cihaz onu **internete çıkmadan** doğrular. Her
        okumada imza yeniden doğrulanır: veritabanına yazabilen biri kendine lisans uyduramasın.
      responses:
        '200':
          description: Lisansın durumu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenseStatus' }

    post:
      operationId: installLicense
      tags: [system]
      summary: Lisans anahtarını kur
      description: |
        Satıcıdan alınan anahtar yapıştırılır. İmza tutmuyorsa istek reddedilir ve hiçbir şey
        saklanmaz.

        Parola sorulmaz: lisans kurmak yıkıcı değil, geri alınabilir, ve yanlış bir anahtar
        zaten imza doğrulamasında düşer. Yalnız kurucu yönetici.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LicenseInstallRequest' }
      responses:
        '200':
          description: Lisans kuruldu; yanıt yeni durum
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenseStatus' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /system/tls:
    get:
      operationId: tlsStatus
      tags: [system]
      summary: Cihazın sunduğu sertifika ne
      description: |
        Kurulum kendinden imzalı bir sertifika üretiyor ve tarayıcı haklı olarak uyarıyor: bir
        NAS’a ilk kez bağlanan tarayıcının o sertifikayı doğrulamasının yolu yok. O uyarı
        ekranında karşılaştırılacak tek şey PARMAK İZİ, ve bugüne kadar onu görmenin tek yolu
        kurulum çıktısına bakmaktı — yani cihazı kuran kişinin o anki terminali.

        Yalnız kurucu yönetici.
      responses:
        '200':
          description: Sertifikanın anlatısı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TlsStatus' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /system/tls/certificate:
    post:
      operationId: installCertificate
      tags: [system]
      summary: Kendi sertifikanı kur
      description: |
        Kendi alan adı için aldığı sertifikayı kutuya koymanın yolu bir kabuk olmamalı: iki
        dosyayı `scp` ile kopyalayıp nginx’i yeniden yüklemek, ürünün kabul ölçütünün dışında.

        DOĞRULAMA ÜÇ ŞEY: sertifika ayrıştırılabilmeli, özel anahtar O sertifikaya ait olmalı,
        ve süresi dolmamış olmalı. Zincir doğrulaması YOK ve olmamalı — hangi CA’nın güvenilir
        olduğu tarayıcının kararı, ve kendi CA’sını kuran bir ev ağı da meşru.

        nginx önce sınanır sonra yeniden yüklenir, ve herhangi bir adım düşerse eski sertifika
        geri konur: bir sertifika kurulumunun asla üretmemesi gereken sonuç, HTTPS sunamayan
        bir kutudur.

        Parolayla yeniden kimlik doğrulama gerekir. Yalnız kurucu yönetici.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TlsCertificateRequest' }
      responses:
        '200':
          description: Sertifika kuruldu; yanıt yeni sertifikanın anlatısı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TlsStatus' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /storage/share-tree:
    post:
      operationId: prepareShareTree
      tags: [system]
      summary: Var olan bir havuzun üstünde paylaşım ağacını kur
      description: |
        Havuzu olan ama paylaşım ağacı olmayan bir kutu, tamamen sağlıklı görünür ve TEK BİR
        dosya sunamaz: DEPSIS yeni paylaşımları hangi veri kümesinin altında açacağını bilmez.
        Havuz sihirbazı bu işi zaten yapıyor, ama yalnız havuzu kendisi kurduğunda.

        Bu uç, o boşluğu terminale gitmeden kapatır. YIKICI DEĞİLDİR: ajan, kökte bağlı bir veri
        kümesi ya da boş olmayan bir dizin varsa reddeder, yani var olan bir şeyin üstüne yazma
        yolu burada yoktur. Bu yüzden parola sorulmaz; kurucu yönetici kapısı durur.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareTreeRequest' }
      responses:
        '200':
          description: Paylaşım ağacı kuruldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareTreeResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /storage/pools:
    post:
      tags: [system]
      summary: ZFS havuzu oluştur
      description: |
        **Bu uç disk siler.** §8.1'in sırası: analiz → plan → etkilenen disklerin seri/WWN
        listesi → yazılı onay → yeniden kimlik doğrulama → iş. Analiz `GET /system/disks`;
        gerisi burada.

        Üç reddediş AJANIN İÇİNDE, bir diyaloğun içinde değil — çünkü diyalog geçilen bir şeydir:

        1. `/`, `/boot` ya da `/boot/efi` taşıyan bir disk hiçbir onayla üye olamaz.
        2. Her disk için verilen `wwn`, havuz oluşturulduğu ANDA kutunun bildirdiğiyle eşleşmek
           zorunda. Sihirbazın diskleri listelediği ekranla düğmeye basıldığı an arasında bir disk
           çıkarılıp yerine başkası takılabilir, ve `/dev/disk/by-id` bir YUVAYI değil bir AYGITI
           adlandırır — yani ad tek başına hiçbir şeyi doğrulamaz.
        3. `-f` hiç geçilmiyor. `zpool create`, üstünde dosya sistemi olan bir aygıtı
           zorlanmadıkça reddeder; bu ürün o reddi geçersiz kılmıyor. **Üstünde bir şey olan bir
           diski temizlemek, operatörün kabuktan kendi yaptığı bir iştir.**

        `confirm` alanının işi niyeti kanıtlamak değil — onu parola yapıyor. İşi, tek tıkla
        geçilmesini engellemek.

        İş kuyruğa giriyor ve 202 dönüyor. Yeniden teslim güvenli: `zpool create` var olan bir
        havuz adı için başarısız olur, ve işleyici zaten önce havuzun var olup olmadığına bakıyor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePoolRequest' }
      responses:
        '202':
          description: İş kuyruğa alındı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          # Parola yanlış. Oturum geçerli olsa bile: §0.5, bu kadar riskli bir işlemi bir çerezin
          # gücüyle yapmıyor.
          $ref: '#/components/responses/Problem'
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /jobs:
    get:
      tags: [system]
      summary: İşleri listele — özellikle ölenleri
      description: |
        Yalnız yöneticiler. `GET /jobs/{jobId}` yalnızca kimliği ELİNDE OLANA cevap veriyor, ve bir
        işin ölmesi genellikle o kimliği taşıyan sayfa kapandıktan çok sonra oluyor. Böyle bir işi
        görebileceğin hiçbir yer yoktu.

        `dead`, `max_attempts` tükendiğinde veriliyor ve sessizce kaybolmuyor: satır
        `job_history`'ye taşınıyor. Ama taşınmak, birinin bakması demek değil — ADR-0003'ün
        "sistem alarmı üretir" cümlesinin karşılığı bu uç noktaydı ve yoktu.

        Neden önemli: ölen bir `permissions.apply` işi, veritabanında uygulanmış ama dosya
        sisteminde uygulanmamış bir izin demek. Yani web'de kapalı görünen bir klasör SMB'den
        açılmaya devam ediyor — §6.2'nin ve ADR-0004'ün adıyla yasakladığı iki gerçeklik. Deneme
        bütçesi bunu nadir kılıyor; nadir olan şey görünmez olmamalı.
      parameters:
        - name: status
          in: query
          required: false
          description: Verilmezse hepsi. Birden fazla için virgülle ayır.
          schema: { type: string, example: dead }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: İşler, en yenisi başta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPage' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [system]
      summary: Uzun süren bir işin durumu
      responses:
        '200':
          description: İş durumu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/Problem' }

  /events:
    get:
      tags: [events]
      summary: Olay akışı (Server-Sent Events)
      description: |
        §14'ün istediği gerçek zamanlı akış. TEK uç nokta: bir tarayıcı köken başına az sayıda
        bağlantı tutar ve ekran başına bir akış, dosya yöneticisi + işler + aktarımlar açıkken
        üçünü boş sokete harcardı. Olaylar tipli geliyor, istemci `event.type` üzerinden
        dağıtıyor — SSE'nin olay adının var olma sebebi bu.

        WebSocket değil. ADR-0018 bu kararı konsol için zaten yazdı ve buradaki gerekçe daha
        güçlü: bu akış doğası gereği tek yönlü, Nest'te `@Sse` çerçevede var, ve `EventSource`
        kendi kendine yeniden bağlanıp `Last-Event-ID` gönderiyor — §14'ün istediği tam olarak bu.

        ── Olay tipleri ────────────────────────────────────────────────────────

        `job` — kuyruktaki bir işin durumu değişti. Gövde: `JobEvent`. YALNIZ YÖNETİCİYE,
        çünkü `GET /jobs` de yalnız yöneticiye. Bir iş bittiğinde satır `job_queue`'dan
        `job_history`'ye geçiyor; akış ikisini de okuyor, yoksa her iş ilerler ve hiçbiri
        bitmezdi.

        `transfer` — bir yüklemenin konumu ilerledi ya da tamamlandı. Gövde: `TransferEvent`.
        YALNIZ YÜKLEMEYİ AÇAN KİŞİYE, çünkü `GET /transfers` de öyle. Kiracı geneli bir aktarım
        akışı, her üyeye diğer her üyenin ne yüklediğini dosya adıyla söylerdi.

        `ping` — 20 saniyede bir. Boştaki bir SSE bağlantısı yoldaki hiçbir şey için ölü bir
        bağlantıdan ayırt edilemez; ters vekil kapatır ve tarayıcı okumaya çalışana kadar fark
        etmez.

        ── Yeniden bağlanma ────────────────────────────────────────────────────

        Her olayın `id`'si, satırın `updated_at` değerinin epoch milisaniyesi. Tarayıcı yeniden
        bağlanırken bunu `Last-Event-ID` başlığıyla gönderiyor ve sunucu oradan devam ediyor.

        Teslimat EN AZ BİR KEZ: PostgreSQL mikrosaniye tutuyor, id milisaniye, ve devam noktası
        bir milisaniye geri sarılıyor. Kopya zararsız — her olay satırın tamamını taşıyor ve
        istemci id'ye göre değiştiriyor — ama bir eksik, ekranda sonsuza kadar "çalışıyor"
        kalan bir iş demek.

        Akış bir ANLIK GÖRÜNTÜ DEĞİL. Yeni açılan bir akış, o andan SONRA olanları taşıyor;
        istemci mevcut durumu sıradan REST ucundan alıyor. Dünkü bitmiş işleri yeni açılan bir
        ekrana tekrar oynatmak durum değil gürültü olurdu.
      responses:
        '200':
          description: Olay akışı
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '429':
          description: |
            Bu süreçte aynı anda tutulabilecek akış sayısına ulaşıldı. `Retry-After` taşır.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /notes:
    get:
      tags: [desk]
      summary: Kendi notlarını listele
      description: |
        Notlar yazarına özeldir. Bu, paylaşımlı bir not tahtasının daha kullanışlı olmadığı için
        değil — kimin kimin notunu okuyabileceği bir ACL sorusudur ve §6.2 Faz 2'dedir. İki
        seçenek arasından kimseyi şaşırtamayacak olan seçildi.

        Sayfalama yok: bir kişinin not sayısı, bir klasörün dosya sayısı gibi büyümüyor.
      responses:
        '200':
          description: Notlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotePage' }
    post:
      tags: [desk]
      summary: Not oluştur
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNoteRequest' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '422': { $ref: '#/components/responses/Problem' }

  /notes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [desk]
      summary: Notu düzenle
      description: |
        Yalnız yazarı. Başkasının notu 404 döner, 403 değil: 403 o notun var olduğunu söyler ve
        bir kiracının içinde bile "hangi notlar var" bir sızıntıdır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNoteRequest' }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [desk]
      summary: Notu sil
      description: Kalıcı. Bir notun çöp kutusu yok; metni saklamaya değecek bir bayt değil.
      responses:
        '204': { description: Silindi }
        '404': { $ref: '#/components/responses/Problem' }

  /tasks:
    get:
      tags: [desk]
      summary: İş panosu
      description: |
        Notların aksine PAYLAŞIMLI, ve bu tutarsızlık değil: bir iş birine atanır, ve göremediği
        bir iş atanmış sayılmaz. Pano organizasyondaki herkese açıktır.

        Tamamlananlar da döner — `doneAt` ile ayırt edilir. Filtreleme istemcinin işi, çünkü
        "bugün neyi bitirdik" panonun cevaplaması gereken sorulardan biri.
      responses:
        '200':
          description: İşler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
    post:
      tags: [desk]
      summary: İş ekle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [desk]
      summary: İşi güncelle — metin, atanan, tamamlanma, sıra
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTaskRequest' }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [desk]
      summary: İşi sil
      responses:
        '204': { description: Silindi }
        '404': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/files:
    get:
      tags: [tasks]
      summary: Göreve bağlı dosyalar
      description: |
        **Görev erişimi dosya erişimi vermiyor** (§7). Bu uç her bağ için dosyanın KENDİ izinlerini
        çözüyor ve çağıranın göremeyeceği satırları hiç döndürmüyor — göremediği bir dosyanın adı,
        yolu ya da paylaşımı bu yanıtta geçmiyor.

        Görülemeyenlerin SAYISI `hidden` alanında. Sıfır göstermek "burada başka bir şey yok"
        demek olurdu ve bu yanlış; sayıyı tamamen gizlemek bir görevi eksik gösterirdi. Sayı,
        "buraya bakman gereken bir şey var, ama sana değil" cümlesinin en az bilgi sızdıran hâli.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Bağlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskFileLinkPage' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [tasks]
      summary: Göreve dosya bağla
      description: |
        Bağlayanın o dosyada **en az `read`** izni olmak zorunda. Göremediği bir dosyayı bağlamak,
        onu görebilen birine "bu dosya var" demenin dolaylı yolu olurdu — ve daha kötüsü, bağın
        kendisi bir izin gibi okunabilirdi.

        Göremediği bir dosya için cevap **404**, 403 değil: 403 dosyanın var olduğunu söyler.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkTaskFileRequest' }
      responses:
        '201':
          description: Bağlandı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskFileLink' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/files/{linkId}:
    delete:
      tags: [tasks]
      summary: Bağı kaldır
      description: |
        Dosyaya dokunmuyor — yalnız bağı siliyor. Bağı kaldırmak için dosyayı GÖREBİLMEK gerekmiyor:
        göremediğin bir dosyanın bağı listende duruyorsa, onu kaldırabilmen gerekir, yoksa
        temizleyemeyeceğin bir satır kalır.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Kaldırıldı }
        '404': { $ref: '#/components/responses/Problem' }

  /tasks/log:
    get:
      tags: [tasks]
      summary: İş günlüğü — bütün panonun izi, zamana dizili
      description: |
        "Geçmişte kimler neler yapmış." Görev başına iz `/tasks/{id}/activity`'de zaten var; bu,
        aynı tablonun kiracı genişliğinde okunuşu, işin metniyle birlikte. Pano kime açıksa günlük
        de ona açık. Son 300 satır.
      responses:
        '200':
          description: Günlük
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskLogPage' }

  /tasks/{id}/activity:
    get:
      tags: [tasks]
      summary: Görev denetim izi
      description: |
        §7: kim, neyi, ne zaman, hangi eski/yeni değerle değiştirdi. Silinen bir kullanıcının
        satırları KALIYOR, aktör anonimleşiyor — bir denetim kaydını hesapla birlikte silmek,
        onun en çok bakılacağı anı yok eder.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Aktivite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskActivityPage' }
        '404': { $ref: '#/components/responses/Problem' }

  /notifications:
    get:
      tags: [desk]
      summary: Bildirim merkezi
      description: |
        §7: "Hatırlatma, gecikme, mention ve görev değişiklikleri bildirim merkezine düşer."

        `task.comment` ve `task.mention` bir İŞARETÇİ, içeriğin kopyası değil: başlık yorumun
        metnini değil İŞİN metnini taşıyor. Sebep, aynı iş için okunmamış ikinci bir bildirimin
        yazılmaması — ilk başlık beş yorum sonra da ekranda duruyor, ve o başlık bir yorumun metni
        olsaydı yanıltıcı olurdu. Okuyan işe gidiyor ve hepsini orada görüyor.

        Bildirimler ALICI BAŞINA satır. Aynı olay iki kişiye iki farklı şey söylüyor — bir işin
        atanması, atanan için "sana iş geldi", eski atanan için "iş senden alındı" — ve tek satır
        ikisinden birini yanlış cümleyle karşılamak zorunda kalırdı.

        Kimse KENDİ yaptığı şey için bildirim almıyor.
      parameters:
        - name: unread
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Yalnız okunmamışlar.
      responses:
        '200':
          description: Gelen kutusu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }

  /notifications/read:
    post:
      tags: [desk]
      summary: Okundu işaretle
      description: |
        Gövdedeki id'ler, ya da gövde yoksa HEPSİ. Zaten okunmuş olanlar atlanıyor — yeniden
        işaretlemek "ne zaman okudum" cevabını bugüne kaydırırdı.

        Başkasının bildirimi sessizce atlanıyor: RLS kiracıyı tutuyor, kişiyi sorgu tutuyor, ve
        "bu senin değil" demek başkasının gelen kutusu hakkında bilgi vermek olurdu.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkNotificationsReadRequest' }
      responses:
        '200':
          description: Kaç tanesi işaretlendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationsRead' }

  /tags:
    get:
      tags: [tasks]
      summary: Kiracının etiket sözlüğü
      description: |
        Kullanım sayılarıyla, ada göre. Sayı, hangi etiketlerin gerçekten kullanıldığını ve
        hangilerinin bir kez yazılıp unutulduğunu söylüyor — bir sözlüğün bakımı için gereken tek
        bilgi.
      responses:
        '200':
          description: Etiketler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagPage' }
    post:
      tags: [tasks]
      summary: Etiket oluştur
      description: |
        HERKESE AÇIK. Oluşturmayı yöneticiye kilitlemek, etiketlemeyi bir talep sürecine çevirir ve
        kimse kullanmaz.

        AYNI AD VARSA VAR OLANI DÖNDÜRÜYOR, hata vermiyor: buradaki niyet "bu adda bir etiket
        olsun", ve zaten varsa istenen şey olmuş demektir. Bu, arayüzde hem seçmeye hem oluşturmaya
        izin veren tek bir kutu olmasını sağlıyor.

        Benzersizlik KATLANMIŞ ad üzerinden — kullanıcı adlarındaki `fold_identity`, yani
        büyük/küçük harf ve Türkçe i ailesi katlanıyor, aksanlar katlanmıyor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTagRequest' }
      responses:
        '201':
          description: Oluşturuldu ya da zaten vardı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '422': { $ref: '#/components/responses/Problem' }

  /tags/{tagId}:
    patch:
      tags: [tasks]
      summary: Etiketi yeniden adlandır ya da rengini değiştir
      description: |
        YALNIZ YÖNETİCİ. Bir adı değiştirmek, onu kullanan HER İŞİN anlamını değiştiriyor — bir
        üyenin yanlışlıkla yaptığı bir şeyin otuz işi etkilemesi, geri alınması en zor hata sınıfı.

        `POST /tags`'in tersine sessizce birleştirmiyor: ad başka bir etikete aitse 409. "Bunu şu ad
        yap" diyen biri, iki etiketin tek etikete dönüşeceğini bilmeli.
      parameters:
        - { name: tagId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTagRequest' }
      responses:
        '200':
          description: Değişti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tasks]
      summary: Etiketi sil
      description: |
        YALNIZ YÖNETİCİ, ve KİRACI ÇAPINDA: etiket her işten kalkıyor. Cevap kaç işten kalktığını
        söylüyor, ve arayüz onu silmeden ÖNCE soruyor — sessiz bir kaskat veri kaybının en sık
        biçimi, ve burada kaybedilen şey otuz işin sınıflandırması.
      parameters:
        - { name: tagId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Silindi
          content:
            application/json:
              schema:
                type: object
                required: [removedFrom]
                properties:
                  removedFrom:
                    type: integer
                    description: Etiketin kalktığı iş sayısı.
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/tags/{tagId}:
    put:
      tags: [tasks]
      summary: İşe etiket tak
      description: Zaten takılıysa hiçbir şey olmuyor; cevap yine 204.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tagId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Takıldı
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tasks]
      summary: Etiketi işten kaldır
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tagId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Kaldırıldı
        '404': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/checklist:
    get:
      tags: [tasks]
      summary: Görevin kontrol listesi
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Maddeler, kullanıcının dizdiği sırayla
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChecklistPage' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [tasks]
      summary: Kontrol listesine madde ekle
      description: |
        Madde listenin SONUNA ekleniyor ve sırasını sunucu hesaplıyor. İstemciden bir `position`
        almak, aynı anda madde ekleyen iki kişiyi aynı sırayı isteyen iki kişiye çevirirdi.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChecklistItemRequest' }
      responses:
        '201':
          description: Eklendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChecklistPage' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/checklist/{itemId}:
    patch:
      tags: [tasks]
      summary: Maddeyi tikle ya da tiki kaldır
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        '204':
          description: İşaretlendi
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tasks]
      summary: Maddeyi sil
      description: |
        GERÇEKTEN siliniyor, yorumların tersine. Fark bilinçli: bir yorum bir kişinin söylediği şey
        ve kaydı korunmalı; bir kontrol listesi maddesi bir hatırlatma, ve yanlış yazılmış bir
        hatırlatmanın "bu madde silindi" diye listede durması yalnız gürültü. Ne olduğu denetim
        izinde kalıyor.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Silindi
        '404': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/comments:
    get:
      tags: [tasks]
      summary: Görevin yorumları
      description: |
        ESKİ ÖNCE: bir tartışma yukarıdan aşağı okunuyor. (Bildirim listesi en yeni önce, çünkü
        orada okunacak olan son olay.)

        Silinmiş bir yorumun SATIRI dönüyor, GÖVDESİ dönmüyor — `deleted: true` ve boş bir `body`.
        Bir konuşmadan sessizce kaybolan bir replika okuyanı kendi hafızasından şüphe ettirir;
        "bu yorum silindi" ise okunabilir bir kayıt.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Yorumlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskCommentPage' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [tasks]
      summary: Yorum ekle
      description: |
        MENTION SUNUCUDA ÇÖZÜLÜYOR. İstek bir alıcı listesi TAŞIMIYOR ve taşıyamaz: öyle bir alan,
        gövdede adı hiç geçmeyen birine bildirim göndermenin yolu olurdu. Sunucu yalnız gövdede
        gerçekten yazan `@ad`'leri, yalnız kendi kiracısında çözüyor.

        Bulunamayan ad sessizce düşüyor — "böyle bir kullanıcı yok" demek, yorum kutusunu bir
        kullanıcı adı yoklama aracına çevirirdi.

        Yorum yazmak İZLEYİCİ YAPIYOR: konuşmaya girmek, devamını duymak istemek demek. Anılmak
        izleyici YAPMIYOR — bir kez anılmanın kişiyi işin bütün gelecek gürültüsüne kaydetmesi,
        insanların bildirimleri okumayı bırakma sebebi.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCommentRequest' }
      responses:
        '201':
          description: Eklendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskComment' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/comments/{commentId}:
    patch:
      tags: [tasks]
      summary: Kendi yorumunu düzenle
      description: |
        YALNIZ YAZAN, yönetici bile değil. Bir yöneticinin başkasının ağzından cümle
        değiştirebilmesi, yorum listesini alıntılanamaz yapardı — ve bir tartışma kaydının tek işi
        alıntılanabilir olmak. Yöneticinin yapabileceği şey silmek, ve silinen bir yorum silindiğini
        söylüyor.

        Düzenleme yeni bildirim üretmiyor, mention eklense bile: bir düzenlemeyle birine bildirim
        göndermek, yazılmış bir cümleyi sonradan bir çağrıya çevirmek olurdu.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCommentRequest' }
      responses:
        '200':
          description: Düzenlendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskComment' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tasks]
      summary: Yorumu sil
      description: |
        Yazan ya da yönetici. YUMUŞAK silme: satır ve gövdesi tabloda kalıyor, API gövdeyi bir daha
        döndürmüyor, ve `task_activity`'ye bir denetim satırı düşüyor. Bir yorumun silinmiş olması,
        en çok bakılacak an geldiğinde ne yazdığını da bilmeyi gerektirir.

        403, 404 DEĞİL: yorumun var olduğu zaten listede görünüyor, o yüzden gizlenecek bir şey yok
        ve "böyle bir yorum yok" demek okuyanı kendi ekranıyla çelişkiye düşürürdü.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Silindi
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/watchers:
    get:
      tags: [tasks]
      summary: Görevi kim izliyor
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: İzleyiciler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskWatcherPage' }
        '404': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/watch:
    put:
      tags: [tasks]
      summary: Bu işi izlemeye başla
      description: |
        YALNIZ ÇAĞIRAN İÇİN. Gövde yok ve bir `userId` parametresi de yok, bilerek: başkası adına
        abone olabilmek, bir kişiye istemediği bildirimleri göndermenin yolu olurdu, ve o kişinin
        geri almaktan başka yapabileceği bir şey olmazdı.

        Zaten izliyorsa hiçbir şey olmuyor; cevap yine 204.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: İzleniyor
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tasks]
      summary: İzlemeyi bırak
      description: |
        Nasıl abone olduğuna bakmıyor: atandığı için otomatik eklenmiş biri de çıkabiliyor. "Bu işi
        bırakamazsın, çünkü sana atandı" demek bildirimi bir cezaya çevirirdi — ve o kişi işi
        bıraktığında değil, bildirimleri okumayı bıraktığında kaybediliyor.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: İzlenmiyor
        '404': { $ref: '#/components/responses/Problem' }

  /storage/replication:
    post:
      tags: [system]
      summary: Bir anlık görüntüyü ikinci bir veri kümesine çoğalt
      description: |
        Bu API'nin veri yok eden **ikinci** yolu. `zfs recv -F` hedefteki her şeyi ve ortak
        tabandan yeni her anlık görüntüyü YOK EDİYOR — havuz oluşturmayla aynı sınıfta, ve önünde
        §8.1'in aynı dizisi duruyor: analiz, plan, yazılı onay, yeniden kimlik doğrulama, iş.

        **`confirm` HEDEFİN adı**, kaynağın değil: yok edilen şey hedef, ve bir onay kutusuna
        yazılacak şey kaybedilecek olanın adı olmalı.

        **Bu makinedeki ikinci bir veri kümesine.** Başka bir MAKİNEYE değil: o bir taşıma katmanı
        (SSH), bir kimlik deposu ve host anahtarı doğrulaması istiyor — kendi güven yüzeyi, ve tek
        havuzlu bir kutuda hiçbiri denenemez. Bu, iki havuzlu bir NAS'ın gerçekten sahip olduğu
        hedef: ikinci bir disk kümesi, yani birincisini kaybetmek veriyi kaybetmek olmasın.

        Ajan dört şeyi reddediyor ve bu rota onları TEKRARLAMIYOR: aynı veri kümesi, iç içe olanlar,
        paylaşım kökü, ve paylaşım ağacının içi. Ajanın kontrolü kendi okuduğu listeye karşı;
        buradaki bir kopya yalnızca istemcinin kendi ekranını doğru kopyaladığını kanıtlardı.

        `base` verilmezse TAM gönderim. Hedefin neyi tuttuğunu bilen taraf istemci, ve bir terabaytı
        taşımak sunucunun kendi inisiyatifiyle başlatacağı bir şey değil.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplicateRequest' }
      responses:
        '202':
          description: İş kuyruğa alındı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /shares/{shareId}/snapshots:
    get:
      operationId: listShareSnapshots
      tags: [files]
      summary: Bu paylaşımın geçmiş sürümleri
      description: |
        Paylaşımın veri kümesindeki anlık görüntüler, yenisi önce. HAVUZDAN okunuyor, DEPSIS'in
        kendi kaydından değil: kabuktan silinmiş bir görüntü kayıtta durur, ve ekranın var olmayan
        bir geri dönüş noktası önermesi, okuyanın bunu tam ihtiyaç duyduğu an öğrenmesi demektir.

        `available: false` ajana ulaşılamadığında. Boş liste DEĞİL: boş liste "hiç görüntü yok"
        demek olurdu, ve bir dakikalığına düşmüş bir ajan bütün yedekleri silinmiş gibi gösterirdi.

        YETKİ: paylaşımın KÖKÜNDE `download`. Bir anlık görüntüde gezinmek, o paylaşımın geçmişteki
        bütün adlarını görmek demek, ve klasör bazlı bir izin bu ağaca eşlenemiyor — geri
        yüklenecek klasör çoğu zaman artık yok. Dar taraf seçildi: yalnız alt klasörüne yetkisi
        olan biri geçmiş sürümlere hiç bakamıyor.
      parameters:
        - name: shareId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Anlık görüntüler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareSnapshotPage' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /shares/{shareId}/snapshots/{snapshot}/entries:
    get:
      operationId: listSnapshotEntries
      tags: [files]
      summary: Bir anlık görüntünün içinde bir klasör
      description: |
        Anlık görüntünün içindeki TEK bir klasörün içeriği. Ağaç değil — çağıranın maliyetini
        seçtiği bir çağrı olmaması için (ADR-0006 §2.2), arayüz ağacı kendisi geziyor.

        Salt okunur, ve başka türlüsü mümkün değil: bir ZFS anlık görüntüsü değiştirilemez.
      parameters:
        - name: shareId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: snapshot
          in: path
          required: true
          description: Görüntünün kendi adı — `@`'den sonraki kısım.
          schema: { type: string }
        - name: path
          in: query
          required: false
          description: |
            Görüntünün kökünden itibaren, `/` ile ayrılmış. Boş bırakılırsa paylaşımın kökünün o
            günkü hâli.
          schema: { type: string }
      responses:
        '200':
          description: Klasörün içeriği
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotListing' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /shares/{shareId}/snapshots/{snapshot}/restore:
    post:
      operationId: restoreFromSnapshot
      tags: [files]
      summary: Bir dosyayı anlık görüntüden geri getir
      description: |
        Anlık görüntüdeki BİR dosyayı canlı paylaşıma kopyalar. Veri kümesini geri almaz — bunu
        yapmak, o görüntüden beri yazılmış her şeyi de atmak olurdu.

        ÜZERİNE YAZMAZ. Hedefteki ad doluysa sunucu boş bir ad seçiyor ve SEÇTİĞİ ADI cevapta
        döndürüyor, böylece kullanıcı dosyanın nereye ineceğini onaylamadan önce görüyor. Ajan
        tarafında da `RENAME_NOREPLACE` var: iki kapı, çünkü geri yüklemenin tamamı "hangi kopyayı
        istediğimden emin değilim" demek.

        Bir İŞ döndürüyor. Ajanın denetim soketi aynı anda tek bağlantıya hizmet ediyor, yani
        baytlar dilimler hâlinde taşınıyor ve büyük bir dosya hiçbir HTTP isteğinin beklememesi
        gereken kadar sürüyor.

        YETKİ: paylaşımın kökünde `download`, hedef klasörde `create`.
      parameters:
        - name: shareId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: snapshot
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreRequest' }
      responses:
        '202':
          description: Geri yükleme kuyruğa alındı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestoreAccepted' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /storage/pools/{pool}/scrub:
    get:
      operationId: getScrubStatus
      tags: [system]
      summary: Bu havuzun tarama durumu
      description: |
        ZFS her bloğun sağlama toplamını tutuyor ve bozulmuş bir bloğu OKUNDUĞUNDA fark ediyor.
        Sessiz bit çürümesinin problemi tam da bu: bir yedek arşivi yıllarca okunmuyor, yani
        bozulma yıllarca fark edilmiyor, ve fark edildiği gün — dosyanın gerçekten gerektiği gün —
        kopyası da bozulmuş olabiliyor.

        Debian'ın `zfsutils-linux` paketi zaten aylık bir tarama koyuyor, yani sıradan bir cihazda
        taramalar KOŞUYOR. Eksik olan şey zamanlama değil GÖRÜNÜRLÜK: bir taramanın koşup
        koşmadığını, ne bulduğunu ve devam edip etmediğini DEPSIS'in hiçbir ekranı söylemiyordu.
        Bulduğu hataları kimsenin görmediği bir tarama, hiç koşmamış bir taramadan yalnızca daha
        pahalı.

        Satırlar `zpool status`'ün kendi sözleri, AYRIŞTIRILMIYOR: `scan:` satırındaki tarih yerel
        biçimde, ve onu bir zaman damgasına çevirmeye çalışmak, yanlış çevirdiğinde "en son ne
        zaman tarandı" sorusuna kendinden emin ve yanlış bir cevap vermek olurdu.
      parameters:
        - name: pool
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Tarama durumu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScrubStatus' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      operationId: startScrub
      tags: [system]
      summary: Şimdi tara
      description: |
        Her bloğu okuyup sağlamasını doğruluyor; ayna ya da RAIDZ varsa bozuk olanı sağlam kopyadan
        onarıyor.

        YIKICI DEĞİL, o yüzden önünde §8.1'in dizisi yok: tarama okuyor ve onarabildiğini onarıyor.
        Maliyeti saatlerce disk bant genişliği — bu yüzden birinin bastığı bir düğme, DEPSIS'in
        kendi inisiyatifiyle başlattığı bir şey değil.

        Cevap, başlatıldıktan SONRA okunan durum: `zpool scrub` hemen dönüyor ve hiçbir şey
        söylemiyor, yani "başlatıldı" demek isteğin yankısı olurdu.
      parameters:
        - name: pool
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Tarama başlatıldı; okunmuş durum
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScrubStatus' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /storage/database-backups:
    get:
      operationId: listDatabaseBackups
      tags: [system]
      summary: Cihazın kendi veritabanının dökümleri
      description: |
        ZFS anlık görüntüleri kullanıcının DOSYALARINI koruyor. Korumadığı şey o dosyaların kime
        ait olduğu: hesaplar, paylaşım tanımları, klasör izinleri, iş panosu ve dosya dizini
        PostgreSQL'de, ve PostgreSQL sistem diskinde. Sistem diski ölürse havuzdaki her bayt
        duruyor ve onlara kimin erişebileceğini söyleyen hiçbir şey kalmıyor.

        Günde bir alınıyor, on dört tanesi saklanıyor. "En son ne zaman" sorusunun cevabı dizindeki
        en yeni dosyanın tarihi — bir kolonda tutulsaydı, kabuktan silinmiş bir dökümden sonra o
        kolon yalan söylerdi.

        DÖKÜM PAYLAŞIMA YAZILMIYOR: parola hash'lerini, mühürlenmiş TOTP sırlarını ve SMB NT
        hash'lerini taşıyor, ve bir paylaşım onları o paylaşımda `download` yetkisi olan herkese
        verirdi. Ajanın kendi dizininde, 0600 ile duruyor. `directory` alanı nerede olduğunu
        söylüyor — o dizinin veri kümesine bir zamanlama kurmak yöneticinin işi.
      responses:
        '200':
          description: Dökümler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatabaseBackupPage' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: dumpDatabase
      tags: [system]
      summary: Şimdi döküm al
      responses:
        '201':
          description: Alındı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatabaseBackupPage' }
        '403': { $ref: '#/components/responses/Problem' }
        '503':
          description: |
            Ajan döküm alamıyor — neredeyse her zaman bağlantı dizesinin yapılandırılmamış olması.
            Sebep cevapta.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /storage/backup-schedules:
    get:
      operationId: listBackupSchedules
      tags: [system]
      summary: Zamanlanmış yedekler
      description: |
        Elle başlatılan bir yedek, alınmayan bir yedektir. Bir NAS'ın verisini kaybetme yolu bozuk
        bir yedekleme değil, ALINMAMIŞ bir yedek — ve sebebi neredeyse her zaman birinin bir
        düğmeye basmayı unutması.

        Kurucu yönetici.
      responses:
        '200':
          description: Zamanlamalar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupSchedulePage' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createBackupSchedule
      tags: [system]
      summary: Zamanlama ekle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupScheduleRequest' }
      responses:
        '201':
          description: Eklendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupSchedule' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: |
            Bu veri kümesi için bu ritimde bir zamanlama zaten var. İkincisi, aynı anda çalışan ve
            birbirinin görüntüsünü budayan iki politika demek olurdu.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /storage/backup-schedules/{id}:
    put:
      operationId: updateBackupSchedule
      tags: [system]
      summary: Zamanlamayı değiştir
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupScheduleRequest' }
      responses:
        '200':
          description: Değiştirildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupSchedule' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteBackupSchedule
      tags: [system]
      summary: Zamanlamayı kaldır
      description: |
        ALDIĞI GÖRÜNTÜLERİ SİLMEZ. Bir zamanlamayı kaldırmak "artık yenisini alma" demek,
        "elimdekileri at" demek değil — ve iki anlamı birbirine karıştıran bir silme düğmesi, bir
        kullanıcının bütün yedek geçmişini bir tıkla götürürdü.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Kaldırıldı }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /storage/offsite:
    get:
      operationId: getOffsiteStatus
      tags: [system]
      summary: Başka bir makineye yedeklemenin durumu
      description: |
        Bu cihazın off-site kimliği ve güvendiği hedefler.

        ÖZEL ANAHTAR BURADA YOK ve hiçbir uçta yok. Anahtar ayrıcalıklı tarafta üretiliyor ve orada
        kalıyor; okunabilen tek şey AÇIK yarısı — kullanıcının karşı tarafın `authorized_keys`
        dosyasına yapıştıracağı şey. ADR-0016 cihazı, veritabanına erişimin tek başına
        yetmeyeceği şekilde bölüyor, ve bir HTTP ucundan okunabilen özel anahtar o bölmeyi başka
        bir makineye ulaşan tek kimlik bilgisi için ortadan kaldırırdı.

        Kurucu yönetici.
      responses:
        '200':
          description: Kimlik ve güvenilen hedefler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OffsiteStatus' }
        '403': { $ref: '#/components/responses/Problem' }

  /storage/offsite/identity:
    post:
      operationId: createOffsiteIdentity
      tags: [system]
      summary: Off-site anahtarını üret
      description: |
        Bir kez üretir. Zaten varsa 409 — üzerine yazmak asla doğru cevap değil: karşı tarafın
        `authorized_keys` dosyası ESKİ anahtarın açık yarısını tutuyor, yani sessiz bir yenileme
        her gelecekteki çoğaltmayı saatler sonra, karşı tarafta, sebebi burada hiç görünmeyen bir
        izin hatasına çevirirdi.
      responses:
        '201':
          description: Üretildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OffsiteStatus' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /storage/offsite/scan:
    post:
      operationId: scanOffsiteHost
      tags: [system]
      summary: Hedefin host anahtarını sor
      description: |
        Sorar ve HİÇBİR ŞEYE GÜVENMEZ. Dönen parmak izleri, kullanıcının karşı tarafta
        `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub` ile göreceği şeyle karşılaştırması için.

        Bunu `trust` ile tek bir uçta birleştirmek — "bağlan ve ne çıkarsa kabul et" — bir
        replikasyonda saldırganın bu cihazdaki her dosyanın kopyasını alması demek. Yanlış makineye
        giden bir yedek, hiç yedek olmamasından kötüdür.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OffsiteDestination' }
      responses:
        '200':
          description: Hedefin sunduğu anahtarlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OffsiteHostKeyPage' }
        '403': { $ref: '#/components/responses/Problem' }
        '503':
          description: |
            Hedefe ulaşılamadı — kapalı, güvenlik duvarının arkasında, ya da SSH çalışmıyor. Bu
            cihazın arızası değil.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /storage/offsite/trust:
    post:
      operationId: trustOffsiteHost
      tags: [system]
      summary: Görülen bir host anahtarını onayla
      description: |
        Kullanıcının GÖRDÜĞÜ ve parmak izini karşılaştırdığı satırı yazar. Satır bu makine ve bu
        port için değilse reddedilir: aksi hâlde bir hedef için kontrol edilen parmak izi, bambaşka
        bir hedefi yetkilendiren bir kayıt yazardı — parmak izi karşılaştırma ayininin engellemek
        için var olduğu tam olarak o değiştirme.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OffsiteTrustRequest' }
      responses:
        '200':
          description: Güncellenmiş durum
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OffsiteStatus' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /storage/offsite/replicate:
    post:
      operationId: replicateOffsite
      tags: [system]
      summary: Bir anlık görüntüyü başka bir makineye gönder
      description: |
        §8.1'in dizisi, yereldeki kardeşiyle birebir: analiz, plan, yazılı onay, yeniden kimlik
        doğrulama, iş.

        KARŞI TARAFTA `zfs recv -F` çalışıyor — yani yok edilen şey ORADA. Onay metni bu yüzden
        `kullanıcı@makine:veri-kümesi`: aynı ada sahip yerel bir veri kümesi olabilir, ve onaylanan
        şeyin hangisi olduğu tartışmaya açık kalmamalı.

        Tek deneme. Belirsiz bir hatadan sonraki yeniden deneme, karşı tarafta ne olduğunu bilmeden
        orayı bir daha yok etmek demek — ve ağ üzerinden "belirsiz hata" sıra dışı değil, olağan
        durum.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OffsiteReplicateRequest' }
      responses:
        '202':
          description: İş kuyruğa alındı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /remote/controller:
    get:
      operationId: getControllerStatus
      tags: [remote]
      summary: Bu cihaz kendi ağını yönetebilir mi
      description: |
        `zerotier-one`'ın kendisi controller — ayrı bir servis yok. Bu uç, daemon'un ayakta olup
        olmadığını ve cihazın kendi 10 haneli adresini söylüyor.

        ADRES SADECE GÖSTERİM İÇİN DEĞİL: üye listesinde cihazın kendi satırı, "yetkiyi kaldır"
        düğmesi ASLA gösterilmemesi gereken tek satır. Kendi yetkisini kaldıran bir cihaz, kendi
        sunduğu ağdan düşüyor ve geri almanın yolu tam da kopan bağlantının arkasında kalıyor.

        Yalnız yönetici.
      responses:
        '200':
          description: Controller durumu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControllerStatus' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /remote/controller/networks:
    get:
      operationId: listControlledNetworks
      tags: [remote]
      summary: Bu cihazın yönettiği ağlar
      description: |
        Yalnız BU KİRACININ yarattığı ağlar. Controller'ın kuruluş diye bir kavramı yok ve
        kutudaki her ağı döndürürdü; `remote_networks.controlled` ile daraltmak, iki kuruluşlu bir
        cihazda birinin ev ağının ötekinin arayüzünde görünmesini — ve oradan yönetilmesini —
        engelleyen şey.
      responses:
        '200':
          description: Yönetilen ağlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlledNetworkPage' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createControlledNetwork
      tags: [remote]
      summary: Evin kendi ağını kur
      description: |
        Ağı yaratıyor, yapılandırıyor, ve yapılandırmanın GERÇEKTEN UYGULANDIĞINI doğruluyor.

        Yalnız yaratmak, hiçbir cihazın adres alamadığı bir ağ üretiyor: `v4AssignMode.zt`
        varsayılan olarak kapalı, havuz boş, rota yok. Controller ise anlamadığı alanları sessizce
        atıp yine de 200 dönüyor — yani doğrulama olmadan kurulum ekranı yeşil, ağ ölü olurdu.
        `shortfall` boş değilse ağ VAR ama eksik kurulmuş demektir, ve arayüz bunu söylüyor.

        AĞ KİMLİĞİ BU CİHAZA KAYNAKLI. Üst 40 biti düğümün kendi adresi, yani ağ başka bir makineye
        taşınamıyor ve yeni bir `identity.secret` ile yaşayamıyor. Kimlik yedeği bu yüzden bu
        özellikten ÖNCE yazıldı.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNetworkRequest' }
      responses:
        '201':
          description: Ağ kuruldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedNetwork' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /remote/controller/networks/{networkId}/members/{memberId}:
    patch:
      tags: [remote]
      summary: Cihaza takma ad ver
      description: |
        Yalnız adı değiştirir — yetki durumuna, "kim aldı" kaydına ve denetim izine dokunmaz.
        Ad vermek bir yetki işlemi değildir ve öyle kaydedilmemelidir.
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: memberId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '204': { description: Ad değişti }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /remote/controller/networks/{networkId}/members:
    get:
      operationId: listControllerMembers
      tags: [remote]
      summary: Bu ağdaki cihazlar
      parameters:
        - name: networkId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Üyeler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControllerMemberPage' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      operationId: setControllerMemberAuthorized
      tags: [remote]
      summary: Bir cihazı içeri al ya da çıkar
      description: |
        ERİŞİM VEREN İŞLEM BU. Bir üyeyi yetkilendirmek, o cihaza evin dosyalarını tutan NAS'a ağ
        seviyesinde erişim vermek demek — yalnız yönetici, ve KİMİN bastığı kaydediliyor.

        Ajan, cihazın KENDİ adresinin yetkisini kaldırmayı reddediyor. Bu reddi API tekrarlamıyor:
        buradaki bir kopya, bu sürecin eline verilmiş bir değere karşı kontrol olurdu ve zamanla
        ayrışırdı.

        İLK YETKİLENDİRME ANINDA GEÇMİYOR. Controller yalnız daha önce hizmet ettiği üyelere
        yapılandırma itebiliyor; hiç görülmemiş bir cihaz kendi yeniden deneme döngüsüyle (~5 sn)
        öğreniyor. Arayüz "anında" demiyor.
      parameters:
        - name: networkId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetMemberRequest' }
      responses:
        '200':
          description: Üyenin yeni hâli, controller'dan geri okunmuş
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControllerMember' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /remote/peers:
    get:
      tags: [remote]
      summary: Bağlantı tanılaması
      description: |
        Bu düğüm kimi görüyor ve NASIL ulaşıyor.

        `GET /remote` "çevrimiçi" ve "ağa katıldı" diyor — ve her baytı bir ZeroTier kökü üzerinden
        AKTARILAN bir bağlantı için de aynı şeyi diyor. Doğru, ve bir kat daha yavaş. Kullanıcının
        "neden yavaş" sorusunun cevabı burada, `direct` alanında.

        **`direct` ZeroTier tarafından bildirilmiyor, ajanda TÜRETİLİYOR:** aktif bir yolu olan eşe
        o yoldan ulaşılıyor, olmayan bir eşe kök üzerinden. Türetme ajanda duruyor ki API ve tarayıcı
        kendi kopyalarını büyütmesin.

        **YALNIZ YÖNETİCİ.** Eş listesi kiracıya değil kutuya ait — daemon kimin sorduğunu bilmiyor
        — ve bu cihazın kiminle konuştuğunun haritası sıradan bir üyenin işi değil.

        `GET /remote` gibi HER ZAMAN 200: ZeroTier kurulu değilse `available: false` ve boş liste.
        İki uçtan biri hata döndürüp öteki dönmeseydi, arayüz aynı olguyu iki yolla öğrenirdi.
      responses:
        '200':
          description: Eşler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemotePeerPage' }
        '403': { $ref: '#/components/responses/Problem' }

  /me/preferences:
    get:
      tags: [me]
      summary: Arayüz tercihleri
      description: |
        Arka plan seçimi, ses, ve ana ekrandaki kısayolların yerleşimi. Sunucuda tutulur çünkü
        localStorage bir tarayıcıya aittir: telefondan giren aynı kişi kendi masasını bulmalı.

        Hiç yazılmamışsa boş bir belge döner, 404 değil — "tercih yok" bir hata değil, varsayılan.
      responses:
        '200':
          description: Tercihler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
    put:
      tags: [me]
      summary: Arayüz tercihlerini yaz
      description: |
        Tamamını değiştirir, birleştirmez. Kısmi birleştirme, iki sekmenin birbirinin kısayol
        yerleşimini yarım yazması demek olurdu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: Yazıldı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '422': { $ref: '#/components/responses/Problem' }

  /transfers:
    get:
      tags: [uploads]
      summary: Süren ve yakın zamanda biten aktarımlar
      description: |
        `upload_sessions` tablosundan okunur; ayrı bir kayıt tutulmaz. Bu, listenin
        SUNUCUNUN bildiği aktarımları gösterdiği anlamına gelir — başka bir sekmede başlayan bir
        yükleme de burada görünür, ki bir aktarım listesinin varlık sebebi tam olarak budur.

        İndirmeler burada YOK: indirme tek bir HTTP isteği ve sunucu tarafında durumu yok.
      responses:
        '200':
          description: Aktarımlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferPage' }

  /backups/target:
    get:
      tags: [system]
      summary: Yedek diskinin durumu
      description: |
        Kurulu hedef VE diskin o anki hali, tek cevapta.

        `unlocked` bir veritabani alani DEGIL, her okumada ZFS'e soruluyor. Parola hicbir yere
        yazilmiyor, yani cihaz her acildiginda disk kilitli oluyor; saklanan bir bayrak, yeniden
        baslatmadan sonra "acik" diyen ve kilitli olan bir kayit uretirdi.

        `configured: false` bir HATA DEGIL, cihazin olagan ilk hali — ekranin diyecegi cumle
        "yedek diski kurun".
      responses:
        '200':
          description: Durum
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupTargetStatus' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      tags: [system]
      summary: Bir havuzu sifreli yedek diski yap
      description: |
        HAVUZU BU UC KURMUYOR. Diskleri silen toren (SS8.1: analiz, adi yazarak onay, yeniden
        kimlik dogrulama) havuz kurma akisinda zaten var; buraya gelen havuz, kullanicinin o
        toreni gecerek kurdugu havuz. Toreni ikinci kez burada yapmak onu bir formaliteye
        cevirirdi.

        Havuzun altina iki veri kumesi kuruluyor: `aciklama` SIFRESIZ (diskin kendini anlattigi
        yari — yeni bir cihaza takildiginda parola sormadan okunuyor) ve `veri` SIFRELI.

        PAROLA HICBIR YERE YAZILMIYOR: bu istegin govdesinde geliyor, ajana stdin'den veriliyor
        ve orada bitiyor. Denetim kaydina da girmiyor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrepareBackupTargetRequest' }
      responses:
        '200':
          description: Kuruldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupTarget' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [system]
      summary: Ritim ve saklama suresi
      description: |
        `cadenceHours` kac saatte bir tur donecegi (varsayilan 6), `retainDays` silinen bir
        dosyanin yedekte kac gun duracagi (varsayilan 30 — sistemin onerisi, karari kullanicinin).

        SIFIR GUN KABUL EDILMIYOR: silinen dosyanin ayni turda yedekten de gitmesi demek, yani
        yanlislikla silmeye karsi hicbir koruma birakmayan bir ayna. Bunu bir ayar olarak sunmak,
        kullaniciya kendi korumasini kapatmanin kolay yolunu vermek olurdu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBackupTargetRequest' }
      responses:
        '200':
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupTarget' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /backups/target/unlock:
    post:
      tags: [system]
      summary: Yedek diskinin kilidini ac
      description: |
        Parola ZFS'in kendi anahtari. Dogruysa sifreli veri kumesi aciliyor ve baglaniyor.

        Yanlis parola ile "disk bozuk" AYNI cumleyle soylenmiyor: buradaki karsi taraf cihazin
        sahibi, bir saldirgan degil.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnlockBackupTargetRequest' }
      responses:
        '200':
          description: Acildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupTarget' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /backups/target/entries:
    get:
      tags: [system]
      summary: Yedek agacinda gezinme
      description: |
        Yedek diski bir arsiv degil, gezilebilen ikinci bir depolama — ve ona paylasimlarin
        gezgininden degil, YEDEKLEME ekranindan giriliyor.

        Kok iki klasor gosteriyor ve ikisi de gorunuyor: `Dosyalar/` gecikmeli ayna,
        `DEPSIS-YEDEK/` ise defterin kendisi. Defteri gizlemek, silinme tarihlerini yalniz urunun
        okuyabildigi bir bilgiye cevirirdi — oysa onun diski baska bir bilgisayara takan insana da
        gorunmesi, bu tasarimin amaci.

        `path` bos ya da eksikse kokun kendisi listeleniyor; bu bir hata degil, gezginin baslangic
        noktasi.
      parameters:
        - name: path
          in: query
          required: false
          schema: { type: string }
          description: Egik cizgiyle ayrilmis yol. Bos ise yedek agacinin koku.
      responses:
        '200':
          description: Dizin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupListing' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /backups/target/restore:
    post:
      tags: [system]
      summary: Yedekteki bir dosyayi geri getir
      description: |
        Yedegin var olma sebebi. Dosya yedekten okunup bir paylasima yaziliyor; yedekteki kopya
        YERINDE KALIYOR — geri getirme tasimak degil kopyalamak, ve silinenler klasorunden alinan
        bir dosya saklama suresi dolana kadar orada duruyor.

        HEDEFTE BIR DOSYA VARSA USTUNE YAZILMIYOR. Kullanicinin hala uzerinde calistigi bir
        dosyayi sessizce eski haliyle degistirmek, geri getirmenin cozmeye calistigi kaybin bir
        baskasini uretmek olurdu; cakisma 400 ile ve ajanin kendi cumlesiyle geri geliyor.

        ISTEK BEKLIYOR, kuyruga alinmiyor: tek bir dosya saniyeler suruyor ve kullanici sonucu
        hemen gormek istiyor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreFromBackupRequest' }
      responses:
        '200':
          description: Geri getirildi
          content:
            application/json:
              schema:
                type: object
                required: [restoredBytes]
                properties:
                  restoredBytes: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /backups/target/recovery/scan:
    get:
      tags: [system]
      summary: Takilabilecek yedek disklerini tara
      description: |
        KURTARMANIN ILK ADIMI, ve sahibinin altinci sartinin terminalsiz yarisi: *"sistem diski ve
        depolama diski yansa bile yedek diski eger sifre biliniyorsa kullanilabilir olmali."*

        Yanmis bir cihazdan cikan disk yeni bir cihaza takildiginda, bu uc onu goruyor. PAROLA
        SORULMUYOR ve sorulamaz: burada okunan sey havuzun kendi yapisi, sifreli yarinin icerigi
        degil.

        `needsAdopt`, havuzun duzgun birakilmamis oldugunu soyluyor — olen bir cihazdan cikan
        diskin olagan hali. Ekran bunu bir onay olarak sormali, cunku ayni disk hala calisan baska
        bir cihazda takiliysa devralmak havuzu bozar.

        Bos liste bir hata degil: saglikli bir cihazda olagan cevap tam olarak budur.
      responses:
        '200':
          description: Takilabilecek havuzlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportableBackupPools' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /backups/target/recovery/adopt:
    post:
      tags: [system]
      summary: Baska bir cihazin yedek diskini tani
      description: |
        DOSYALAR HALA KILITLI. Bu adim diski yalniz TANIYOR: havuzu hicbir veri kumesini
        baglamadan takiyor, DEPSIS yedek diski oldugunu veri kumelerinin adlarindan doguruluyor
        ve sifresiz yarisindaki `disk.json`u okuyor. Acan sey, bundan sonra `POST
        /backups/target/unlock`a girilen parola.

        Iki ayri adim olmasinin sebebi kullanicinin gordugu sey: parolayi sormadan once ekranin
        "bu, X etiketli cihazin 12 Agustos'ta aldigi yedek" diyebilmesi gerekiyor. Yanlis diski
        taktigini, parolasini yazdiktan sonra ogrenmemeli.

        HAVUZ DEPSIS YEDEK DISKI DEGILSE GERI BIRAKILIYOR ve 400 donuyor: takmak bir yan etki, ve
        kullanicinin sectigi havuzun bu cihaza ait oldugu anlamina gelmiyor.

        Satir KURTARMA KIPINDE aciliyor (`recoveryOnly`): yedekleme turu bu diske yazmiyor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdoptBackupDiskRequest' }
      responses:
        '200':
          description: Disk tanindi; hala kilitli
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdoptedBackupDisk' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /backups/target/recovery/release:
    post:
      tags: [system]
      summary: Kurtarma diskini birak
      description: |
        Fisi cekmeden onceki dogru adim: havuz birakiliyor ve kurtarma satiri siliniyor. Sifreli
        yarinin anahtari da havuzla birlikte gidiyor, yani birakmak kilitlemenin tamamlanmis hali.

        YALNIZ KURTARMA DISKLERI. Cihazin kendi yedek diskini birakmak ayarlarini da silmek
        olurdu; onun karsiligi `POST /backups/target/lock`.
      responses:
        '204': { description: Birakildi }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /backups/target/run:
    post:
      tags: [system]
      summary: Simdi yedek al
      description: |
        Bir turu hemen kuyruga alir. IS KUYRUGA KONUYOR, burada kosturulmuyor: bir tur saatler
        surebilir ve bir HTTP istegi o kadar beklemez; beklese bile tarayici vazgectiginde tur
        yarim kalirdi.

        AYRI BIR IS TURU, ve ayri olmasi bir tuzagi kapatiyor. Zincirin tekilligini koruyan kismi
        indeks — ayni anda yalniz bir zamanlanmis tur kuyrukta olabilir — elle baslatilan turu da
        engellerdi: zincir geregi her zaman tam olarak bir bekleyen satir var, yani dugme hicbir
        zaman is kuyruga koyamazdi.
      responses:
        '202':
          description: Kuyruga alindi
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: { type: boolean, enum: [true] }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /backups/target/lock:
    post:
      tags: [system]
      summary: Yedek diskini kilitle
      description: |
        Anahtar dusuruluyor: dosyalar okunamaz hale geliyor ve yedekleme turu duruyor. Kilitli
        bir disk bir ariza degil — parola hicbir yere yazilmadigi icin cihaz her acildiginda
        zaten bu halde oluyor.
      responses:
        '200':
          description: Kilitlendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupTarget' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /backups:
    get:
      tags: [system]
      summary: DEPSIS'in aldığı anlık görüntüler
      description: |
        Havuzdaki anlık görüntülerin listesi DEĞİL, ve bu fark önemli. Ajanın işlem kümesi kapalı
        (ADR-0006) ve içinde `CreateSnapshot` ile `DiffSnapshots` var ama "listele" yok. Biri
        Rust tarafına o işlemi ekleyene kadar dürüstçe gösterilebilecek şey, DEPSIS'in kendi
        aldıklarının kaydıdır. Kabuktan alınmış bir anlık görüntü burada görünmez ve arayüz bunu
        söylemek zorundadır.
      responses:
        '200':
          description: Anlık görüntüler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotPage' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [system]
      summary: Anlık görüntü al
      description: |
        Yalnız yöneticiler. Ajanın `CreateSnapshot` işlemi çağrılır; ajan doğrularsa satır yazılır.
        Sıra bu yönde: önce satır yazıp sonra ajanı çağırmak, ajan reddettiğinde var olmayan bir
        yedeği listeleyen bir kayıt bırakırdı.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSnapshotRequest' }
      responses:
        '201':
          description: Alındı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /files/{id}/permanent:
    parameters:
      - $ref: '#/components/parameters/FileId'
    delete:
      tags: [files]
      summary: Çöpten kalıcı olarak sil
      description: |
        Baytları siler. Geri alınamaz ve bu yüzden ÇÖPTEKİ bir girdide çalışır: çöpte olmayan bir
        girdi 409 alır. Bir tıklamayla kalıcı silme, bir tıklamayla veri kaybıdır; çöp kutusu o
        tıklamanın arasına giren şey.

        Klasör silmek ÖZYİNELEMELİ ve alttan yukarı: API ağacı biliyor, ajan bilmiyor. Her yaprak
        için bir `RemoveEntry` çağrısı gider ve klasörün kendisi en sona kalır. Bu, tek bir
        "rekürsif sil" işlemi eklemekten yavaş ama ajanın işlem kümesini `rm -rf` yetkisiyle
        genişletmiyor — kapalı kümenin bütün anlamı bu.

        Yarıda kesilirse silinenler silinmiş kalır: işlem atomik DEĞİL ve olamaz. Kısmen silinmiş
        bir ağaç çöpte durmaya devam eder ve tekrar çağırmak kaldığı yerden devam eder.
      responses:
        '204': { description: Silindi }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          # Çöpte olmayan bir girdi. 404 yanlış olurdu — girdi VAR, yalnızca bu işlem için
          # doğru durumda değil, ve kullanıcıya "önce çöpe at" demek gerekiyor.
          $ref: '#/components/responses/Problem'
        '503': { $ref: '#/components/responses/Problem' }

  /files/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/FileId'
    post:
      tags: [files]
      summary: Çöp kutusundan geri al
      description: |
        Geri alma, adın hâlâ boş olmasını gerektirir: çöpe atılmış bir dosya adını rehin tutmaz
        (0008'deki kısmi benzersizlik indeksleri), yani aynı adla yenisi oluşturulmuş olabilir.
        Böyle bir durumda 409 döner ve kullanıcıdan yeniden adlandırması beklenir — sessizce
        "(1)" eklemek, iki dosyadan hangisinin hangisi olduğunu kimsenin bilemeyeceği yerdir.
      responses:
        '200':
          description: Geri alındı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileEntry' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /console:
    post:
      tags: [console]
      summary: Yönetici konsolu oturumu aç
      description: |
        ADR-0018. Üç kapı: yönetici rolü, mevcut parola, ve süre sınırı.

        Parola oturum zaten varken de isteniyor. Bir oturum, birinin açık bıraktığı bilgisayarı
        ödünç alanın sahip olduğu şeydir; bir kabuk ise cihazın tamamıdır. Parola değişikliğinde
        aynı gerekçeyle aynı şey yapılıyor.

        Konsol AYRICALIKLI AJANDA ÇALIŞMAZ. Kendi systemd birimi olan ayrı bir servis, varsayılan
        olarak ayrıcalıksız bir kullanıcıyla. §2.2'nin "aracı serbest komut kabul etmemeli"
        kuralı bozulmadı; aracı bu işin hiçbir yerinde yok.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenConsoleRequest' }
      responses:
        '201':
          description: Oturum açıldı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleSession' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503':
          # Konsol servisi kapatılabilir bir birim — `systemctl disable depsis-console` özelliği
          # tamamen kapatır. Kapalıyken 500 değil 503 dönmek, "bozuk" ile "kapalı" arasındaki
          # farkı koruyor.
          $ref: '#/components/responses/Problem'
    get:
      tags: [console]
      summary: Açık konsol oturumları
      description: Yalnız yöneticiler. Bir yöneticinin "şu an kimin kabuğu açık" sorusu.
      responses:
        '200':
          description: Oturumlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleSessionPage' }
        '403': { $ref: '#/components/responses/Problem' }

  /console/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [console]
      summary: Oturumu kapat
      responses:
        '204': { description: Kapatıldı }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /console/{id}/input:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [console]
      summary: Konsola tuş gönder
      description: |
        Gövde ham metindir, satır değil: bir terminal karakter karakter çalışır ve Ctrl-C,
        sekme tamamlama, ok tuşları hep bayt dizileridir. Satır bazlı bir uç, terminal olmazdı.

        Denetim için satırlar ayrıca toplanır (`console_commands`), ama bu uç noktanın işi değil —
        konsol servisi tam bir satır gördüğünde yazar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsoleInput' }
      responses:
        '204': { description: İletildi }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '410':
          description: Oturum kapanmış — boşta kalma süresi ya da üst sınır.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /console/{id}/resize:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [console]
      summary: Pencere boyutunu bildir
      description: |
        Pty'nin satır/sütun sayısı. Bildirilmezse `top` ve `vim` yanlış boyutta çizer ve satır
        kaydırma bozulur — bir terminalin gerçekten terminal olup olmadığı buradan anlaşılır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsoleResize' }
      responses:
        '204': { description: Bildirildi }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /console/{id}/stream:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [console]
      summary: Konsol çıktısı (Server-Sent Events)
      description: |
        WebSocket değil. Nest'te SSE çerçevede zaten var, WS ise bir gateway ve ek bağımlılık
        istiyor; bir terminalin gecikme bütçesi insan yazma hızı ve SSE bunun için fazlasıyla
        yeterli. Tek yönlü olması eksiklik değil — giriş zaten ayrı ve küçük bir istek.

        Her olay bir `data:` satırı; içerik base64, çünkü terminal çıktısı UTF-8 sınırlarını
        ortadan bölebilen ham bayttır ve SSE metin taşır.
      responses:
        '200':
          description: Olay akışı
          content:
            text/event-stream:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /apps:
    get:
      tags: [apps]
      summary: Uygulama kataloğu ve kurulu olanlar
      description: |
        ADR-0019. Katalog küratörlüdür: kullanıcı imaj adı yazamaz. Serbest imaj adı, kullanıcının
        internetten indirilen keyfi kodu çalıştırabilmesi demektir.

        Her satırın durumu podman'dan OKUNUR, veritabanından değil. Bir kolona yazılsaydı cihaz
        yeniden başladığında yalan söylerdi.

        GET /apps HER ZAMAN 200 döner — podman kurulu olmasa bile. Katalog veritabanında duruyor
        ve onu listelemek için çalışma zamanı gerekmiyor; kurulu uygulamaların durumu ise
        `unknown` olur ve `runtime.available` false gelir.

        Önceki hâlinde burada bir 503 yayımlanmıştı ve o dal artık ulaşılamaz. Ulaşılamaz bir
        durum kodunu belgede bırakmak, belgelenmemiş bir koddan daha kötü: istemci onun için bir
        dal yazar ve o dal hiç çalışmaz. Aynı karar `GET /remote` için de verildi, aynı gerekçeyle.

        Değiştiren uçlar (kur/başlat/durdur/kaldır) 503 döndürmeye devam eder: orada yapılamayan
        gerçek bir iş var.
      responses:
        '200':
          description: |
            Uygulamalar. `runtime.available` false ise konteyner çalışma zamanı yok ve kurulu
            uygulamaların durumu `unknown`'dır.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppPage' }

  /apps/custom:
    post:
      tags: [apps]
      summary: Özel uygulama ekle (yalnız yönetici)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomAppRequest' }
      responses:
        '201':
          description: Eklendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomApp' }
        '422': { $ref: '#/components/responses/Problem' }

  /apps/custom/{slug}:
    delete:
      tags: [apps]
      summary: Özel uygulamayı katalogdan sil (kuruluysa önce kaldırılmalı)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Silindi }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /apps/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
    post:
      tags: [apps]
      summary: Uygulamayı kur
      description: |
        Yalnız yöneticiler. İmaj indirilir ve konteyner oluşturulur; bağlama noktaları KATALOGDAN
        gelir, istekten değil. İstek yalnızca hangi paylaşımın hangi hedefe bağlanacağını seçer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstallAppRequest' }
      responses:
        '201':
          description: Kuruldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [apps]
      summary: Başlat veya durdur
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppStateRequest' }
      responses:
        '200':
          description: Uygulandı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [apps]
      summary: Uygulamayı kaldır
      description: |
        Konteyner silinir. BAĞLANAN PAYLAŞIMLARA VE İÇERİKLERİNE DOKUNULMAZ — bir uygulamayı
        kaldırmanın kullanıcının fotoğraflarını silmesi, bu üründe olabilecek en kötü şeylerden
        biri. Podman'a `v=false` geçilir, yani hiçbir volume kaldırılmaz.

        HİÇBİR VERİ SİLİNMEZ, uygulamanın kendi ayarları dahil: katalogdaki `/config` ve `/data`
        gibi hedefler volume değil, kullanıcının seçtiği paylaşıma bind mount. Belgenin önceki
        hâli ayar biriminin silindiğini söylüyordu ve bu doğru değildi — silinmiş bir şeyi
        söylemekten daha kötü olan tek şey, silinmediği hâlde silindiğini söylemek.

        Yanıt gövdesizdir (204), yani "ne silindi" diye anlatacağı bir yer de yok.
      responses:
        '204': { description: Kaldırıldı }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /apps/{slug}/logs:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
    get:
      tags: [apps]
      summary: Uygulamanın son günlük satırları
      description: |
        "Neden çalışmıyor" sorusunun tek dürüst cevabı çoğu zaman burada. Günlük olmadan bir
        uygulama kataloğu, çalışmadığında yapılacak hiçbir şey bırakmaz.
      parameters:
        - name: lines
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Günlük
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppLogs' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /remote:
    get:
      tags: [remote]
      summary: Uzak erişim durumu
      description: |
        ADR-0020. Düğüm kimliği ve katılınan ağlar. Her kullanıcı görebilir — kendi cihazının
        kimliğini bilmek bir sır değil.

        Bir ağın `authorized` alanı false ise cihaz o ağa KATILMIŞ ama ONAYLANMAMIŞTIR ve hiçbir
        trafik akmaz. Arayüz bunu "bağlanıyor" diye göstermemeli: kullanıcının ZeroTier Central'da
        bir kutu işaretlemesi gerekiyor ve bunu bilmezse ürünü bozuk sanar.

        Bu uç HER ZAMAN 200 döner — daemon kurulu değilse de. Belgenin önceki hâli hem 503 hem de
        `available` bayrağı tarif ediyordu ve ikisi aynı anda doğru olamaz; uygulayan ajan da bunu
        bir çelişki olarak bildirdi.

        200 seçildi çünkü ZeroTier'in KURULU OLMAMASI bir arıza değil, bir durum: cihazın
        çoğunluğu onsuz çalışıyor ve DEPSIS onu paketlemiyor. Bir arayüz kartının "uzak erişim
        kurulu değil, şöyle kurulur" yazabilmesi için okunabilir bir cevap gerekiyor, hata değil.
        Bunun `/system/telemetry`'nin 503'üyle çeliştiği doğru ama sebebi var: depolama ajanının
        yokluğu GERÇEKTEN bir arıza — havuzsuz bir NAS çalışmıyor demektir.

        Değiştiren uçlar (katıl/ayrıl) 503 döndürmeye devam eder: orada yapılamayan gerçek bir iş var.
      responses:
        '200':
          description: |
            Durum. `available: false` ise zerotier-one kurulu değil ya da çalışmıyor ve diğer
            alanlar boştur.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteStatus' }

  /remote/networks:
    post:
      tags: [remote]
      summary: Ağa katıl
      description: |
        Yalnız yöneticiler: bir ağa katılmak cihazı o ağdaki herkese görünür kılar ve bu bir
        yönetim kararı.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinNetworkRequest' }
      responses:
        '201':
          description: Katılındı — onay bekleniyor olabilir
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteNetwork' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /remote/networks/{networkId}:
    parameters:
      - name: networkId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9a-f]{16}$' }
    delete:
      tags: [remote]
      summary: Ağdan ayrıl
      responses:
        '204': { description: Ayrılındı }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /teams:
    get:
      tags: [teams]
      summary: Ekipler
      description: |
        §6.1'in hiyerarşisinde ekip, organizasyon ile kullanıcı arasındaki katman. İzinler ekibe
        verilir ve kullanıcı ekibe girer — ADR-0004'ün "ACL girdileri kullanıcıya değil gruba
        verilir" kuralı bu. POSIX ACL'ler ~30 girdiden sonra hantallaşıyor ve mask semantiği
        ısırıyor, yani bu bir düzen tercihi değil bir zorunluluk.

        Her kullanıcı listeyi görür: bir ekibin var olduğu, o ekipte olmayan birinden saklanacak
        bir şey değil ve izin verirken hedefi seçebilmek gerekiyor. Üyelik listesi ayrı bir uçta.
      responses:
        '200':
          description: Ekipler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamPage' }
    post:
      tags: [teams]
      summary: Ekip oluştur
      description: |
        Yalnız yöneticiler. Satır yazılır ve POSIX grubu ayrıca ayrılır; grup dosya sistemine
        yansıtılana kadar `posixGid` null kalır ve bu ekibe verilen izin SMB'de görünmez.
        Yanıt bunu saklamıyor — arayüzün söyleyebilmesi gerekiyor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTeamRequest' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /teams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [teams]
      summary: Ekibi yeniden adlandır
      description: |
        Yalnız organizasyon yöneticileri ya da o ekibin yöneticisi (§6.1: "Ekip yöneticisi —
        kendi ekibi içindeki kullanıcı, klasör ve görevler").
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTeamRequest' }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [teams]
      summary: Ekibi sil
      description: |
        Yalnız organizasyon yöneticileri. Ekibe verilmiş İZİNLER de gider (`ON DELETE CASCADE`) ve
        bu sessiz bir yan etki olamaz: silme, kaç klasörde kaç kişinin erişimini kaybedeceğini
        döndüren bir ön izleme ister. `?dryRun=true` ile çağrıldığında hiçbir şey silinmez ve
        yalnız etki döner — §6.2'nin "her izin değişimi dry-run ile etkilenecek kullanıcı/klasör
        sayısını göstermeli" şartı burada da geçerli, çünkü ekip silmek toplu bir izin
        değişikliğidir.
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Ön izleme (yalnız dryRun=true ile)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionImpact' }
        '204': { description: Silindi }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /teams/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [teams]
      summary: Ekip üyeleri
      responses:
        '200':
          description: Üyeler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMemberPage' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [teams]
      summary: Üye ekle veya üyeliğini güncelle
      description: |
        PUT, POST değil: aynı kullanıcıyı iki kez eklemek bir hata değil, aynı durumu iki kez
        istemektir. `teamAdmin` bayrağını değiştirmek de aynı çağrı.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamMembershipRequest' }
      responses:
        '200':
          description: Üyelik yazıldı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /teams/{id}/members/{userId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [teams]
      summary: Üyeyi çıkar
      description: |
        Bir kişiyi ekipten çıkarmak, o ekibin bütün izinlerini o kişiden almaktır. §6.2'nin
        deny'sız modelinde "şu kişi hariç herkes" demenin TEK yolu bu, o yüzden sık kullanılacak
        ve etkisi görünür olmalı: `?dryRun=true` kaç klasörün erişimini kaybedeceğini döndürür.
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Ön izleme (yalnız dryRun=true ile)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionImpact' }
        '204': { description: Çıkarıldı }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /files/{id}/permissions:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [permissions]
      summary: Bu klasörün izinleri
      description: |
        İki ayrı şey döner ve karıştırılmamalı:

        - `effective` — ÇAĞIRANIN bu klasörde gerçekten yapabildikleri, miras hesaplandıktan
          sonra. Arayüz düğmeleri buna göre çizer.
        - `grants` — bu düğümde AÇIKÇA yazılmış izin satırları. Yalnız `manage` iznine sahip
          olana döner; olmayan için boş dizi gelir, çünkü kimin nereye erişebildiği kendi başına
          bir bilgidir.

        `inheritedFrom`, `effective` kümesinin hangi atadan geldiğini söyler (bu düğümün kendisi
        ise kendi kimliği, hiç grant yoksa null). ADR-0021'in miras kuralı temsilci başına EN
        YAKIN atayı seçtiği için "bu izin nereden geliyor" cevaplanabilir bir soru ve
        cevaplanmalı — aksi hâlde bir yöneticinin izni nereden kaldıracağını bulması imkânsız.
      responses:
        '200':
          description: İzinler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderPermissions' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [permissions]
      summary: Bu klasörün açık izinlerini yaz
      description: |
        `manage` izni gerekiyor — `modify` YETMEZ. Bir klasöre yazabilen herkesin o klasörün
        iznini de değiştirebilmesi, yetki modelinin kendi kendini geçersiz kılmasıdır (ADR-0021).

        Gövde bu düğümdeki grant'ların TAMAMINI değiştirir. Kısmi birleştirme, iki yöneticinin
        birbirinin izin listesini yarım yazması demek olurdu.

        `?dryRun=true` ile hiçbir şey yazılmaz ve yalnız etki döner. §6.2 bunu şart koşuyor ve
        gerekçesi somut: miras bir alt ağacın tamamını değiştiriyor, yani "şu klasörü ekibe
        açayım" tıklaması kişinin farkında olmadığı beş yüz dosyayı açabilir.

        İzinler dosya sistemine ANINDA yansımaz. POSIX ACL'lerin yeniden yazılması bir iş
        kuyruğu görevi ve tamamlanana kadar iki katman ayrışıktır (ADR-0021'in kabul edilen
        borcu); yanıt `applyingJobId` ile bunu söyler ve arayüz "izinler uygulanıyor"
        gösterebilir.
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetFolderPermissionsRequest' }
      responses:
        '200':
          description: Yazıldı, ya da dryRun ise ön izleme
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionWriteResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /shares/{id}/permissions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [permissions]
      summary: Paylaşım kökünün izinleri
      description: |
        `/files/{id}/permissions` ile aynı şey, kök için. Ayrı bir uç nokta olmasının sebebi
        kimlik uzayları: bir paylaşım `file_entries` satırı DEĞİL, ve bir uç noktanın iki farklı
        tablodan kimlik kabul etmesi, hangisinin bulunamadığını söyleyemeyen bir 404 üretir.
      responses:
        '200':
          description: İzinler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderPermissions' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [permissions]
      summary: Paylaşım kökünün açık izinlerini yaz
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetFolderPermissionsRequest' }
      responses:
        '200':
          description: Yazıldı, ya da dryRun ise ön izleme
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionWriteResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: depsis_session
      description: |
        Sunucu tarafı oturum. JWT kullanılmaz — güvenlik olayında tüm oturumların iptal
        edilebilmesi gerekiyor ve stateless token bunu ucuz yapmıyor (ADR-0009).

  parameters:
    FileId:
      name: id
      in: path
      required: true
      description: Kararlı dosya kimliği. Yol asla kimlik olarak kullanılmaz (ADR-0005).
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Opak. İstemci bunu üretmez ve ayrıştırmaz; kodlaması sunucuya aittir.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Kullanıcı ve uç kapsamında benzersiz. Aynı anahtar farklı bir istek parmak iziyle
        gelirse 409 döner. RFC yoktur — IETF taslağı Expired and archived durumundadır — bu
        yüzden semantik burada tanımlanır (ADR-0008).
      schema: { type: string, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      description: Çakışma kontrolü. Eşleşmezse 412.
      schema: { type: string }

  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail:
          type: string
          description: Secret, dosya içeriği veya çağıranın görmeye yetkili olmadığı yol içermez.
        instance: { type: string }
        code:
          type: string
          description: Kapalı küme. Kaynak tanım packages/contracts/src/errors.ts.
        correlationId:
          type: string
          description: Her yanıtta ve aynı isteğin her log satırında bulunur (§14).
        errors:
          type: array
          items: { $ref: '#/components/schemas/ProblemFieldError' }
        retryAfter: { type: integer, minimum: 0 }

    JobEvent:
      type: object
      description: |
        `event: job` olayının gövdesi. Medya tipi `text/event-stream` olduğu için şema oradan
        referans verilemiyor — bu tanım, akışın taşıdığı JSON'ın sözleşmedeki karşılığı.
      required: [id, kind, status, progress, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, dead] }
        progress: { type: number, minimum: 0, maximum: 1 }
        createdAt: { type: string, format: date-time }
        error:
          type: object
          required: [title]
          properties:
            title: { type: string }

    TransferEvent:
      type: object
      description: '`event: transfer` olayının gövdesi.'
      required: [id, filename, lengthBytes, offsetBytes, completed]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        lengthBytes: { type: integer, format: int64 }
        offsetBytes: { type: integer, format: int64 }
        completed: { type: boolean }

    TrashPolicy:
      type: object
      required: [retentionDays, updatedAt, impact]
      properties:
        retentionDays:
          type: integer
          nullable: true
          description: '`null`: süresiz sakla. Varsayılan bu.'
        updatedAt: { type: string, format: date-time, nullable: true }
        impact:
          type: object
          required: [entries, files, bytes, oldestTrashedAt]
          properties:
            entries:
              type: integer
              description: |
                Süresi dolmuş ÜST DÜZEY girdiler. Çöpe atılmış bir klasör, içinde ne olursa olsun
                bir kez sayılır.
            files:
              type: integer
              description: Onların altındaki dosyalar, özyinelemeli. Temizlemenin süresini bu belirler.
            bytes:
              type: integer
              format: int64
              description: |
                Geri kazanılacak baytlar. KÖKLERİN değil, altlarındaki DOSYALARIN toplamı — bir
                klasörün `size_bytes` değeri 0 olduğu için kökleri toplamak yalan söylerdi.
            oldestTrashedAt: { type: string, format: date-time, nullable: true }

    PasswordResetTicket:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
          description: |
            Tek kullanımlık. Bir daha gösterilmiyor — sunucuda yalnız SHA-256 özeti duruyor.
        expiresAt: { type: string, format: date-time }

    ProblemFieldError:
      type: object
      required: [pointer, code, message]
      properties:
        pointer: { type: string }
        code: { type: string }
        message: { type: string }

    FileName:
      type: string
      minLength: 1
      maxLength: 255
      description: |
        Windows'ta yasak karakterler, ayrılmış adlar (CON, PRN, AUX, NUL, COM1 vb.) ve
        sondaki nokta/boşluk sunucu tarafında reddedilir — SMB istemcileri o dosyalara
        erişemezdi.

    LoginRequest:
      type: object
      required: [username, password]
      description: |
        Kullanıcı adı ve parola. İki alan da bir zamanlar başka bir şeydi ve ikisi de gerçek bir
        giriş hatasından sonra değişti.

        `organizationSlug` KALDIRILDI. Şema "kiracı, kullanıcıdan önce çözülmek zorunda" diyordu ve
        bu doğru — ama `system_setup` bir singleton, yani bir DEPSIS kutusunda tam olarak bir
        organizasyon var ve hep olacak. Tek cevabı olan bir soruyu sormanın tek etkisi, yanlış
        cevaplanabilmesiydi: sonunda tek boşluk olan bir slug sunucunun biçim kontrolünü geçemiyor
        ve yanlış paroladan ayırt edilemeyen bir retle dönüyor. Sunucu artık kutunun kendi
        organizasyonunu çözüyor (`resolve_sole_organization`) ve birden fazla olursa reddediyor.

        `email` yerine `username`. Yerel ağdaki bir NAS posta göndermiyor ve hiçbir adresi
        doğrulamıyor; adres, yazılacak ve yanlış yazılacak ikinci bir şeydi. Adres alanı duruyor
        ama isteğe bağlı ve kimlik doğrulamada kullanılmıyor.
      properties:
        username:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
        organizationSlug:
          type: string
          maxLength: 63
          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
          description: |
            İSTEĞE BAĞLI ve arayüz bunu hiç göndermiyor. Yalnız kutuda birden fazla organizasyon
            varsa gerekiyor — sahiplenilmiş bir cihazda asla olmayan bir durum. Alan silinmedi
            çünkü kapsadığı varsayımın çökerek değil, zarifçe bozulması gerekiyor.
        password: { type: string, maxLength: 1024 }

    MfaVerifyRequest:
      type: object
      required: [code]
      description: |
        `challengeId` taşımıyor — meydan okuma çerezde (bkz. LoginResult).
      properties:
        code:
          type: string
          maxLength: 64
          description: |
            TOTP kodu VEYA kurtarma kodu. Ayrı uç yok ve desen dar değil, ikisi de kasıtlı:
            sunucu hangisi olduğunu ŞEKİLDEN anlıyor, çağırana sormuyor. Soran bir arayüz,
            saldırganın zayıf bulduğu dala yönlendirme yapmasına izin verirdi.

    LoginResult:
      type: object
      required: [status]
      description: |
        Kimlik bilgisi yanlışsa 401 döner ve gövde kullanıcının var olup olmadığını ayırt
        ettirmez.

        `challengeId` YOK, ve bu kasıtlı bir değişiklik: bekleyen giriş bir gövde alanı değil,
        `HttpOnly` + `SameSite=Strict` bir çerez. Gövdedeki bir kimlik script tarafından
        okunabilir ve istemciler arasında taşınabilirdi; çerez okunamıyor. Gövde yalnız hangi
        ekranın gösterileceğini söylüyor.
      properties:
        status:
          type: string
          enum: [ok, mfa_required]

    MfaVerifyResult:
      type: object
      required: [status, usedRecoveryCode]
      description: |
        204 değil, çünkü söylenmeye değer bir şey var: bir kurtarma kodu harcandıysa arayüz
        kaç tane kaldığını gösterip yeniden kayda yönlendirebilmeli. Kullanıcıyı arayıp
        bulmaya bırakmak, fark etmekle bitirmek arasındaki fark.
      properties:
        status: { type: string, enum: [ok] }
        usedRecoveryCode: { type: boolean }

    HealthStatus:
      type: object
      required: [status, database, role]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [reachable, unreachable] }
        role:
          type: [string, 'null']
          description: Bağlanılan veritabanı rolü; erişilemiyorsa null.

    SetupClaimRequest:
      type: object
      required: [organizationSlug, organizationName, adminUsername, adminPassword]
      properties:
        organizationSlug:
          type: string
          maxLength: 63
          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
        organizationName: { type: string, maxLength: 200 }
        adminUsername:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
        adminPassword:
          type: string
          minLength: 12
          maxLength: 1024
          description: |
            Yalnız uzunluk tabanı. Bileşim kuralı (bir büyük, bir rakam, bir sembol) arama
            uzayını genişletmekten çok daraltıyor ve NIST SP 800-63B tam bu yüzden tavsiyeyi
            geri çekti.

    CurrentUser:
      type: object
      required: [id, username, role, organizationSlug, mfaEnrolled, recoveryCodesRemaining]
      description: |
        `username` değil `email` — LoginRequest ile aynı düzeltme, aynı gerekçeyle.

        `permissions` alanı KALDIRILDI. Şemanın ilk hâlinde vardı, ama ACL modeli henüz yok ve bu
        alan bugün her istekte boş bir dizi dönerdi. Her zaman boş dönen bir alan, "bu kullanıcının
        hiçbir yetkisi yok" diyen bir alandır — arayüz de ona bakıp her şeyi gizlerdi. Yetkiler
        geldiğinde alan da geri gelir; o zamana kadar yokluğu, yalan söylemesinden iyi.
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        smbReady:
          type: boolean
          description: |
            Bu hesap SMB'ye ULAŞABİLİR Mİ.

            SMB parolası, DEPSIS parolası AYARLANIRKEN türetiliyor. Bu özellik var olmadan önce
            parolasını en son değiştirmiş bir hesabın passdb girdisi yok, ve Windows öyle birine
            hiçbir zaman kabul etmeyeceği bir kimlik penceresi gösteriyor — sebebini söylemeden.

            Alan bunun için var: "DEPSIS parolanı kullan" demeden önce, kullanabileceğini bilmek
            gerekiyor. Değeri false ise yapılacak şey belli ve tek: parolayı bir kez değiştirmek.
        email:
          type: [string, 'null']
          description: |
            İSTEĞE BAĞLI ve kimlik doğrulamada KULLANILMIYOR. Yerel ağdaki bir NAS posta
            göndermiyor ve hiçbir adresi doğrulamıyor; giriş kullanıcı adıyla yapılıyor.
        role:
          type: string
          enum: [admin, member]
          description: |
            Arayüzün yönetici ekranlarını gösterip göstermeyeceğini bilmesi için. Bir YETKİ KARARI
            DEĞİL — sunucu her isteği kendi kontrol ediyor; bu yalnızca kullanıcıya çağıramayacağı
            bir düğmeyi göstermemek için.
        organizationSlug: { type: string }
        mfaEnrolled:
          type: boolean
          description: Onaylanmış bir TOTP kaydı var mı.
        recoveryCodesRemaining:
          type: integer
          description: Harcanmamış kurtarma kodu sayısı. Kayıt yoksa 0.

    MfaEnrolment:
      type: object
      required: [otpauthUri, secretBase32]
      properties:
        otpauthUri:
          type: string
          description: QR olarak gösterilecek otpauth:// bağlantısı.
        secretBase32:
          type: string
          description: Tarama yapamayan bir uygulama için aynı sır, metin olarak.

    RecoveryCodes:
      type: object
      required: [codes]
      description: |
        Kodlar yalnız üretildikleri anda okunabilir; sunucu hash'lerini saklıyor. İkinci kez
        istemenin yolu yenilemek, ve yenilemek eskileri geçersiz kılar.
      properties:
        codes:
          type: array
          items: { type: string }

    PasswordConfirmation:
      type: object
      required: [password]
      description: |
        §0.5 gereği yeniden kimlik doğrulama. Oturum çerezi kimin olduğunu söyler; bu, o kişinin
        hâlâ klavyenin başında olduğunu söyler.
      properties:
        password: { type: string, maxLength: 1024 }

    Permission:
      type: string
      description: |
        Allow-only. deny yoktur — POSIX ACL'de deny ACE diye bir şey yok ve uygulanan
        substrat onu ifade edemez (ADR-0004).
      enum:
        - list
        - read
        - download
        - create
        - modify
        - move
        - delete
        - share
        - manage_acl
        - view_versions
        - view_audit

    AuditEvent:
      type: object
      required:
        [
          id,
          actorId,
          actorUsername,
          action,
          targetKind,
          targetId,
          targetLabel,
          summary,
          correlationId,
          ip,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        actorId:
          type: [string, 'null']
          format: uuid
          description: |
            Hesap silinmişse null; `actorUsername` yine doludur. Denetim kaydı, artık var olmayan
            hesaplar hakkında konuşabilmek için var.
        actorUsername: { type: string }
        action:
          type: string
          description: Noktalı eylem adı — `auth.login`, `user.role-changed`, `permissions.changed`.
        targetKind: { type: [string, 'null'] }
        targetId: { type: [string, 'null'] }
        targetLabel:
          type: [string, 'null']
          description: Hedefin OLAY ANINDAKİ adı. Hedef silinse de satır okunur kalsın diye kopya.
        summary: { type: string }
        correlationId:
          type: [string, 'null']
          format: uuid
          description: Ajanla konuşan işlemlerde, ajanın kendi günlüğündeki satıra köprü (§9).
        ip:
          type: [string, 'null']
          description: Yalnız kimlik doğrulama olaylarında dolu; başka olayda toplanmıyor (§16).
        createdAt: { type: string, format: date-time }

    AuditPage:
      type: object
      required: [items, nextBefore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        nextBefore:
          type: [string, 'null']
          format: uuid
          description: Bir sonraki sayfanın `before` değeri; null ise daha eski kayıt kalmamıştır.

    DirectoryEntry:
      type: object
      required: [id, username]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }

    DirectoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DirectoryEntry' }

    User:
      type: object
      required: [id, username, role, disabled, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: [string, 'null'] }
        role:
          type: string
          enum: [admin, member]
        disabled: { type: boolean }
        createdAt: { type: string, format: date-time }

    UserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }

    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
          description: |
            Giriş kimliği. '@' içeremez — bir kullanıcı adının bir adresle karıştırılabilmesi,
            ne insan ne de gelecekteki bir ayrıştırıcı için iyi bir fikir.
        role:
          type: string
          enum: [admin, member]
          default: member
        password:
          type: string
          minLength: 12
          description: |
            Uzunluk tabanı, kompozisyon kuralı değil. "Bir rakam, bir sembol" kuralı insanları
            ölçülebilir biçimde `Passw0rd!`e itiyor ve dört karakter daha uzunluktan az kazandırıyor.

    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        role:
          type: string
          enum: [admin, member]
        disabled: { type: boolean }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 12 }

    PasswordChanged:
      type: object
      required: [status, otherSessionsRevoked]
      properties:
        status: { type: string, enum: [ok] }
        otherSessionsRevoked: { type: integer }

    FileEntry:
      type: object
      required: [id, parentId, name, kind, size, modifiedAt, permissions]
      properties:
        permissions:
          type: array
          description: |
            ÇAĞIRANIN bu girdide yapabildikleri, miras hesaplandıktan sonra (ADR-0021).

            Satır başına, klasör başına değil, ve bunun bir maliyeti var: bir sayfa çizmek, o
            sayfadaki her girdi için ata zincirini yürümek demek. Yine de satır başına, çünkü
            alternatifi arayüzün klasörün iznine bakıp her satıra aynı düğmeleri koyması ve alt
            klasöre dar bir grant konmuş satırda o düğmenin 403 alması — yani sunucunun
            reddedeceği bir şeyi teklif eden bir arayüz.

            Sunucu bunu sayfa başına TEK ata yürüyüşüyle hesaplar: aynı klasördeki satırların
            atası ortak, ve yalnız kendi grant'ı olan satırlar ek iş çıkarır.
          items: { $ref: '#/components/schemas/FolderPermission' }
        id: { type: string, format: uuid }
        parentId:
          type: [string, 'null']
          format: uuid
        name: { type: string }
        kind:
          type: string
          enum: [file, folder]
        size: { type: integer, format: int64 }
        childCount:
          type: integer
          description: |
            Klasorun DOGRUDAN cocuk sayisi; en fazla 1000'e kadar sayilir, o yuzden 1000 gorenen
            ekran "1000+" yazmali. Yalniz klasor listelemesinde ve yalniz klasor satirlarinda
            geliyor: dosyada ve arama sonuclarinda alan hic yok, cunku "sifir" ile "sorulmadi"
            farkli iki sey.
        modifiedAt: { type: string, format: date-time }
        mimeType: { type: string }
        trashedAt:
          type: string
          format: date-time
          description: Yalnız çöp listesinde. Yoksa girdi çöpte değil.
        expiresAt:
          type: string
          format: date-time
          description: |
            Bu girdinin kalıcı olarak silineceği an: `trashedAt` + saklama süresi.

            Saklama politikası kapalıysa YOK, ve yokluğu "süresiz" demek. Bir tarih göstermek,
            sonra o tarihte hiçbir şey olmaması, çöp kutusunun tutmadığı bir söz olurdu.

            KENDİ ÜST DÜZEYİNDE olmayan bir girdi de yok: çöpe atılmış bir klasörün içindeki
            dosya, kendi tarihinde değil, kökünün tarihinde gider. Kendi tarihini göstermek,
            temizlemenin uymadığı bir geri sayım göstermek olurdu.

    FileEntryDetail:
      allOf:
        - $ref: '#/components/schemas/FileEntry'
        - type: object
          properties:
            createdAt: { type: string, format: date-time }
            ownerId: { type: string, format: uuid }
            checksum:
              type: string
              description: Sunucu tarafı kanonik digest.
            effectivePermissions:
              type: array
              items: { $ref: '#/components/schemas/Permission' }

    FileEntryPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FileEntry' }
        nextCursor: { type: string }
        total:
          type: integer
          description: |
            Bu klasordeki gorunen oge sayisi -- sayfanin degil, KLASORUN. Ekranin altindaki sayac
            "200+" diyordu ve o "+" bir tahmin degil, bilginin yokluguydu.

            Sozlesmenin "toplam yok" kurali SUZULMEMIS bir toplamla ilgiliydi: gorulemeyen
            satirlarin varligini sizdiran bir sayi. Bu, kullanicinin zaten sayfa sayfa
            gezebilecegi listenin uzunlugu, ve klasoru listeleme izni cagriden once soruluyor.

            Yalniz klasor listelemesinde var; arama ve cop listeleri sayfa sayfa gezilen seyler
            degil.
        hasMore:
          type: boolean
          description: |
            Toplam sayı bilerek yok. Filtrelenmemiş bir sayaç, kiracının göremediği
            satırların varlığını sızdırır.

    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        shareId:
          type: [string, 'null']
          format: uuid
          description: |
            ÜST DÜZEY bir klasörün hangi paylaşımda açılacağı. `parentId` verildiğinde yok sayılır:
            üst klasör paylaşımı zaten belirliyor ve iki cevap bir fazla olurdu. Verilmezse
            kiracının varsayılanı.
        parentId: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/FileName' }

    UpdateFileRequest:
      type: object
      minProperties: 1
      description: |
        Yeniden adlandırma ve taşıma tek uçta, çünkü ikisi de aynı satırın aynı iki kolonu:
        `name` ve `parent_id`. Dosya sistemi tarafında da tek bir rename(2) çağrısı.

        Taşıma AYNI PAYLAŞIM içinde. Paylaşımlar arası taşıma bir rename DEĞİL — ölçüldüğü üzere
        dataset'ler arası rename(2) EXDEV veriyor (ADR-0008) — ve kopyala+sil işine dönüşmesi
        gerekir; o iş /file-operations'ın konusu ve henüz yazılmadı. Başka bir paylaşımın
        klasörüne taşıma isteği 409 döner, sessizce yanlış yere koymaz.
      properties:
        name: { $ref: '#/components/schemas/FileName' }
        parentId:
          type: [string, 'null']
          format: uuid
          description: null, paylaşımın köküne taşır.

    RenameRequest:
      deprecated: true
      description: UpdateFileRequest ile değiştirildi. Üretilmiş istemcilerin kırılmaması için duruyor.
      type: object
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/FileName' }

    FileOperationRequest:
      type: object
      required: [operation, sourceIds, destinationId]
      properties:
        operation:
          type: string
          enum: [move, copy, restore]
          description: |
            Şu an yalnız `copy` uygulanıyor. `move` için `PATCH /files/{id}`, `restore` için
            `POST /files/{id}/restore`; ikisi de burada 422 döner.
        sourceIds:
          type: array
          minItems: 1
          maxItems: 10000
          items: { type: string, format: uuid }
        destinationId:
          type: string
          format: uuid
          nullable: true
          description: Hedef klasör. `null`, paylaşımın kökü demek.
        conflictPolicy:
          type: string
          enum: [replace, keep_both, version, skip]
          default: keep_both
          description: |
            Şu an yalnız `keep_both` uygulanıyor; diğerleri 422 ile reddediliyor. Neden
            reddedildikleri uç noktanın açıklamasında.

    JobRef:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string, format: uuid }

    Job:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        status:
          type: string
          enum: [queued, running, succeeded, failed, dead]
          description: |
            dead, max_attempts aşıldığında verilir ve sessizce kaybolmaz — sistem alarmı
            üretir (ADR-0003).
        progress: { type: number, minimum: 0, maximum: 1 }
        createdAt: { type: string, format: date-time }
        error: { $ref: '#/components/schemas/ProblemDetails' }

    JobPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Job' }

    Telemetry:
      type: object
      required: [pools, cpu, memory]
      properties:
        pools:
          type: array
          items: { $ref: '#/components/schemas/PoolStatus' }
        cpu:
          type: object
          properties:
            loadAverage:
              type: array
              items: { type: number }
            temperatureCelsius: { type: number }
        memory:
          type: object
          properties:
            totalBytes: { type: integer, format: int64 }
            usedBytes: { type: integer, format: int64 }
        disks:
          type: array
          description: |
            Ajanın `ReadSmartSummary` işleminden. Hangi disklerin sorulacağı yapılandırmadan
            gelir, keşiften değil — havuz adlarıyla aynı gerekçe: ajanın işlem kümesi kapalı ve
            içinde "diskleri listele" yok, eklemek Rust tarafındaki sözleşmeyi değiştirmek demek.
          items: { $ref: '#/components/schemas/DiskStatus' }

    PoolStatus:
      type: object
      required: [name, health, used, available]
      properties:
        name: { type: string }
        health:
          type: string
          # İlk altısı zpoolprops(7)'nin `health` özelliği için saydığı değerler. Enum bunlardan
          # ikisini (REMOVED, OFFLINE) kaçırıyordu: ajan `zpool list -H -o health` çıktısını ham
          # geçiriyor, yani diski çekilmiş bir havuz enum dışında bir değer yayar ve üretilmiş her
          # istemcinin doğrulaması kırılırdı.
          #
          # SUSPENDED özellik belgesinde geçmiyor ama pratikte bildiriliyor (bağlantısı kopmuş bir
          # havuz G/Ç'yi donduğunda). Dışarıda bırakmak, gerçekten ciddi bir durumu UNKNOWN olarak
          # göstermek olurdu.
          #
          # UNKNOWN, API'nin tanımadığı bir değeri ASLA uydurmaması içindir. Bilinmeyen bir
          # dizgiyi ONLINE'a çevirmek, operatöre yanlış yeşil göstermenin en kısa yolu.
          enum: [ONLINE, DEGRADED, FAULTED, OFFLINE, REMOVED, UNAVAIL, SUSPENDED, UNKNOWN]
        used: { type: integer, format: int64 }
        available: { type: integer, format: int64 }
        usedBySnapshots: { type: integer, format: int64 }
        scrubState: { type: string }

    Note:
      type: object
      required: [id, title, body, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 65536 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NotePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Note' }

    CreateNoteRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 65536 }

    UpdateNoteRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 65536 }

    Task:
      type: object
      required:
        [
          id,
          body,
          description,
          status,
          priority,
          assigneeId,
          doneAt,
          position,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        body: { type: string, maxLength: 2000 }
        description:
          type: [string, 'null']
          maxLength: 10000
          description: |
            İşin yönergesi (0038). Gövde tek satırlık ad; bu, iş açıldığında altında duran uzun
            açıklama — "nasıl yapılacak, nelere dikkat edilecek". Yorum bir konuşma, bu işin
            kendisinin parçası.
        status:
          type: string
          enum: [draft, assigned, in_progress, in_review, done, cancelled]
          description: |
            §7'nin durum makinesi. `doneAt` KALDIRILMADI ve bu bir tereddüt değil: durum "ne
            olduğu", `doneAt` "ne zaman olduğu", ve ikincisinin cevabı birinciden türetilemez.
            Şema ikisinin ANLAŞMASINI zorluyor — `done` olmayan bir görevde `doneAt` dolu olamaz.

            Geçişler `İncelemede → DevamEdiyor` dahil serbest bırakılmadı; izinli olanlar
            `TaskStatusTransitionRefused` ile reddediliyor. Sunucu tarafında zorlanmasının sebebi,
            bir durum makinesinin yalnız arayüzde yaşadığında bir durum makinesi olmaması.
        priority:
          type: string
          enum: [low, normal, high, urgent]
        dueAt:
          type: [string, 'null']
          format: date-time
          description: |
            Tarih değil ZAMAN DAMGASI. "Yarın" bir zaman diliminde yarın, başkasında bugün; bir
            son tarihin hangi ana denk geldiği, gecikmiş olup olmadığını belirleyen şeyin ta
            kendisi.
        parentId:
          type: [string, 'null']
          format: uuid
          description: |
            Parçası olduğu iş. TEK SEVİYE: bir alt görevin kendi alt görevi olamıyor, ve bunu
            veritabanındaki `tasks_one_level_deep` tetikleyicisi tutuyor — keyfi derinlikte bir
            ağaç, bir yapılacaklar panosunu bir dosya yöneticisine çevirir.

            Üst işi silmek parçalarını da siliyor. Arayüz silmeden önce kaç parçanın gideceğini
            söylüyor; sessiz bir kaskat, veri kaybının en sık biçimi.
        subtaskDone:
          type: integer
          description: Kaç parçası kapandı (`done` ya da `cancelled`). Parçası yoksa 0.
        subtaskTotal: { type: integer }
        checklistDone: { type: integer }
        checklistTotal: { type: integer }
        tags:
          type: array
          description: Bu işin etiketleri, ada göre. `uses` burada YOK — satırda görünen şey ad ve renk.
          items: { $ref: '#/components/schemas/Tag' }
        linkedFileCount:
          type: integer
          description: |
            Bu görevin ÇAĞIRANIN GÖREBİLDİĞİ kaç dosyaya bağlı olduğu. Toplam sayı değil, ve fark
            §7'nin kuralı: görev erişimi gizli dosya erişimi vermemeli. Göremediği bir dosyanın
            varlığını sayıdan çıkarmak da bir sızıntı olurdu.
        # Atanmamış bir iş gerçek bir durum: "birinin yapması lazım". Oluştururken bir isim
        # dayatmak, paylaşımlı listelerin kullanılmaz hâle gelme biçimidir.
        assigneeId: { type: [string, 'null'], format: uuid }
        assigneeUsername: { type: [string, 'null'] }
        # Boolean değil zaman damgası. "Bitti" ile "dün 14:02'de bitti" aynı yeri kaplıyor ve
        # ikincisi birincisinin cevaplayamadığı soruları cevaplıyor.
        doneAt: { type: [string, 'null'], format: date-time }
        position: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TaskPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Task' }

    TaskFileLink:
      type: object
      required: [id, fileEntryId, name, kind, path, shareId, linkedAt]
      properties:
        id: { type: string, format: uuid }
        fileEntryId: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [file, folder] }
        path: { type: string }
        shareId: { type: string, format: uuid }
        linkedBy: { type: [string, 'null'] }
        linkedAt: { type: string, format: date-time }

    TaskFileLinkPage:
      type: object
      required: [items, hidden]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskFileLink' }
        hidden:
          type: integer
          description: |
            Bu görevde bağlı olup ÇAĞIRANIN GÖREMEDİĞİ dosya sayısı.

            Sayının kendisi bildiriliyor ama dosyalar hakkında hiçbir şey bildirilmiyor — ne ad,
            ne yol, ne paylaşım. Sebep: sıfır göstermek "burada başka bir şey yok" demek olurdu
            ve bu yanlış; sayıyı gizlemek de bir görevi eksik gösterip kimsenin sormayacağı bir
            boşluk bırakırdı. Sayı, "buraya bakman gereken bir şey var, ama sana değil"
            cümlesinin en az bilgi sızdıran hâli.

    LinkTaskFileRequest:
      type: object
      required: [fileEntryId]
      properties:
        fileEntryId: { type: string, format: uuid }

    TaskActivity:
      type: object
      required: [id, field, at]
      properties:
        id: { type: string, format: uuid }
        actorUsername: { type: [string, 'null'] }
        field:
          type: string
          enum:
            [
              status,
              priority,
              due_at,
              assignee_id,
              body,
              description,
              file_link,
              comment,
              parent_id,
              checklist,
              tag,
            ]
          description: |
            `comment` yalnız bir yorumun SİLİNMESİ için düşüyor, eklenmesi için değil: yorum
            listesinin kendisi eklendiğinin kaydı, ve iki yere yazmak iki farklı doğruluk kaynağı
            demek. Kaybolan şeyin izi ise başka hiçbir yerde kalmıyor — `oldValue` silinen gövdenin
            ilk 200 karakteri, `newValue` null.
        oldValue: { type: [string, 'null'] }
        newValue: { type: [string, 'null'] }
        at: { type: string, format: date-time }

    TaskActivityPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskActivity' }

    TaskLogEntry:
      allOf:
        - { $ref: '#/components/schemas/TaskActivity' }
        - type: object
          required: [taskId, taskBody]
          properties:
            taskId: { type: string, format: uuid }
            taskBody: { type: string, maxLength: 2000 }

    TaskLogPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskLogEntry' }

    CreateTaskRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
        assigneeId: { type: [string, 'null'], format: uuid }
        parentId:
          type: [string, 'null']
          format: uuid
          description: Verilirse iş bunun parçası olarak doğuyor. Tek seviye; bkz. `Task.parentId`.

    UpdateTaskRequest:
      type: object
      minProperties: 1
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
        description: { type: [string, 'null'], minLength: 1, maxLength: 10000 }
        assigneeId: { type: [string, 'null'], format: uuid }
        # `done` KALDI ve `status` ile birlikte gönderilemez. Eski istemciler onu kullanıyor ve
        # ikisini aynı istekte kabul etmek "hangisi kazanır" sorusunu doğurur — cevabı olan ama
        # kimsenin bilmediği bir soru. `done: true` → `status: done`, `done: false` → `assigned`
        # ya da `draft`, atanan varsa birincisi.
        done: { type: boolean }
        status:
          type: string
          enum: [draft, assigned, in_progress, in_review, done, cancelled]
        priority: { type: string, enum: [low, normal, high, urgent] }
        dueAt: { type: [string, 'null'], format: date-time }
        position: { type: number }

    Tag:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 40 }
        color:
          type: string
          enum: [iris, mint, cyan, amber, rose, slate]
          description: |
            SABİT BİR PALET, serbest bir hex alanı değil. Karanlık zemine karşı görünmeyen bir
            etiket, olmayan bir etiket — ve serbest renk, arayüzü birkaç hafta içinde okunmaz kılar.
        uses:
          type: integer
          description: Kaç işte kullanıldığı. Yalnız `GET /tags` dolduruyor; bir işin çipinde yok.

    TagPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Tag' }

    CreateTagRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        color: { type: string, enum: [iris, mint, cyan, amber, rose, slate] }

    UpdateTagRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        color: { type: string, enum: [iris, mint, cyan, amber, rose, slate] }

    ChecklistItem:
      type: object
      required: [id, body, doneAt, doneByUsername]
      properties:
        id: { type: string, format: uuid }
        body: { type: string, maxLength: 500 }
        doneAt: { type: [string, 'null'], format: date-time }
        doneByUsername:
          type: [string, 'null']
          description: Kim tikledi. Hesap kapandıysa null; madde kalıyor.

    ChecklistPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ChecklistItem' }

    ChecklistItemRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 500 }

    TaskComment:
      type: object
      required: [id, authorUsername, body, deleted, editedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        authorUsername:
          type: [string, 'null']
          description: Hesap silindiyse null; yorum kalıyor, çünkü yorum işin bilgisi.
        body:
          type: string
          maxLength: 4000
          description: Silinmiş bir yorumda BOŞ. `deleted` ile birlikte okunuyor.
        deleted: { type: boolean }
        editedAt:
          type: [string, 'null']
          format: date-time
          description: |
            null = hiç düzenlenmedi. Arayüz farkı söylüyor: sonradan değişmiş bir cümleyi hiç
            değişmemiş gibi göstermek, alıntılanabilir olmayan bir kayıt üretir.
        createdAt: { type: string, format: date-time }

    TaskCommentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskComment' }

    TaskCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }

    TaskWatcher:
      type: object
      required: [userId, username, source, since]
      properties:
        userId: { type: string, format: uuid }
        username: { type: [string, 'null'] }
        source:
          type: string
          enum: [manual, created, assigned, commented]
          description: |
            Kendi mi seçti, yoksa bir eylem yüzünden mi eklendi. Bugün ikisi de aynı davranıyor;
            ayrım, kaybolmaması için taşınıyor.
        since: { type: string, format: date-time }

    TaskWatcherPage:
      type: object
      required: [items, watching]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskWatcher' }
        watching:
          type: boolean
          description: |
            Çağıranın kendi durumu. Listeden türetilmek yerine ayrı bir alan: arayüzün sorduğu soru
            "ben izliyor muyum", ve onu her istemcinin listede kendini araması gerekmiyor.

    Notification:
      type: object
      required: [id, kind, title, readAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum:
            [
              task.assigned,
              task.unassigned,
              task.status,
              task.due,
              task.overdue,
              task.comment,
              task.mention,
            ]
        taskId: { type: [string, 'null'], format: uuid }
        taskBody:
          type: [string, 'null']
          description: |
            İşin ŞU ANKİ gövdesi, `title` ise o AN üretilmiş cümle. İkisi birden var çünkü ikisi
            farklı soruları cevaplıyor: "ne olmuştu" ve "o iş şimdi ne durumda".
        title: { type: string, maxLength: 300 }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    NotificationPage:
      type: object
      required: [items, unread]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        unread:
          type: integer
          description: |
            Okunmamış TOPLAM sayı — `items` filtrelenmiş ya da kırpılmış olsa bile. Zilin
            gösterdiği sayı bu, ve listenin uzunluğundan türetilemez.

    MarkNotificationsReadRequest:
      type: object
      properties:
        ids:
          type: array
          maxItems: 200
          items: { type: string, format: uuid }
          description: Verilmezse hepsi işaretleniyor.

    NotificationsRead:
      type: object
      required: [marked, unread]
      properties:
        marked: { type: integer }
        unread: { type: integer }

    Preferences:
      type: object
      description: |
        Arayüz tercihleri. Şema BİLEREK dar: sunucu bu belgeyi doğruluyor ve tanımadığı bir alan
        reddediliyor. Doğrulanmayan bir jsonb kolonu, biri okuyana kadar bozuk durumun biriktiği
        yerdir; arayüz her değiştiğinde bir migration yazmamak için jsonb seçildi, sınırsız çöp
        kabul etmek için değil.
      properties:
        background:
          type: object
          required: [kind]
          additionalProperties: false
          description: |
            `kind` ne olduğunu, diğer iki alan hangisi olduğunu söyler ve BOŞ BIRAKILAMAZLAR:
            `solid` ise `preset`, `file` ise `fileId` zorunlu. Şema bunu tek başına ifade
            edemiyor (oneOf ile edilebilirdi ama üretilmiş istemciyi okunmaz hâle getirirdi),
            o yüzden burada yazılı: eksik bırakan istek 422 alır.

            `fileId` çöpteki bir kayda ya da bir klasöre işaret edemez — arayüzün her açılışta
            404 veren bir arka plan istemesi, sessizce bozuk bir tercihtir.
          properties:
            kind:
              type: string
              # `sky` çizilen galaksi; `solid` düz bir gradyan; `file` kullanıcının kendi
              # yüklediği görsel — bir dosya kimliği, bir URL değil, çünkü baytlar zaten
              # /files/{id}/content üzerinden ve aynı yetkiyle geliyor.
              enum: [sky, solid, file]
            preset: { type: string, maxLength: 32 }
            fileId: { type: string, format: uuid }
        sound: { type: boolean }
        shortcuts:
          type: array
          maxItems: 60
          items:
            type: object
            required: [id, cell]
            additionalProperties: false
            properties:
              id: { type: string, maxLength: 128 }
              label: { type: string, maxLength: 64 }
              cell: { type: integer, minimum: 0, maximum: 999 }
        favorites:
          type: array
          maxItems: 40
          description: |
            Dosya gezgininde hizli erisim seridinde duran klasorler.

            KISAYOLLARDAN AYRI BIR ALAN, ve ayri olmasi zorunlu: `shortcuts` masaustu izgarasidir
            ve her girdisinin zorunlu bir hucresi var. Bir favoriyi oraya sikistirmak, masada
            gorunmeyen ama dolu duran bir hucre birakirdi.

            IZ TAM OLARAK SAKLANIYOR (`trail`), yalniz klasorun kimligi degil. Gezgin bir konuma
            iz uzerinden gidiyor; yalniz kimlik saklansaydi favoriye tiklamak once klasorun
            atalarini bulmak icin ayri istekler gerektirirdi. Iz ayni zamanda kirinti yolunun
            kendisi, yani favoriden gidilen yerde "nerede oldugunu" gosteren cizgi de dogru olur.

            AD BIR ONBELLEK. Klasor yeniden adlandirilirsa serit eski adi gosterir; bir sonraki
            aciliste duzeliyor. Yazarken klasorun VARLIGI DOGRULANMIYOR -- duvar kagidi alaninin
            hatasi tam olarak buydu: var olmayan bir kimlik butun tercih yazmalarini kalici olarak
            reddettirmisti.
          items:
            type: object
            required: [id, name, trail]
            additionalProperties: false
            properties:
              id: { type: string, format: uuid }
              name: { type: string, maxLength: 255 }
              trail:
                type: array
                maxItems: 24
                items:
                  type: object
                  required: [id, name]
                  additionalProperties: false
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string, maxLength: 255 }
      additionalProperties: false

    Transfer:
      type: object
      required: [id, filename, lengthBytes, offsetBytes, state, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        lengthBytes: { type: integer, format: int64 }
        offsetBytes: { type: integer, format: int64 }
        state:
          type: string
          enum: [active, stalled, completed]
          description: |
            `stalled`, sunucunun bir yargısı: son yazmadan bu yana bir dakikadan fazla geçmiş bir
            yükleme. Tarayıcı sekmesi kapandığında yükleme "bitmiş" görünmesin diye var — bir
            aktarım listesinin en çok işe yaradığı an, bir aktarımın durduğu andır.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TransferPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transfer' }

    ReplicateRequest:
      type: object
      required: [source, snapshot, target, confirm, password]
      properties:
        source: { type: string, maxLength: 255 }
        snapshot: { type: string, maxLength: 63 }
        target:
          type: string
          maxLength: 255
          description: Hedefteki veri YOK EDİLİYOR. Paylaşım kökü ve altı ajan tarafından reddedilir.
        base:
          type: [string, 'null']
          maxLength: 63
          description: |
            Artımlı gönderim için iki tarafın da sahip olduğu anlık görüntü. Verilmezse TAM
            gönderim. Hedef bu tabanı tutmuyorsa ajan reddediyor ve tam gönderim gerektiğini
            söylüyor — kendiliğinden tam gönderime düşmüyor, çünkü bir terabaytı taşımak bir karar.
        confirm:
          type: string
          description: HEDEFİN adı, birebir. Yok edilen şeyin adı yazılıyor.
        password:
          type: string
          maxLength: 1024
          description: §0.5 yeniden kimlik doğrulama. Girişle aynı kısıtlamaya tabi ve aynı yere kaydediliyor.

    RemotePeer:
      type: object
      required: [address, role, version, latencyMs, direct]
      properties:
        address: { type: string, description: On altılık haneli düğüm adresi. }
        role: { type: string, description: '`LEAF`, `PLANET` ya da `MOON`.' }
        version: { type: string }
        latencyMs:
          type: [integer, 'null']
          description: |
            Gidiş dönüş, milisaniye. **null = henüz ölçülmedi.** ZeroTier bunu -1 olarak yazıyor ve
            ajan onu null'a çeviriyor: "-1 ms" yazan bir ekran, hiç yapılmamış bir ölçümü kötü bir
            ölçüm gibi gösterirdi.
        direct:
          type: boolean
          description: |
            Doğrudan bir yol var mı, yoksa her bayt bir kök üzerinden mi aktarılıyor. Yavaş bir
            bağlantının cevabı neredeyse her zaman burada.

    RemotePeerPage:
      type: object
      required: [available, items]
      properties:
        available:
          type: boolean
          description: ZeroTier bu kutuda çalışıyor mu. false ise liste boş ve bu bir arıza değil.
        items:
          type: array
          items: { $ref: '#/components/schemas/RemotePeer' }

    Snapshot:
      type: object
      required: [id, dataset, name, fullName, createdAt, state]
      properties:
        id:
          type: [string, 'null']
          format: uuid
          description: |
            DEPSIS'in kaydındaki kimlik. `state: unmanaged` olan bir satırda **null**: o görüntü
            havuzda var ama DEPSIS'in onun için bir satırı yok, ve uydurulmuş bir kimlik istemciye
            gerçek olmayan bir tutamak verirdi.
        dataset: { type: string }
        name: { type: string }
        fullName: { type: string }
        createdBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        state:
          type: string
          enum: [present, missing, unmanaged, unknown]
          description: |
            Kayıt ile HAVUZUN karşılaştırılması. Üçü de okuyanın yapacağı şeyi değiştiriyor:

            * `present` — kayıtta var, havuzda var. Güvenilir bir geri dönüş noktası.
            * `missing` — kayıtta var, havuzda YOK. Kabuktan silinmiş; geri dönülemez. Bu satırın
              var olması, listenin bir zamanlar sessizce yalan söylediği durumun ta kendisi.
            * `unmanaged` — havuzda var, kayıtta yok. Kabuktan alınmış.
            * `unknown` — ajana ulaşılamadı, karşılaştırma yapılamadı. Kayıtlı satırları `missing`
              göstermek, ajanı bir dakikalığına düşmüş bir kutuda bütün yedekleri silinmiş gibi
              göstermek olurdu.
        usedBytes:
          type: integer
          format: int64
          description: |
            Bu görüntüyü silmenin GERÇEKTEN boşaltacağı yer, havuzdan okunmuş. Yalnız havuzda
            bulunan satırlarda var.

            İçerdiği veri DEĞİL: ZFS bir görüntüye yalnız artık canlı dosya sisteminden ya da daha
            yeni bir görüntüden referans verilmeyen blokları yazıyor, yani hiçbir şeyin değişmediği
            bir terabaytlık görüntü neredeyse sıfır tutuyor. Kaydedilmiyor da: rakam zamanla
            değişiyor, ve alındığı andaki bir sayı bir hafta sonra yanlış olurdu.

    SnapshotPage:
      type: object
      required: [items, complete]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Snapshot' }
        complete:
          type: boolean
          description: |
            Liste havuzla KARŞILAŞTIRILDI mı.

            Bu alan bir zamanlar "her zaman false" diyordu, çünkü ajanda anlık görüntüleri
            listeleyecek bir işlem yoktu ve liste DEPSIS'in kendi kaydından ibaretti. Artık
            `list_snapshots` var: true olduğunda her satırın `state`'i havuza sorularak
            doldurulmuş demek, ve havuzda olup kayıtta olmayanlar da listede.

            false, yalnız ajana ulaşılamadığında. O durumda her `state` `unknown`, ve istemcinin
            bunu söylemesi gerekiyor — sessizce eski davranışa dönmek, doğrulanmamış bir listeyi
            doğrulanmış gibi göstermek olurdu.

    CreateSnapshotRequest:
      type: object
      required: [dataset]
      properties:
        dataset: { type: string, minLength: 1, maxLength: 255 }
        name:
          type: string
          maxLength: 63
          pattern: '^[A-Za-z0-9_][A-Za-z0-9._-]{0,62}$'
          description: Yoksa sunucu zaman damgasından üretir.

    DiskStatus:
      type: object
      required: [id, healthy]
      properties:
        id:
          type: string
          description: |
            /dev/disk/by-id altındaki kararlı ad. `/dev/sdX` DEĞİL — ajan onu yapı gereği
            reddediyor, çünkü sdX yeniden başlatmada başka bir diski gösterebilir (risk R1).
        healthy: { type: boolean }
        temperatureCelsius: { type: integer }
        label:
          type: string
          maxLength: 64
          description: |
            Kullanicinin bu diske verdigi ad. Yan sutundaki listenin isi, diski yuvasindan
            cekecek insana onu TANITMAK -- ve bunu en iyi yapan sey kisinin kendi koydugu ad.

    StorageSetup:
      type: object
      required: [pools, shareRoot]
      properties:
        pools:
          type: array
          items: { type: string }
          description: Kutudaki havuzlar. `DEPSIS_ZFS_POOLS` yazılıysa yalnız oradakiler.
        shareRoot: { $ref: '#/components/schemas/ShareRoot' }
        parentDataset:
          type: string
          description: |
            Yeni paylaşımların altında açılacağı veri kümesi. `DEPSIS_SHARE_PARENT_DATASET`
            yazılıysa o, yoksa paylaşım kökünde bağlı olan. Yoksa `POST /shares` 503 veriyor.

    ShareRoot:
      type: object
      required: [empty]
      properties:
        path:
          type: string
          description: |
            Ajanın `DEPSIS_SHARES_ROOT`'u. Çağıran bir dizin adlandıramıyor — bu alan ajanın
            kendi yapılandırmasından geliyor.
        dataset:
          type: string
          description: |
            Tam olarak oraya bağlı veri kümesi. **Tam olarak**, "içeren" değil: `/srv`'e bağlı bir
            veri kümesi `/srv/depsis`'i tutan değildir, ve öyle saymak paylaşım ağacını kurulmuş
            gibi gösterirdi.
        empty:
          type: boolean
          description: |
            Dizinde hiç girdi var mı. Bildiriliyor, çünkü `zfs create -o mountpoint=X` X'in
            üstüne şikâyet etmeden bağlanıyor: altındaki her şey görünmez oluyor, silinmeden,
            diski işgal etmeye devam ederek.

    ProcessRow:
      type: object
      required: [pid, user, comm, args, rssBytes, protected]
      properties:
        pid: { type: integer }
        user: { type: string }
        comm: { type: string }
        args: { type: string }
        rssBytes: { type: integer, format: int64 }
        protected:
          type: boolean
          description: Sistem süreci — kapatılamaz, arayüz düğme çizmez.

    ProcessPage:
      type: object
      required: [items, truncated]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProcessRow' }
        truncated: { type: boolean }

    KillProcessRequest:
      type: object
      required: [pid, comm]
      properties:
        pid: { type: integer }
        comm: { type: string, description: Sinyalden önce /proc'tan yeniden doğrulanan ad. }

    DiskWipeRequest:
      type: object
      required: [byId, wwn, confirm, password]
      properties:
        byId: { type: string, description: '`/dev/disk/by-id` adı, envanterden.' }
        wwn:
          type: string
          description: Onaylanan diskin WWN'i. Ajan silme anında yeniden okuyup karşılaştırır.
        confirm:
          type: string
          enum: ['SİL']
          description: Yazılı onay. Havuz sihirbazı havuzun adını yazdırır; bir by-id adı yazdırmak insanlık dışı olurdu.
        password: { type: string }

    DiskWipeResult:
      type: object
      required: [detail]
      properties:
        detail: { type: [string, 'null'], description: wipefs'in sildiği imzaların dökümü. }

    UpdateApplyRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: |
            Oturumdaki yöneticinin parolası. Yazılı onay sözcüğü YOK, ve bu bir gevşeme değil:
            §8.1'in onay sözcüğü, geri alınamayan bir işlemin hangi NESNEYE uygulandığını
            yazdırmak içindir (havuzun adı, diskin adı). Güncellemenin nesnesi yok, geri alması
            var — ve tehlikesi yanlış şeyi seçmek değil, kök yetkiyle koşan kodu değiştirmek.
            Ona karşı doğru kapı parola.

    UpdateCandidate:
      type: object
      required: [commit, subject, committedAt]
      properties:
        commit:
          type: string
          description: |
            Commit kimliği. DEPSIS'in sürüm kavramı bu: kutuya kurulan şey deponun bir anıdır.
            Etiketli ve imzalı bir sürüm akışı henüz yok — bkz. bilinen sınırlamalar §2.7.
        subject:
          { type: [string, 'null'], description: Commit başlığının ilk satırı, yorumlanmadan. }
        committedAt: { type: [string, 'null'] }

    UpdateStatus:
      type: object
      required:
        [
          installed,
          available,
          phase,
          inProgress,
          upToDate,
          checkedAt,
          startedAt,
          finishedAt,
          error,
          logTail,
          signed,
        ]
      properties:
        installed:
          type: [string, 'null']
          description: |
            Kurulu commit. YOK olabilir: güncelleme yolundan önce kurulmuş bir kutu kendi
            sürümünü bilmez. Yokluk "güncel" diye okunmaz — bilinmeyen bir sürüm, karşılaştırmayı
            her zaman "farklı" yapar.
        available:
          type: [object, 'null']
          required: [commit, subject, committedAt]
          properties:
            commit: { type: string }
            subject: { type: [string, 'null'] }
            committedAt: { type: [string, 'null'] }
          description: Son denetimin bulduğu sürüm. Hiç denetim yapılmadıysa yok.
        phase:
          type: string
          description: |
            Güncelleyicinin kendi yazdığı faz, yorumlanmadan: `idle`, `checking`,
            `downloading`, `installing`, `rolling_back`, `done`, `failed`.
        inProgress:
          type: boolean
          description: |
            `phase` ile systemd'nin cevabının BİRLEŞİMİ. Tanınmayan bir faz KOŞUYOR sayılır:
            bilinmezlikte doğru davranış, ikinci bir güncellemeye izin vermemektir.
        upToDate:
          type: boolean
          description: Kurulu sürüm ile bulunan sürüm aynı mı. İkisinden biri bilinmiyorsa `false`.
        checkedAt: { type: [string, 'null'] }
        startedAt: { type: [string, 'null'] }
        finishedAt: { type: [string, 'null'] }
        error:
          type: [string, 'null']
          description: |
            Son başarısızlığın cümlesi. `phase` `failed` değilken de dolu olabilir: geri alınmış
            bir güncellemenin sebebi, kutu yeniden çalışır hâle geldikten sonra da okunmalıdır.
        logTail:
          type: array
          items: { type: string }
          description: Güncelleyicinin günlüğünün son satırları — uzun bir kurulumun "hâlâ yaşıyor" kanıtı.
        signed:
          type: boolean
          description: |
            Kutu İMZALI kipte mi: yalnız yayınlanmış ve imzalanmış sürümleri mi kuruyor. Kipi
            belirleyen şey cihazdaki açık anahtarın varlığı (`deploy/release/README.md`).
            Bilinmiyorsa `false` — güvenin kaynağı hakkında ekranda duran bir yalan, hiç bilgi
            vermemekten kötüdür.

    LicenseInstallRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
          maxLength: 4096
          description: 'Satıcıdan alınan lisans anahtarı: `DEPSIS-1.<içerik>.<imza>`.'

    LicenseStatus:
      type: object
      required:
        [state, licensedTo, licenseId, plan, issuedAt, expiresAt, installedAt, deviceId, detail]
      properties:
        state:
          type: string
          enum: [valid, expired, absent, invalid, unconfigured]
          description: |
            DÖRT DURUM DEĞİL BEŞ, ve hepsi ayrı: `valid` geçerli, `expired` süresi dolmuş,
            `absent` hiç kurulmamış, `invalid` kurulu ama doğrulanamıyor (kurcalanmış satır),
            `unconfigured` bu cihazda doğrulama anahtarı yok. Sonuncu ikisini `absent` ile
            birleştirmek, kurcalanmış bir satırı hiç kurulmamış bir lisanstan ayırt edilemez
            yapardı.
        licensedTo: { type: [string, 'null'] }
        licenseId: { type: [string, 'null'] }
        plan: { type: [string, 'null'] }
        issuedAt: { type: [string, 'null'] }
        expiresAt:
          type: [string, 'null']
          description: '`null` SÜRESİZ demek. Hiç dolmayacak bir tarih yazmak, o tarihe gelindiğinde açıklanamayan bir arıza üretir.'
        installedAt: { type: [string, 'null'] }
        deviceId:
          type: [string, 'null']
          description: |
            Bu CİHAZIN kodu, `XXXX-XXXX-XXXX`. Bir lisansı tek cihaza bağlamak için satıcıya
            iletilen değer. `/etc/machine-id`den TÜRETİLMİŞ, onun kendisi değil: makine kimliği
            sistem genelinde bir parmak izidir ve olduğu gibi paylaşılmamalı.

            KURULUM başına, donanım başına değil — diski değişen bir NAS lisansını kaybetmez,
            yeniden KURULAN bir kutu ise yeni bir bağ ister.
        detail:
          type: [string, 'null']
          description: Doğrulamanın kendi cümlesi. `invalid` ve `unconfigured` dışında boş.

    TlsStatus:
      type: object
      required: [subject, issuer, notBefore, notAfter, fingerprint, names, selfSigned]
      properties:
        subject: { type: string }
        issuer: { type: string }
        notBefore: { type: string }
        notAfter: { type: string }
        fingerprint:
          type: string
          description: |
            SHA-256, iki nokta ile ayrılmış. Kendinden imzalı bir sertifikada tarayıcının uyarı
            ekranında karşılaştırılacak TEK şey bu.
        names:
          type: array
          items: { type: string }
          description: 'SAN listesi, openssl’in yazdığı gibi: `DNS:nas.example.com`, `IP Address:192.168.1.10`.'
        selfSigned:
          type: boolean
          description: Konu ile veren aynı. Tarayıcı uyarısının sebebi bu.

    TlsCertificateRequest:
      type: object
      required: [certificate, privateKey, password]
      properties:
        certificate:
          type: string
          maxLength: 65536
          description: |
            PEM. Zincir de olabilir — ara sertifikalar sunulmazsa bazı istemciler bağlanamaz, ve
            operatörün elindeki dosya çoğunlukla zaten zincirdir.
        privateKey:
          type: string
          maxLength: 16384
          description: |
            PEM. ŞİFRELİ BİR ANAHTAR KABUL EDİLMİYOR: parolayı da istemek, o parolanın kutuda
            bir yerde durması demek olurdu, ve dosyanın kendisi zaten 0400 kök.
        password:
          type: string
          description: Oturumdaki yöneticinin parolası.

    ShareTreeRequest:
      type: object
      required: [pool]
      properties:
        pool:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_.:-]{0,62}$'
          description: Ağacın kurulacağı havuz. Kutuda olmayan bir ad 400 ile döner.

    BackupListing:
      type: object
      required: [entries, truncated]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/BackupEntry' }
        truncated:
          type: boolean
          description: |
            Dizin tek listelemeye sigmadi. Ekran bunu SOYLEMEK zorunda: kesilmis bir liste, eksik
            olanin var olmadigi gibi okunur.

    BackupEntry:
      type: object
      required: [name, directory, sizeBytes, modifiedAt]
      properties:
        name: { type: string }
        directory: { type: boolean }
        sizeBytes: { type: integer, format: int64 }
        modifiedAt: { type: string, format: date-time }

    RestoreFromBackupRequest:
      type: object
      required: [from, share, to]
      properties:
        from:
          type: array
          minItems: 1
          items: { type: string }
          description: Yedek agacindaki yol, bilesen bilesen.
        share:
          type: string
          description: Geri getirilecegi paylasim.
        to:
          type: array
          minItems: 1
          items: { type: string }
          description: Paylasim icindeki hedef yol, bilesen bilesen.

    ImportableBackupPools:
      type: object
      required: [pools]
      properties:
        pools:
          type: array
          items:
            type: object
            required: [name, state, needsAdopt]
            properties:
              name: { type: string }
              state:
                type: string
                description: |
                  ZFS'IN KENDI KELIMESI, cevrilmeden: `ONLINE`, `DEGRADED`, `FAULTED`, `UNAVAIL`.
                  `DEGRADED` bir havuzdan dosya kurtarilabilir ve `FAULTED` bir havuzdan cogu
                  zaman kurtarilamaz; ikisini "sorunlu" diye tek kelimeye indirmek, kullaniciya
                  yapabilecegi ile yapamayacagini ayirt ettirmemek olurdu.
              needsAdopt:
                type: boolean
                description: |
                  Havuz duzgun birakilmamis. Olen bir cihazdan cikan diskin olagan hali, ve
                  devralma kullanicinin gordugu bir uyarinin arkasinda olmali.

    AdoptBackupDiskRequest:
      type: object
      required: [pool, adopt]
      properties:
        pool: { type: string }
        adopt:
          type: boolean
          description: |
            `zpool import -f`. Ayni disk hala calisan baska bir cihazda takiliysa devralmak havuzu
            bozar; bu yuzden kullanicinin acikca onayladigi bir alan.

    AdoptedBackupDisk:
      allOf:
        - $ref: '#/components/schemas/BackupTarget'
        - type: object
          required: [lastBackupAt]
          properties:
            lastBackupAt:
              type: [string, 'null']
              format: date-time
              description: |
                Diskin sifresiz yarisindaki `disk.json`da yazan son yedek tarihi. `null`, o yarinin
                bos oldugu anlamina geliyor — v0.2.1'den once kurulmus bir disk. Tanimayi
                reddetmek, kurtarmayi tam da en cok gereken durumda calismaz kilardi.

    BackupTarget:
      type: object
      required:
        [
          id,
          pool,
          label,
          cadenceHours,
          retainDays,
          recoveryOnly,
          enabled,
          lastVerifiedAt,
          lastVerifyOk,
          lastVerifyNote,
          lastScrubAt,
          prepared,
          unlocked,
          availableBytes,
          usedBytes,
        ]
      properties:
        id: { type: string, format: uuid }
        pool:
          type: string
          description: Yedek havuzunun adi. Altindaki iki veri kumesinin adlari ajanda sabit.
        label:
          type: string
          description: |
            Kullanicinin verdigi ad — "Ev", "Ofis yedegi". Diskin sifresiz yarisinda da duruyor,
            cunku yanmis cihaz senaryosunda ekranda gorunecek tek insan sozcugu bu.
        cadenceHours: { type: integer, minimum: 1, maximum: 168 }
        retainDays: { type: integer, minimum: 1, maximum: 3650 }
        recoveryOnly:
          type: boolean
          description: |
            KURTARMA KIPI. Disk baska bir cihazin yedegi: yalniz okunuyor, ustune yazilmiyor ve
            hicbir sey silinmiyor. Yeni bir cihaza takilan bir disk bu kipte aciliyor — aksi
            halde ilk tur, yeni cihazda henuz olmayan her seyi "silinmis" sayip saklama sayacina
            koyardi ve yedegin tamami bir fitile baglanirdi.
        deviceId:
          type: [string, 'null']
          description: Diskin sifresiz yarisinda yazan cihaz kimligi.
        enabled: { type: boolean }
        lastVerifiedAt:
          type: [string, 'null']
          format: date-time
          description: |
            Yedegin GERCEKTEN okundugu son an. Tur kac dosya kopyaladigini sayiyor ama diskteki
            baytlara bakmiyor; gunluk dogrulama bir dosyayi okuyup asliyla karsilastiriyor.

            `null` HIC DOGRULANMADI demek, "saglam" demek DEGIL. Ekranin bu ikisini ayirmasi
            gerekiyor: yapilmamis bir olcumu basarili gostermek, dogrulamanin tamamini suse
            cevirir.
        lastVerifyOk: { type: [boolean, 'null'] }
        lastVerifyNote:
          type: [string, 'null']
          description: |
            Neyin olculdugu: hangi dosya, ne kadari okundu. "Dogrulandi" tek basina bir sey
            soylemiyor — buyuk bir dosyanin yalniz basi okunmus olabilir ve ekran bunu soylemeli.
        lastScrubAt:
          type: [string, 'null']
          format: date-time
          description: |
            Yedek havuzunda son `scrub`in baslatildigi an; haftada bir. Karsilastirmanin yerine
            gecmiyor: scrub "disk dogru okuyor" diyor, karsilastirma "yazdigimiz sey dogruydu"
            diyor.
        prepared:
          type: boolean
          description: Iki veri kumesi de yerinde mi.
        unlocked:
          type: boolean
          description: |
            Sifreli yari acik ve bagli mi. HER OKUMADA ZFS'e soruluyor, saklanmiyor: parola
            hicbir yere yazilmadigi icin cihaz her acildiginda disk kilitli oluyor.
        availableBytes: { type: integer, format: int64 }
        usedBytes: { type: integer, format: int64 }

    BackupTargetStatus:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
          description: |
            Yedek diski kurulu mu. `false` bir hata degil, cihazin olagan ilk hali.
        target:
          oneOf:
            - $ref: '#/components/schemas/BackupTarget'
            - type: 'null'

    PrepareBackupTargetRequest:
      type: object
      required: [pool, label, passphrase]
      properties:
        pool:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_.:-]{0,62}$'
          description: |
            Yedek diskinin havuzu. Icinde egik cizgi OLAMAZ — o bir veri kumesi yolu olurdu; bir
            tire ile baslayan ad `zpool` tarafindan secenek olarak okunur (P0-E).
        label: { type: string, minLength: 1, maxLength: 64 }
        passphrase:
          type: string
          minLength: 8
          maxLength: 512
          description: |
            Diskin parolasi, ZFS'in kendi anahtari olarak. Hicbir yere yazilmiyor: bu istegin
            govdesinde geliyor, ajana stdin'den veriliyor ve orada bitiyor.

            Sekiz bayt ZFS'in kendi alt siniri. Satir sonu iceremez — parola ajana bir SATIR
            olarak veriliyor, ve icinde satir sonu olan bir parola kurulurken kabul edilip
            acilirken tutmazdi.

    UnlockBackupTargetRequest:
      type: object
      required: [passphrase]
      properties:
        passphrase: { type: string, minLength: 8, maxLength: 512 }

    UpdateBackupTargetRequest:
      type: object
      description: En az bir alan verilmeli.
      properties:
        label: { type: string, minLength: 1, maxLength: 64 }
        cadenceHours: { type: integer, minimum: 1, maximum: 168 }
        retainDays:
          type: integer
          minimum: 1
          maximum: 3650
          description: |
            Silinen bir dosya yedekte kac gun duruyor. SIFIR YOK: silinen dosyanin ayni turda
            yedekten de gitmesi demek olurdu.
        enabled: { type: boolean }

    ShareTreeResult:
      type: object
      required: [dataset]
      properties:
        dataset:
          type: string
          description: Yeni paylaşımların altında açılacağı veri kümesi.

    CreatePoolRequest:
      type: object
      required: [name, topology, disks, confirm, password]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_.:-]{0,62}$'
          description: |
            Havuz adı. İçinde `/` OLAMAZ — o bir dataset yolu olurdu. Harfle başlamak zorunda:
            `-` ile başlayan bir ad `zpool` tarafından seçenek olarak okunur (P0-E).
        topology:
          type: string
          enum: [single, mirror, raidz1, raidz2]
          description: |
            Çok diskli **stripe bilerek ifade edilemez**: herhangi bir diski kaybetmenin bütün
            havuzu kaybettirdiği düzen, dosya saklamak için var olan bir cihazda bir listeden
            yanlış maddeyi seçerek ulaşılabilecek bir şey olmamalı.

            En az disk sayısı: `single` 1 (ve yalnız 1), `mirror` 2, `raidz1` 3, `raidz2` 4. İki
            diskli bir `raidz1`, bir aynanın yedekliliğini başka bir şey vaat eden bir kelimeyle
            anlatır.
        disks:
          type: array
          minItems: 1
          maxItems: 24
          items: { $ref: '#/components/schemas/PoolDisk' }
        prepareShareRoot:
          type: boolean
          description: |
            Havuz kurulduktan sonra `<havuz>/depsis` veri kümesini açıp paylaşım köküne bağla.

            İSTEĞE BAĞLI, ve yokluğu bir karar değil: alan hiç gönderilmezse sunucu, paylaşım
            kökünün o anki durumuna bakar — veri kümesi yoksa ve dizin boşsa ağaç kurulur.
            Açık `false` yalnız "bu havuz paylaşım ağacını taşımasın" diyen bir arayüzden gelmeli.

            Bu, sihirbazdan sonra kalan son kabuk adımını kaldırıyor: onsuz havuz var ama
            `POST /shares` hâlâ 503 veriyor. Bağlanacak yer ÇAĞIRANIN SEÇTİĞİ BİR ŞEY DEĞİL —
            ajanın kendi `DEPSIS_SHARES_ROOT`'u — ve ajan, oraya zaten bir veri kümesi bağlıysa ya
            da dizin boş değilse reddediyor.
        confirm:
          type: string
          description: |
            Havuz adının aynısı. İşi niyeti kanıtlamak DEĞİL — onu parola yapıyor — tek tıkla
            geçilmesini engellemek.
        password:
          type: string
          maxLength: 1024
          description: Mevcut parola. Oturum varken de isteniyor (§0.5).

    PoolDisk:
      type: object
      required: [byId, wwn]
      properties:
        byId:
          type: string
          description: '`GET /system/disks` yanıtındaki `byId`. Yol değil, tek bileşen.'
        wwn:
          type: string
          description: |
            Aynı yanıttaki `wwn`. Süs değil: ajan havuzu kurmadan hemen önce envanteri YENİDEN
            okuyup bunu karşılaştırıyor, ve bu, sihirbaz ile düğme arasında disk değiştirilmesine
            dayanan tek kontrol. `wwn` bildirmeyen bir disk havuza katılamaz.

    JobAccepted:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string, format: uuid }

    DiskInventory:
      type: object
      required: [disks, complete]
      properties:
        disks:
          type: array
          items: { $ref: '#/components/schemas/DiskInventoryEntry' }
        complete:
          type: boolean
          description: |
            Liste tam mı. Ajan `MAX_DISKS`'te kesiyor; kesilmiş bir envanterden yazılan bir onay
            metni, etkileyeceği disklerin bir alt kümesini adlandırırdı.

    DiskInventoryEntry:
      type: object
      required: [kname, sizeBytes, rotational, removable, holds, mounted, holdsSystem]
      properties:
        byId:
          type: string
          description: |
            `/dev/disk/by-id` altındaki kararlı ad — `DEPSIS_SMART_DISKS`'e yazılacak olan, ve
            `ReadSmartSummary`'nin aldığı. Çekirdek kararlı bir bağ vermediyse yok.
        kname:
          type: string
          description: |
            Çekirdek adı (`sda`, `nvme0n1`). Kararlı adın YANINDA gösterilmek için — operatör
            kasadaki etikette bunu okuyor — ama kimlik olarak asla: `/dev/sdX` yeniden
            başlatmada başka bir fiziksel diski gösterebilir (risk R1).
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        model: { type: string }
        serial:
          type: string
          description: |
            Yok olabilir. VPD sayfa 0x80 Hyper-V'de bozuk (ADR-0000); kimlik için `wwn`
            kullanılır.
        wwn: { type: string, description: SCSI VPD sayfa 0x83. Kimlik zincirinin ilk halkası. }
        rotational: { type: boolean }
        removable:
          type: boolean
          description: Çıkarılabilir. Giden bir USB belleği, bir vdev'i de götürür.
        transport: { type: string, description: '`sata`, `nvme`, `usb`, …' }
        holds:
          type: array
          items: { type: string }
          description: |
            Diskte hâlihazırda ne var: bölüm tablosu türü ve bulunan dosya sistemi imzaları.
            **BOŞ, tek güvenli durum.** Buradaki her şey, bu diske havuz kurmanın bir şeyi yok
            edeceği anlamına geliyor.
        mounted: { type: boolean, description: Bir bölümü bir yere bağlı. }
        label:
          type: string
          maxLength: 64
          description: |
            Kullanicinin bu diske verdigi ad. `wwn-0x5001b448b6bf6163` bir insanin ayirt
            edebilecegi bir ad degil; "Sol yuva" oyle.

            Anahtar `byId`, `kname` DEGIL: `/dev/sda` bir slot degil bir sira, ve ayni disk
            yeniden baslatmadan sonra `sdb` olabilir -- ad o zaman yanlis diski adlandirir.
        holdsSystem:
          type: boolean
          description: |
            `/`, `/boot` ya da `/boot/efi` bu diskte. Kendi alanı, çünkü bu asla bir yorum
            meselesi olmamalı: bu diski silmek cihazın kendisini siler, ve API onu bir onay
            metniyle değil doğrudan reddediyor.

    OpenConsoleRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          maxLength: 1024
          description: Mevcut parola. Oturum varken de isteniyor (ADR-0018).
        cols: { type: integer, minimum: 20, maximum: 500, default: 80 }
        rows: { type: integer, minimum: 5, maximum: 200, default: 24 }

    ConsoleSession:
      type: object
      required: [id, username, privileged, openedAt, idleTimeoutSeconds, maxAgeSeconds]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        privileged:
          type: boolean
          description: |
            Konsolun root olarak çalışıp çalışmadığı. Varsayılan false ve açmak birim dosyasını
            elle düzenlemeyi gerektirir — bir onay kutusuyla açılabilen root kabuk, kaza ile
            açılabilen root kabuktur.
        openedAt: { type: string, format: date-time }
        idleTimeoutSeconds: { type: integer }
        maxAgeSeconds: { type: integer }

    ConsoleSessionPage:
      type: object
      required: [items, available]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConsoleSession' }
        available:
          type: boolean
          description: Konsol servisi çalışıyor mu. Kapalıysa liste boş döner ve bu bir hata değil.

    ConsoleInput:
      type: object
      required: [data]
      properties:
        data:
          type: string
          maxLength: 8192
          description: base64. Terminal girdisi ham bayttır ve UTF-8 sınırlarını bölebilir.

    ConsoleResize:
      type: object
      required: [cols, rows]
      properties:
        cols: { type: integer, minimum: 20, maximum: 500 }
        rows: { type: integer, minimum: 5, maximum: 200 }

    CustomApp:
      type: object
      required: [slug, name, icon, image, tag, containerPort]
      properties:
        slug: { type: string }
        name: { type: string }
        icon: { type: string }
        image: { type: string }
        tag: { type: string }
        containerPort: { type: integer }

    CustomAppRequest:
      type: object
      required: [name, image, containerPort]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,39}$' }
        icon: { type: string, minLength: 1, maxLength: 8 }
        image:
          type: string
          maxLength: 255
          description: |
            Yalnız bilinen kayıt defterleri: docker.io, ghcr.io, lscr.io, quay.io. DEPSIS imajın
            İÇERİĞİNE kefil olmaz; bu sınır yalnız yazım taklidi yüzeyini daraltır.
        tag: { type: string, maxLength: 128, default: latest }
        containerPort: { type: integer, minimum: 1, maximum: 65535 }
        env:
          type: object
          additionalProperties: { type: string, maxLength: 1024 }
        volumes:
          type: array
          maxItems: 4
          items: { type: string }
          description: Kalıcı tutulacak konteyner-içi mutlak yollar. Varsayılan ["/config"].

    AppCatalogueEntry:
      type: object
      required: [slug, name, summary, icon, containerPort, mounts, containers]
      properties:
        slug: { type: string }
        custom:
          type: boolean
          description: Sahibin eklediği girdi. Katalogdan farkı arayüzde rozetle söylenir.
        name: { type: string }
        summary: { type: string }
        icon: { type: string }
        containerPort:
          type: integer
          description: |
            POD'un 127.0.0.1 üzerinde yayımladığı port. Uygulamanın kendisine ait bir olgu; çok
            konteynerli bir uygulamada da tek bir tane var.
        containers:
          type: array
          description: |
            Uygulamanın kaç parçadan oluştuğu, BAŞLAMA SIRASINDA. Immich dört konteyner: sunucu,
            makine öğrenmesi, veritabanı ve önbellek. Tek konteynerli bir uygulama tek elemanlı
            bir liste — ayrı bir biçim değil, aynı biçimin kısa hâli.
          items:
            type: object
            required: [role, image, tag, primary]
            properties:
              role:
                type: string
                description: Uygulamanın içindeki adı — `server`, `database`, `cache`.
              image: { type: string }
              tag:
                type: string
                description: |
                  Sabitlenmiş sürüm. `latest` veritabanı kısıtıyla reddediliyor — bir gün çalışan
                  bir uygulamanın ertesi gün sessizce başka bir sürüme geçmesi, bir NAS'ta veri
                  kaybının ucuz yollarından biri.
              primary:
                type: boolean
                description: |
                  Portu yayımlanan ve günlükleri gösterilen konteyner. Sırayla aynı şey değil:
                  Immich'te sunucu en son başlıyor ama kullanıcının gördüğü şey o.
        mounts:
          type: array
          description: |
            Kullanıcının paylaşım seçmesi gereken bağlama noktaları — uygulamanın TAMAMI için, tek
            bir düz liste. Hedefler uygulama çapında benzersiz, o yüzden kurulum isteğinin hangi
            hedefin hangi konteynere ait olduğunu bilmesi gerekmiyor.

            Uygulamanın kendi durumu (veritabanı dizini, model önbelleği) burada YOK: onlar
            podman'ın yönettiği birimler, ve bir insanın "Immich'in PostgreSQL'i nereye yazsın"
            sorusuna verebileceği iyi bir cevap yok.
          items:
            type: object
            required: [target, mode, purpose]
            properties:
              target: { type: string }
              mode: { type: string, enum: [ro, rw] }
              purpose: { type: string }

    App:
      type: object
      required: [catalogue, installed]
      properties:
        catalogue: { $ref: '#/components/schemas/AppCatalogueEntry' }
        installed: { type: boolean }
        state:
          type: string
          enum: [running, stopped, starting, error, unknown]
          description: |
            Podman'dan okunur, veritabanından değil. Bir kolona yazılsaydı cihaz yeniden
            başladığında yalan söylerdi.
        url:
          type: [string, 'null']
          description: 127.0.0.1 üzerindeki adres. Konteynerler LAN'a doğrudan açılmaz.
        hostPort: { type: [integer, 'null'] }
        installedAt: { type: [string, 'null'], format: date-time }

    AppPage:
      type: object
      required: [items, runtime]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/App' }
        runtime:
          type: object
          required: [available]
          properties:
            available: { type: boolean }
            version: { type: string }
            rootless:
              type: boolean
              description: |
                Köksüz çalışıp çalışmadığı. false ise kurulum ADR-0019'un ayrıcalık kararından
                sapmış demektir ve arayüz bunu uyarı olarak göstermeli.

    InstallAppRequest:
      type: object
      required: [mounts]
      properties:
        mounts:
          type: array
          description: |
            Katalogdaki her `target` için bir paylaşım. Host tarafı bir PAYLAŞIM KİMLİĞİ, bir yol
            değil — kullanıcının verdiği bir yol, kullanıcının seçtiği bir yolu bağlamak olurdu.
          items:
            type: object
            required: [target, shareId]
            properties:
              target: { type: string }
              shareId: { type: string, format: uuid }

    AppStateRequest:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [running, stopped] }

    AppLogs:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items: { type: string }

    ShareSnapshotPage:
      type: object
      required: [available, items]
      properties:
        available:
          type: boolean
          description: |
            Havuz sorulabildi mi. `false` ise `items` boş, ve bu "görüntü yok" DEĞİL "soramadım"
            demek — arayüzün ikisini ayırt etmesi gerekiyor.
        items:
          type: array
          items:
            type: object
            required: [name, createdAt, usedBytes]
            properties:
              name:
                type: string
                description: Görüntünün kendi adı, `@`'den sonraki kısım.
              createdAt: { type: string, format: date-time }
              usedBytes:
                type: integer
                description: |
                  Bu görüntünün TEK BAŞINA tuttuğu yer — silinirse geri kazanılacak olan. Görüntünün
                  içindeki verinin boyutu değil.

    SnapshotListing:
      type: object
      required: [path, items, truncated]
      properties:
        path:
          type: array
          items: { type: string }
          description: Görüntünün kökünden itibaren, sunucunun ayrıştırdığı hâliyle.
        items:
          type: array
          items:
            type: object
            required: [name, directory, sizeBytes, modifiedAt]
            properties:
              name: { type: string }
              directory: { type: boolean }
              sizeBytes: { type: integer }
              modifiedAt: { type: string, format: date-time }
        truncated:
          type: boolean
          description: |
            Klasör ajanın liste sınırından büyüktü ve liste KESİLDİ. Kesilmiş bir listeyi tam
            gibi göstermek, aradığı dosyayı bulamayan kullanıcıya onun hiç olmadığını söylemek
            olurdu.

    RestoreRequest:
      type: object
      required: [path]
      properties:
        path:
          type: array
          minItems: 1
          maxItems: 32
          items: { type: string }
          description: Geri getirilecek dosya, görüntünün kökünden itibaren.
        destinationId:
          type: [string, 'null']
          format: uuid
          description: İneceği canlı klasör; `null` paylaşımın kökü.

    RestoreAccepted:
      type: object
      required: [jobId, name]
      properties:
        jobId: { type: string, format: uuid }
        name:
          type: string
          description: |
            Dosyanın ineceği ad. Aslıyla aynı olmayabilir: hedefte o ad doluysa sunucu boş bir ad
            seçiyor, ve seçtiğini burada söylüyor — sessizce başka bir ada indirmek, kullanıcının
            aradığı dosyayı bulamaması demek olurdu.

    ScrubStatus:
      type: object
      required: [scan, errors, inProgress, hasErrors]
      properties:
        scan:
          type: string
          description: |
            `zpool status`'ün `scan:` satırı, devam satırlarıyla birlikte ve OLDUĞU GİBİ. Süren bir
            taramada yüzde ve kalan süre bu satırda. Boş ise `zpool status` bir şey söylememiş —
            "sorun yok" DEĞİL.
        errors:
          type: string
          description: '`errors:` satırı, olduğu gibi.'
        inProgress: { type: boolean }
        hasErrors:
          type: boolean
          description: |
            TEK ÇIKARIM. `zpool status` bilinen hata yokken tam olarak "No known data errors"
            yazıyor; başka her şey bir insanın bakması gereken hâl. Bu yönde kurulması bilinçli —
            tersi ("şu kalıplar hatadır") yeni bir ZFS sürümünün yeni bir cümlesini sessizce
            "sorun yok" sayardı.

    DatabaseBackupPage:
      type: object
      required: [items, directory]
      properties:
        items:
          type: array
          items:
            type: object
            required: [name, sizeBytes, createdAt]
            properties:
              name: { type: string }
              sizeBytes: { type: integer, format: int64 }
              createdAt: { type: string, format: date-time }
        directory:
          type: string
          description: |
            Dökümlerin durduğu dizin. Ekranda gösteriliyor çünkü onları cihazdan ÇIKARMAK
            yöneticinin işi: o dizinin veri kümesine bir yedekleme zamanlaması kurulur, ya da
            dosyalar elle kopyalanır. Nerede olduğunu söylemeyen bir yedek, bulunamayan bir yedek.

    BackupSchedule:
      type: object
      required:
        [
          id,
          dataset,
          label,
          cadence,
          atHour,
          atMinute,
          weekday,
          keep,
          replicateTarget,
          offsite,
          enabled,
          nextRunAt,
          lastRunAt,
          lastResult,
          lastReplicatedSnapshot,
          lastVerifiedAt,
          lastVerifyResult,
        ]
      properties:
        id: { type: string, format: uuid }
        dataset: { type: string }
        label: { type: string }
        cadence: { type: string, enum: [hourly, daily, weekly] }
        atHour:
          type: [integer, 'null']
          description: Günlük ve haftalık için saat; saatlik için null (her saat).
        atMinute: { type: integer, minimum: 0, maximum: 59 }
        weekday:
          type: [integer, 'null']
          description: Haftalık için gün; 0 = Pazar.
        keep:
          type: integer
          description: |
            BU ZAMANLAMANIN kaç görüntüsü saklanacak. Budama yalnız kendi ön ekiyle
            (`depsis-<ritim>-`) başlayan görüntülere dokunuyor: elle alınmış bir görüntüyü ya da
            başka bir aracın aldığını silen bir budama, veri kaybının fark edilmeyen biçimi olurdu.
        replicateTarget:
          type: [string, 'null']
          description: Yerel çoğaltma hedefi. null ise bu zamanlama yalnız görüntü alıyor.
        offsite:
          type: [object, 'null']
          required: [host, port, user]
          properties:
            host: { type: string }
            port: { type: integer }
            user: { type: string }
        enabled: { type: boolean }
        nextRunAt: { type: string, format: date-time }
        lastRunAt: { type: [string, 'null'], format: date-time }
        lastResult:
          type: [string, 'null']
          description: |
            Son turun ne yaptığı: `ok`, ya da başarısızlığın kendi cümlesi. İş satırı kuyruktan
            silindikten sonra da duran tek kayıt.
        lastVerifiedAt: { type: [string, 'null'], format: date-time }
        lastVerifyResult:
          type: [string, 'null']
          description: |
            Son doğrulamanın cümlesi. HİÇ GERİ YÜKLENMEMİŞ BİR YEDEK, YEDEK DEĞİLDİR: `lastResult`
            yalnız `zfs snapshot` komutunun hata vermediğini söylüyor, bu ise en yeni görüntünün
            havuzda DURDUĞUNU, açılıp LİSTELENEBİLDİĞİNİ ve BOŞ OLMADIĞINI.

            Baytların sağlam olduğunu SÖYLEMİYOR — onu ZFS'in sağlama toplamları ve `zpool scrub`
            yapıyor, ve bu ürün henüz scrub'ı ne zamanlıyor ne de raporluyor. Cümle bu ayrımı
            taşıyor; "doğrulandı" diyen ama yalnız satır sayan bir alan, kapalı görünüp hiçbir şey
            tutmayan bir kapı olurdu.

            Veri kümesi bir paylaşımın kümesi değilse görüntünün içine bakılamıyor, ve cümle bunu
            da söylüyor.
        lastReplicatedSnapshot:
          type: [string, 'null']
          description: |
            Artımlı gönderimin tabanı: en son BAŞARIYLA çoğaltılmış görüntü. `null` ise bir sonraki
            çoğaltma TAM gönderim yapacak — ilk turda, ve başarısız bir turdan sonra. İkincisi
            bilerek kaba: kopmuş bir gönderimden sonra hedefin ne tuttuğu bu taraftan bilinmiyor,
            ve olmayan bir tabana dayanan artımlı bir akış reddedilir.

    BackupSchedulePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BackupSchedule' }

    BackupScheduleRequest:
      type: object
      required: [dataset, label, cadence, keep]
      properties:
        dataset: { type: string }
        label: { type: string, maxLength: 80 }
        cadence: { type: string, enum: [hourly, daily, weekly] }
        atHour: { type: [integer, 'null'], minimum: 0, maximum: 23 }
        atMinute: { type: integer, minimum: 0, maximum: 59, default: 0 }
        weekday: { type: [integer, 'null'], minimum: 0, maximum: 6 }
        keep: { type: integer, minimum: 1, maximum: 10000 }
        replicateTarget: { type: [string, 'null'] }
        offsite:
          type: [object, 'null']
          required: [host, user]
          properties:
            host: { type: string }
            port: { type: integer, default: 22 }
            user: { type: string }
        enabled: { type: boolean, default: true }

    OffsiteStatus:
      type: object
      required: [hasIdentity, publicKey, fingerprint, trusted]
      properties:
        hasIdentity:
          type: boolean
          description: Anahtar üretildi mi. Geri kalan her şey bu false iken anlamsız.
        publicKey:
          type: [string, 'null']
          description: |
            Karşı tarafın `authorized_keys` dosyasına yapıştırılacak AÇIK yarı. Özel yarı hiçbir
            uçtan okunamıyor.
        fingerprint:
          type: [string, 'null']
          description: '`ssh-keygen -l` çıktısı, olduğu gibi.'
        trusted:
          type: array
          items: { type: string }
          description: |
            Bu cihazın bağlanacağı `known_hosts` kalıpları — `makine` ya da `[makine]:port`.
            Anahtar malzemesi değil kalıplar: insanın görmesi gereken şey hangi hedeflerle
            konuşulacağı, ve base64 bloğu üzerine hareket edilebilecek hiçbir şey söylemiyor.

    OffsiteDestination:
      type: object
      required: [host]
      properties:
        host:
          type: string
          description: |
            Makine adı ya da IPv4 adresi. IPv6 literalleri KABUL EDİLMİYOR — `known_hosts` onları
            köşeli parantez içinde yazıyor ve varsayılan olmayan port sözdizimi de öyle; ham bir
            literal kabul etmek hiçbir şeyle eşleşmeyen bir arama anahtarı üretirdi, ki kullanıcıya
            "bu makine güvenilir değil" diye okunur ve düzeltmenin yolu olmaz.
        port: { type: integer, minimum: 1, maximum: 65535, default: 22 }

    OffsiteHostKeyPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [kind, line, fingerprint]
            properties:
              kind: { type: string }
              line:
                type: string
                description: Onaylandığında `known_hosts` içine yazılacak satırın tamamı.
              fingerprint:
                type: string
                description: |
                  OpenSSH'in kendisi hesaplıyor, DEPSIS değil. Kullanıcı bunu karşı tarafta
                  `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub` çıktısıyla karşılaştırıyor, ve
                  bir biçimin iki uygulaması, karşılaştırmanın anahtarla ilgisi olmayan bir sebeple
                  başarısız olması için iki şans demek.

    OffsiteTrustRequest:
      type: object
      required: [host, line]
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535, default: 22 }
        line:
          type: string
          description: '`scan` çağrısından gelen ve kullanıcıya GÖSTERİLMİŞ satır.'

    OffsiteReplicateRequest:
      type: object
      required: [host, user, source, snapshot, target, confirm, password]
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535, default: 22 }
        user:
          type: string
          description: Karşı taraftaki hesap. Açık anahtar onun `authorized_keys` dosyasında.
        source: { type: string }
        snapshot: { type: string }
        target:
          type: string
          description: KARŞI TARAFTAKİ veri kümesi. `zfs recv -F` bunun üzerine yazıyor.
        base:
          type: [string, 'null']
          description: |
            Artımlı gönderim için ortak taban. Verilmezse TAM gönderim. İstemci seçiyor, sunucu
            tahmin etmiyor: karşı tarafın neyi tuttuğunu bilen taraf istemci, ve bir terabaytı
            taşımak sunucunun kendi inisiyatifiyle başlatacağı bir şey değil.
        confirm:
          type: string
          description: |
            `kullanıcı@makine:veri-kümesi` — hedefin tam adı, elle yazılmış. Yalnız veri kümesinin
            adı yeterli değil: aynı ada sahip yerel bir veri kümesi olabilir.
        password: { type: string }

    ControllerStatus:
      type: object
      required: [available, nodeId]
      properties:
        available: { type: boolean }
        nodeId:
          type: string
          description: |
            Cihazın kendi 10 haneli ZeroTier adresi. Üye listesinde bu satır, "yetkiyi kaldır"
            düğmesinin ASLA gösterilmemesi gereken tek satır.

    ControlledNetwork:
      type: object
      required: [networkId, name, private, assignsAddresses, subnet]
      properties:
        networkId: { type: string }
        name: { type: string }
        private: { type: boolean }
        assignsAddresses:
          type: boolean
          description: |
            IPv4 otomatik atama açık mı. `false` ise hiçbir cihaz adres ALMIYOR — ağ var, çalışmıyor.
        subnet: { type: [string, 'null'] }

    ControlledNetworkPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ControlledNetwork' }

    CreateNetworkRequest:
      type: object
      required: [name, subnet]
      properties:
        name: { type: string, maxLength: 64 }
        subnet:
          type: string
          description: |
            `a.b.c.0/24`, RFC1918. Yalnız /24, çünkü havuz ve rota bundan türetiliyor ve 254 adres
            bir evin cihaz sayısının çok üstünde.

            EV AĞINIZLA ÇAKIŞMASIN: `192.168.1.0/24` en yaygın ev ağı, ve onu seçmek evde otururken
            kendi yönlendiricinizle kavga eden bir rota demek. Arayüz varsayılan olarak
            `10.147.x.0/24` öneriyor.

    CreatedNetwork:
      type: object
      required: [network, shortfall]
      properties:
        network: { $ref: '#/components/schemas/ControlledNetwork' }
        shortfall:
          type: array
          items: { type: string }
          description: |
            Controller'ın SESSİZCE uygulamadığı şeyler, cümleleriyle. Boş değilse ağ var ama eksik
            kurulmuş — hata DEĞİL, çünkü ağ o noktada zaten diskte, ve "başarısız" demek bir
            sonraki denemede ikinci bir ağ yaratmak olurdu.

    ControllerMember:
      type: object
      required:
        [memberId, authorized, label, addresses, seen, isThisAppliance, authorizedBy, authorizedAt]
      properties:
        memberId:
          type: string
          description: |
            Cihazın 10 haneli düğüm adresi. KİMLİK BİLGİSİ DEĞİL — controller tam public identity
            ile doğruluyor ve ilk temasta sabitliyor, sonra aynı adresi başka kimlikle sunan düğümü
            reddediyor. Yani gösterilebilir, kopyalanabilir, QR'a konabilir.
        authorized: { type: boolean }
        label: { type: [string, 'null'] }
        addresses:
          type: array
          items: { type: string }
        seen:
          type: boolean
          description: |
            Cihaz controller'a HİÇ bağlandı mı. `false`, "bu adres yetkilendirildi ama sahibi hiç
            görünmedi" demek — ve yanlış yazılmış bir hanenin tek görünür izi bu. Cihaz bir kez
            göründükten sonra kimliği sabitlendiği için satır artık söylediği şeyi ifade ediyor.
        isThisAppliance:
          type: boolean
          description: Cihazın kendisi. Bu satırda "yetkiyi kaldır" gösterilmiyor.
        authorizedBy:
          type: [string, 'null']
          description: |
            Düğmeye kim bastı. `null`, DEPSIS dışında — `zerotier-cli` ile ya da bu kayıt var
            olmadan önce — yetkilendirilmiş bir cihaz demek. Bir ad uydurmaktansa boş bırakılıyor.
        authorizedAt: { type: [string, 'null'], format: date-time }

    ControllerMemberPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ControllerMember' }

    SetMemberRequest:
      type: object
      required: [memberId, authorized]
      properties:
        memberId: { type: string }
        authorized: { type: boolean }
        label: { type: [string, 'null'], maxLength: 64 }

    RemoteStatus:
      type: object
      required: [available, networks]
      properties:
        available:
          type: boolean
          description: zerotier-one kurulu ve çalışıyor mu. DEPSIS onu paketlemiyor.
        nodeId: { type: [string, 'null'] }
        online: { type: boolean }
        version: { type: [string, 'null'] }
        networks:
          type: array
          items: { $ref: '#/components/schemas/RemoteNetwork' }

    RemoteNetwork:
      type: object
      required: [networkId, status, authorized, addresses]
      properties:
        networkId: { type: string }
        name: { type: [string, 'null'] }
        label: { type: [string, 'null'] }
        status:
          type: string
          enum:
            [
              OK,
              ACCESS_DENIED,
              NOT_FOUND,
              REQUESTING_CONFIGURATION,
              PORT_ERROR,
              AUTHENTICATION_REQUIRED,
              UNKNOWN,
            ]
        authorized:
          type: boolean
          description: |
            false ise cihaz ağa KATILMIŞ ama ONAYLANMAMIŞTIR ve hiçbir trafik akmaz. Arayüz bunu
            "bağlanıyor" diye göstermemeli — kullanıcının ZeroTier Central'da bir kutu
            işaretlemesi gerekiyor.
        addresses:
          type: array
          items: { type: string }
        joinedAt: { type: [string, 'null'], format: date-time }

    JoinNetworkRequest:
      type: object
      required: [networkId]
      properties:
        networkId:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: |
            Tam 16 onaltılık hane. Ajan tarafında da kendi tipiyle doğrulanıyor; bir yol parçası
            olarak birleştirilecek bir değerin iki yerde doğrulanması, bir yerde unutulmasından
            ucuz.
        label: { type: string, maxLength: 64 }

    Share:
      type: object
      required: [id, name, readOnly, published, uncPath]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        readOnly: { type: boolean }
        published:
          type: boolean
          description: |
            Samba bu paylaşımı GERÇEKTEN sunuyor mu. Veritabanında bir satır olması yetmez —
            ikisini aynı şeymiş gibi göstermek, kullanıcıyı çalışmayan bir adresi denemeye
            göndermektir.
        uncPath:
          type: string
          description: Windows'un Gezgin'e yazacağı adres, örn. `\\depsis\belgeler`.
        dataset: { type: string }

    SharePage:
      type: object
      required: [items, smbAvailable]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Share' }
        smbAvailable:
          type: boolean
          description: |
            Ajana ulaşılabiliyor ve Samba kurulu mu. false ise `published` alanlarının hepsi
            false'tur ve bu bir arıza değil, kurulmamış bir bileşendir.

    ShareCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          # Ajanın `SafeComponent`'i ile birebir aynı, ve migration 0008'in `shares_name_format`
          # kısıtıyla da. Üçü ayrı yerde ama tek bir kural: bu tablonun kabul edip ajanın
          # reddettiği bir ad, veritabanında var olup diskte olmayan bir paylaşımdır.
          pattern: '^[A-Za-z0-9_][A-Za-z0-9._-]{0,62}$'
          description: |
            Paylaşımın adı, ve aynı zamanda SMB adresindeki son bileşen. Büyük/küçük harf ve
            Türkçe i ailesi katlanarak karşılaştırılır: `Belgeler` varken `belgeler` açılamaz,
            çünkü SMB istemcileri ikisini ayırt edemez.
        readOnly:
          type: boolean
          default: false
        quotaBytes:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: |
            `refquota`. Snapshot'ları HARİÇ tutar, yani yönetici anlık görüntü politikası bir
            kullanıcıyı kendi alanının dışına kilitleyemez (ADR-0008). null: kota yok.
        grants:
          type: array
          description: |
            Paylaşımın kökündeki başlangıç izinleri. Verilmezse paylaşımı açan yöneticiye tam
            izin yazılır — boş bir dizi DEĞİL: grant'sız bir paylaşım, kaldırılan istisnayı geri
            getirir, ve `422` ile reddedilir.
          minItems: 1
          items: { $ref: '#/components/schemas/Grant' }

    ShareCreated:
      type: object
      required: [share, applyingJobId]
      properties:
        share: { $ref: '#/components/schemas/Share' }
        applyingJobId:
          type: [string, 'null']
          format: uuid
          description: |
            POSIX ACL'leri yazacak işin kimliği. null ise ajana ulaşılamadı ve dosya sistemi
            henüz bu paylaşımın izinlerini bilmiyor — arayüz bunu göstermek zorunda, çünkü
            web'in kapalı dediği bir klasörün SMB'den açılması §6.2'nin adıyla yasakladığı şey.

    SmbPublishResult:
      type: object
      required: [shares, verified]
      properties:
        shares: { type: integer }
        verified:
          type: boolean
          description: |
            Canlı bağlantı denemesi geçti mi. false ise yapılandırma yazıldı ama doğrulanamadı ve
            ESKİSİNE GERİ DÖNÜLDÜ — yani paylaşımlar çalışmaya devam ediyor, yeni yapılandırma
            uygulanmadı.

    FolderPermission:
      type: string
      description: |
        §6.2'nin saydığı on bir izin, birebir. `manage` (izin yönet) ayrı: bir klasöre yazabilen
        herkesin o klasörün iznini de değiştirebilmesi, yetki modelinin kendi kendini geçersiz
        kılmasıdır.
      enum: [list, read, download, create, modify, move, delete, share, manage, versions, audit]

    Team:
      type: object
      required: [id, name, memberCount, posixGid, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        memberCount: { type: integer }
        posixGid:
          type: [integer, 'null']
          description: |
            Dosya sistemindeki grup. NULL, grubun HENÜZ YARATILMADIĞI anlamına gelir — ve bu
            durumdaki bir ekibe verilen izin uygulama katmanında görünür, SMB'de görünmez.
            Arayüz bunu söylemek zorunda; iki gerçeklik üretmemenin bedeli bu alanı okumak.
        createdAt: { type: string, format: date-time }

    TeamPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Team' }

    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }

    UpdateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }

    TeamMember:
      type: object
      required: [userId, username, teamAdmin, addedAt]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        teamAdmin:
          type: boolean
          description: §6.1'in "Ekip yöneticisi" satırı — kendi ekibi içindeki kullanıcı ve klasörler.
        addedAt: { type: string, format: date-time }

    TeamMemberPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TeamMember' }

    TeamMembershipRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
        teamAdmin: { type: boolean, default: false }

    Grant:
      type: object
      required: [permissions]
      description: |
        Tam olarak biri dolu: `userId` ya da `teamId`. İkisi birden dolu ya da ikisi birden boş
        bir satır, veritabanı kısıtıyla da reddediliyor — burada da yazılı olması, üretilmiş
        istemcinin sunucuya sormadan bilebilmesi için.
      properties:
        userId: { type: [string, 'null'], format: uuid }
        teamId: { type: [string, 'null'], format: uuid }
        displayName:
          type: string
          description: Kullanıcı adı ya da ekip adı. Yalnız yanıtta; istek bunu yok sayar.
        permissions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/FolderPermission' }

    FolderPermissions:
      type: object
      required: [effective, grants, canManage]
      properties:
        effective:
          type: array
          description: |
            ÇAĞIRANIN bu klasörde gerçekten yapabildikleri, miras hesaplandıktan sonra. Arayüz
            düğmeleri buna göre çizer. Organizasyon yöneticisi için her zaman tam küme.
          items: { $ref: '#/components/schemas/FolderPermission' }
        inheritedFrom:
          type: [string, 'null']
          format: uuid
          description: |
            `effective` kümesinin geldiği düğüm. Bu düğümün kendisiyse kendi kimliği; hiç grant
            yoksa null. "Bu izin nereden geliyor" cevaplanabilir bir soru olmalı, yoksa bir
            yöneticinin onu nereden kaldıracağını bulması imkânsız.
        grants:
          type: array
          description: |
            Bu düğümde AÇIKÇA yazılmış satırlar. `canManage` false ise BOŞ döner — kimin nereye
            erişebildiği kendi başına bir bilgi ve onu görmek de bir yetki.
          items: { $ref: '#/components/schemas/Grant' }
        canManage:
          type: boolean
          description: Çağıranın `manage` izni var mı. Arayüzün izin sekmesini göstermesi buna bağlı.

    SetFolderPermissionsRequest:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          description: |
            Bu düğümdeki grant'ların TAMAMI. Boş dizi, bu düğümdeki bütün açık izinleri kaldırır
            ve mirası yeniden yürürlüğe sokar — silmenin yolu bu, çünkü boş bir izin kümesi
            taşıyan bir grant satırı veritabanı tarafından reddediliyor.
          items: { $ref: '#/components/schemas/Grant' }

    PermissionImpact:
      type: object
      required: [foldersAffected, usersGaining, usersLosing]
      description: |
        §6.2: "Her izin değişimi dry-run ile etkilenecek kullanıcı/klasör sayısını göstermeli."
        Sayılar, mirasın ulaştığı ALT AĞACIN tamamı üzerinden hesaplanır — tıklamanın gerçek
        yarıçapı bu, değişen satır sayısı değil.
      properties:
        foldersAffected: { type: integer }
        usersGaining:
          type: array
          description: Bu değişiklikten sonra erişimi ARTAN kullanıcılar.
          items: { $ref: '#/components/schemas/AffectedUser' }
        usersLosing:
          type: array
          description: |
            Erişimi AZALAN kullanıcılar. Ayrı bir liste, çünkü bir yöneticinin durup düşünmesi
            gereken taraf bu — birine erişim vermek geri alınabilir, birinden almak o kişinin
            işini o an durdurur.
          items: { $ref: '#/components/schemas/AffectedUser' }

    AffectedUser:
      type: object
      required: [userId, username, before, after]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        before:
          type: array
          items: { $ref: '#/components/schemas/FolderPermission' }
        after:
          type: array
          items: { $ref: '#/components/schemas/FolderPermission' }

    PermissionWriteResult:
      type: object
      required: [applied, impact]
      properties:
        applied:
          type: boolean
          description: false ise dryRun'dı ve hiçbir şey yazılmadı.
        impact: { $ref: '#/components/schemas/PermissionImpact' }
        applyingJobId:
          type: [string, 'null']
          format: uuid
          description: |
            POSIX ACL'leri yeniden yazan iş. İzinler dosya sistemine ANINDA yansımıyor ve
            tamamlanana kadar iki katman ayrışık (ADR-0021'in kabul edilen borcu). Arayüz bunu
            "izinler uygulanıyor" diye göstermeli; sessizce tamamlanmış gibi davranmak, SMB'den
            hâlâ erişilebilen bir klasörü kapalı sanmaktır.

            Ajan ulaşılamazsa null olur ve yazma yine de yapılır — uygulama katmanı doğru,
            dosya sistemi geride. Bu durumun görünür olması, gizlenmesinden iyidir.
