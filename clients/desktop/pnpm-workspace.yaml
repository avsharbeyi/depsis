# Bu dizin deponun ana çalışma alanının DIŞINDA, ve bilerek: Electron'un ikilisi yüz megabayt ve
# ana çalışma alanına girseydi CI'nin her işi onu indirirdi. Kendi kilit dosyası var; buradan
