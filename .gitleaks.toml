# Gizli tarayıcının yapılandırması.
#
# NEDEN VAR. `gitleaks`'in varsayılan kuralları arasında "bir PEM özel anahtarı" var, ve o kural
# anahtarın KENDİSİNİ değil BAŞLIĞINI arıyor: `-----BEGIN PRIVATE KEY-----`. Bu başlık üç yerde
# geçiyor ve üçünde de bir sır değil:
#
#   - arayüzdeki metin kutusunun yer tutucusu (operatör oraya ne yapıştıracağını görüyor),
#   - ajanın testlerindeki örnekler (gerçek bir anahtar değil, dört harf),
#   - `tls` modülünün başlık tanıma testleri.
#
# ALLOWLIST DAR TUTULDU. Dosyaları toptan taramanın dışında bırakmak kolay olurdu ve yanlış olurdu:
# `dispatch.rs` bu projenin en büyük dosyası, ve içine bir gün gerçek bir sır girerse tarayıcının
# onu görmesi gerekiyor. `condition = "AND"` ile hem yol hem de kalıp eşleşmek zorunda — yani
# yalnız o dosyalardaki BU başlık geçiliyor.

[extend]
useDefault = true

[[allowlists]]
description = "PEM başlıkları: yer tutucular ve test örnekleri, anahtar değil"
condition = "AND"
paths = [
  '''apps/web/src/Certificate\.tsx''',
  '''services/system-agent/src/tls\.rs''',
  '''services/system-agent/src/dispatch\.rs''',
]
regexes = ['''-----BEGIN [A-Z ]*PRIVATE KEY-----''']
