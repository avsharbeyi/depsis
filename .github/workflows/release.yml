# DEPSIS sürümü üretir: kaynak arşivi, sha256, ve İMZA.
#
# ── bu iş akışının var olma nedeni ────────────────────────────────────────────
#
# Cihaz kendini güncelleyebiliyor (Sistem → Yazılım sürümü), ama güvendiği tek şey HTTPS ve
# kaynağın adresinin güncelleyici betikte sabit olmasıydı. Bu, aradaki ağı dışarıda tutar;
# kaynağın kendisini dışarıda tutmaz. Kök yetkiyle kurulacak bir kod için bu yeterli değil.
#
# Buradan çıkan sürüm İMZALI, ve cihaz imzayı kendi taşıdığı açık anahtarla doğruluyor. Anahtarı
# olmayan bir saldırgan, deponun tamamını ele geçirse bile kutuya kod kuramaz.
#
# ── anahtar nerede ────────────────────────────────────────────────────────────
#
# Özel anahtar `DEPSIS_RELEASE_KEY` sırrında, ve bu depoda ÜRETİLMEDİ: bir üretim imza anahtarını
# üreten ve saklayan taraf cihazın sahibidir. `deploy/release/README.md` tek seferlik komutları
# taşıyor. Sır yoksa bu iş akışı DÜŞER — imzasız bir sürüm, imzalı sürümün var olma sebebini
# ortadan kaldırır, ve "imzasız da olur" diyen bir yedek yol tam olarak saldırganın kullanacağı
# yoldur.

name: release

on:
  push:
    tags: ['v*']
  # Elle de üretilebilir: bir etiketi yeniden yayınlamak (imza anahtarı değiştiğinde) ya da ilk
  # sürümü çıkarmak için.
  workflow_dispatch:
    inputs:
      tag:
        description: Yayınlanacak etiket (örn. v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: imzalı sürüm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # Etiketin kendisi: `git archive` bunun üzerinde çalışıyor.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Etiketi belirle
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF#refs/tags/}"
          case "$TAG" in
            v*) : ;;
            *) echo "etiket 'v' ile başlamalı: $TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse "$TAG^{commit}")" >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Rust ikilileri
        # ── neden sürümün içinde derlenmiş ikili var ────────────────────────────────────────
        #
        # Sahadaki ilk yazılım güncellemesi burada düştü. Arşiv yalnız KAYNAK taşıyordu, cihazda
        # cargo PATH'te yoktu, ve kurulum "depsis-agent derlenmemiş" deyip geri alındı. Kutu
        # çalışır kaldı ama güncellenemez hâle geldi — yani bir güvenlik düzeltmesinin
        # kullanıcıya ulaşma yolu kapandı.
        #
        # Kutuda derlemek doğru cevap değildi. Bu ürün 3-4 GiB belleğe sahip, on yıllık
        # işlemcili kutulara kuruluyor; her düzeltme için soğuk bir Rust derlemesi yaptırmak,
        # güncellemeyi kimsenin başlatmayacağı bir işe çevirir. Sürümü ÜRETEN taraf zaten
        # derliyor.
        #
        # GÜVENLİK BAKIMINDAN DA DAHA İYİ, ve bu ters gelebilir: ikililer arşivin içinde, arşivin
        # tamamı imzalı, ve cihaz imzayı kendi taşıdığı açık anahtarla doğruluyor. Kutuda
        # derlemek ise kutudaki derleyiciye, crates.io'dan o an inen kaynağa ve aradaki ağa
        # güvenmek demekti — imzanın kapsamadığı üç şey.
        #
        # `--locked`: Cargo.lock'ta yazan sürümler, o an yayınlanmış olanlar değil.
        run: |
          cargo build --locked --release --bin depsis-agent --bin depsis-console
          ls -l target/release/depsis-agent target/release/depsis-console
          # glibc: runner Ubuntu 24.04 (2.39), cihaz Debian 13 (2.41). Eski glibc'ye karşı
          # derlenen ikili yenisinde çalışır; tersi çalışmaz. Yön doğru, ve yanlışa dönerse
          # aşağıdaki satır sürümü üretirken görünür olsun diye basılıyor.
          objdump -T target/release/depsis-agent | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1

      - name: Kaynak arşivi
        # `git archive`, deponun O ETİKETTEKİ hâlini paketler: çalışma ağacındaki hiçbir kirlilik
        # arşive giremez. `--prefix` ile açılan dizin, güncelleyicinin beklediği biçimde.
        #
        # İkililer arşive SONRADAN ekleniyor, `git archive`in çıktısı önce sıkıştırılmamış tar
        # olarak duruyor ki `tar -r` ona ekleyebilsin. Eklenen tek şey `target/release` altındaki
        # iki ikili ve onları tanıtan işaret dosyası; deponun geri kalanı yine etiketin bire bir
        # kendisi.
        run: |
          TAG='${{ steps.tag.outputs.tag }}'
          TOP="depsis-$TAG"
          git archive --format=tar --prefix="$TOP/" "$TAG" -o "$TOP.tar"

          mkdir -p "$TOP/target/release"
          install -m 0755 target/release/depsis-agent target/release/depsis-console \
            "$TOP/target/release/"
          # İŞARET DOSYASI. İlk satırı mimari, çünkü kurulum onu kendi `uname -m`i ile
          # karşılaştırıyor: yanlış mimarideki bir ikiliyi kurmak, açılışta "Exec format error"
          # ile düşen ve sebebi kurulum günlüğünde görünmeyen bir servis demek olurdu.
          {
            uname -m
            printf 'tag=%s\n' "$TAG"
            printf 'commit=%s\n' '${{ steps.tag.outputs.commit }}'
          } > "$TOP/target/release/.depsis-prebuilt"
          tar -rf "$TOP.tar" "$TOP/target"
          rm -rf "$TOP"

          gzip -n -c "$TOP.tar" > "$TOP.tar.gz"
          rm -f "$TOP.tar"
          sha256sum "$TOP.tar.gz" > "$TOP.tar.gz.sha256"
          ls -l "$TOP.tar.gz"
          # Arşivin gerçekten ikilileri taşıdığı BURADA görülsün: eksikse sürüm hiç çıkmasın,
          # çünkü eksikliği ancak bir müşteri güncellemeye basınca anlaşılırdı.
          tar -tzf "$TOP.tar.gz" | grep -x "$TOP/target/release/depsis-agent"
          tar -tzf "$TOP.tar.gz" | grep -x "$TOP/target/release/depsis-console"
          tar -tzf "$TOP.tar.gz" | grep -x "$TOP/target/release/.depsis-prebuilt"

      - name: İmzala
        # SIR YOKSA DÜŞ. Bu adımın sessizce atlanması, imzasız bir sürümün "sürüm" diye
        # yayınlanması demek olurdu — ve cihaz onu reddedince ortaya "güncelleme bozuk" gibi
        # görünen, aslında "bu sürüm imzalanmamış" olan bir durum çıkardı.
        env:
          RELEASE_KEY: ${{ secrets.DEPSIS_RELEASE_KEY }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then
            echo 'DEPSIS_RELEASE_KEY sırrı yok; imzalı sürüm üretilemez.' >&2
            echo 'Tek seferlik kurulum: deploy/release/README.md' >&2
            exit 1
          fi
          TAG='${{ steps.tag.outputs.tag }}'
          umask 077
          printf '%s\n' "$RELEASE_KEY" > signing.pem
          openssl pkey -in signing.pem -pubout -out release-key.pub
          # `pkeyutl -rawin`, `dgst -sha256 -sign` DEĞİL. Ed25519 "saf" bir imza algoritması:
          # özeti kendi içinde alıyor, ve ona dışarıdan bir özet dayatmak openssl tarafından
          # reddediliyor — "Explicit digest not allowed with EdDSA operations". İlk hâli tam
          # olarak bunu yapıyordu, yani ilk `git push --tags` de düşecekti.
          openssl pkeyutl -sign -rawin -inkey signing.pem \
            -in "depsis-$TAG.tar.gz" -out "depsis-$TAG.tar.gz.sig"
          # HEMEN DOĞRULA. Bir imza, üretildiği yerde doğrulanmazsa ancak cihazda — yani
          # güncelleme yarıda kaldığında — yanlış olduğu anlaşılır.
          openssl pkeyutl -verify -rawin -pubin -inkey release-key.pub \
            -sigfile "depsis-$TAG.tar.gz.sig" -in "depsis-$TAG.tar.gz"
          # Depodaki açık anahtarla AYNI mı: cihazlar onu taşıyor, ve farklıysa üretilen sürümü
          # hiçbir kutu kuramaz.
          if [ -f deploy/release/release-key.pub ]; then
            if ! cmp -s release-key.pub deploy/release/release-key.pub; then
              echo 'İmza anahtarı deploy/release/release-key.pub ile uyuşmuyor:' >&2
              echo 'bu sürümü hiçbir cihaz doğrulayamaz.' >&2
              exit 1
            fi
          else
            echo 'UYARI: deploy/release/release-key.pub yok; cihazlar bu sürümü doğrulayamaz.' >&2
          fi
          rm -f signing.pem

      - name: Yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG='${{ steps.tag.outputs.tag }}'
          gh release create "$TAG" \
            "depsis-$TAG.tar.gz" \
            "depsis-$TAG.tar.gz.sig" \
            "depsis-$TAG.tar.gz.sha256" \
            --title "$TAG" \
            --notes "Commit ${{ steps.tag.outputs.commit }}. Arşiv imzalıdır; cihaz onu \
              \`deploy/release/release-key.pub\` ile doğrular." \
            || gh release upload "$TAG" \
              "depsis-$TAG.tar.gz" \
              "depsis-$TAG.tar.gz.sig" \
              "depsis-$TAG.tar.gz.sha256" \
              --clobber
