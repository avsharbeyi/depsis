name: CI

# Pipeline order per master prompt §19:
#   format -> lint -> typecheck -> unit -> integration -> e2e -> security -> build -> signed artifacts
# Stages not yet implemented are declared here as explicit, visibly-skipped jobs rather than
# omitted, so that a missing stage stays legible instead of silently absent. `e2e` was one of
# them until the Playwright suite and tools/dev/e2e-stack.sh existed; `integration` still is.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned in ADR-0002. Node 22 is Maintenance LTS; 24 is Active LTS.
  NODE_VERSION: '24.19.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: format · typecheck · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Reject CRLF in files that Debian executes
        # A CRLF reaching a shell script, systemd unit or cloud-init seed produces
        # "bad interpreter" style failures that are painful to diagnose. .gitattributes
        # prevents this; this check proves the prevention is actually working.
        run: |
          bad=$(git ls-files --eol -- '*.sh' '*.service' '*.socket' '*.timer' \
                  'deploy/**/user-data' 'deploy/**/meta-data' \
                | grep -v 'w/lf' || true)
          if [ -n "$bad" ]; then
            echo "::error::CRLF found in Linux-consumed files:"; echo "$bad"; exit 1
          fi
          echo "All Linux-consumed files are LF."

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

      - name: The workflow files themselves
        # actionlint implements GitHub's own workflow schema, which is stricter than YAML in ways
        # that matter: a `runner.temp` in a job-level `env:` parses fine and makes GitHub reject
        # the ENTIRE FILE before a single job starts.
        #
        # That is not hypothetical. Every push for a day produced a `startup_failure` of zero
        # seconds and nobody saw it, because a workflow that cannot start also cannot report. The
        # API even names such a workflow after its own path, having failed to read `name:`.
        #
        # This step cannot catch the fatal case — if ci.yml is invalid, this job never runs — so
        # it is a backstop, not the guard. The guard is `pnpm lint:workflows` before pushing, and
        # looking at the run afterwards.
        uses: rhysd/actionlint@main
        with:
          fail-on-error: true
      - run: pnpm typecheck

      - name: OpenAPI types are in sync with the spec
        # src/generated/api.d.ts is committed so reviewers can see API surface changes in the
        # diff. That only works if it cannot drift: this regenerates from openapi/depsis.yaml
        # and fails on any difference, which also catches someone editing the output by hand.
        run: pnpm generate:check

      - run: pnpm test:unit
      - run: pnpm build

  rust:
    name: system-agent (linux + windows cross-check)
    runs-on: ubuntu-latest
    # ADR-0006: the agent must keep compiling for Windows so cfg-gating regressions surface
    # immediately. Cross-checking from Linux CI is cheaper than a Windows runner.
    #
    # There is deliberately NO `if:` guard here. It used to read
    # `if: hashFiles('services/system-agent/Cargo.toml') != ''`, from when the crate might not have
    # existed yet — and GitHub rejected the whole file for it, because at job level the repository
    # has not been checked out and there is no workspace for hashFiles to hash.
    #
    # Removing it rather than rewriting it, because the guard had become the wrong shape anyway:
    # the crate is committed, and a condition that SKIPS this job would mean that renaming the
    # crate silently stops running `cargo clippy`, the Windows cross-check and the agent schema
    # diff — and reports green. A security-relevant job that can quietly disappear is worse than
    # one that fails loudly when its inputs move.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all
      - run: cargo check --locked --target x86_64-pc-windows-msvc

      - name: The committed agent schema matches what the binary emits
        # ADR-0006 puts this contract on the Rust side, and packages/agent-protocol generates its
        # TypeScript from a COMMITTED copy of the emit. A copy is a second description of the
        # boundary, so it only stays honest if something compares it to the original — which only
        # this job can do, because only this job has the binary.
        run: |
          cargo build --locked --release --bin depsis-agent
          ./target/release/depsis-agent --emit-schema > /tmp/agent-schema.json
          if ! diff -u packages/agent-protocol/schema/agent.schema.json /tmp/agent-schema.json; then
            echo "::error::packages/agent-protocol/schema/agent.schema.json is stale."
            echo "Regenerate it with: cargo run --release --bin depsis-agent -- --emit-schema > packages/agent-protocol/schema/agent.schema.json"
            echo "then: pnpm --filter @depsis/agent-protocol generate"
            exit 1
          fi

  security:
    name: dependency · secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency advisories
        run: pnpm audit --audit-level=high
      - name: Secret scan
        # §16 and ADR-0004/0006: a controller secret or DB password must never reach a
        # frontend bundle, an API response, or a log.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  migrations:
    name: migrations · tenant isolation (PostgreSQL 18)
    runs-on: ubuntu-latest
    # ADR-0013 says its two RLS bypasses were "made permanent by a migration test". That sentence
    # was untrue until this job existed: the isolation guarantees had been measured once, by hand,
    # on a developer VM. Everything asserted here needs only PostgreSQL — no ZFS, no systemd — so
    # there is no reason for it not to run on every push.
    #
    # What it cannot cover stays in P1-A on the Debian VM: the agent, ZFS, Samba.
    services:
      postgres:
        # 18, not the runner's default. The schema uses the built-in uuidv7(), which does not
        # exist before 18, and bootstrap.sql refuses to proceed without it.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-postgres
        # No POSTGRES_INITDB_ARGS. The locale provider matters enormously here — the Turkish dotted
        # capital I folds differently under ICU than under libc, and the identity key depends on
        # getting it right — but bootstrap.sql sets it per DATABASE, not per cluster. Measured on
        # the VM: the cluster there is libc (datlocprovider='c') while depsis and depsis_ci are ICU
        # ('i', datlocale='und-x-icu'), and every folding assertion passes. Forcing it at initdb
        # would add a way for the container to fail to start in exchange for nothing, so the job
        # asserts the provider instead of configuring it.
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Where the JSON report goes
        # A step, because this is the first place a shell exists to expand `$RUNNER_TEMP`. The
        # `runner` CONTEXT would work in a step-level `env:` too, but writing it once into
        # $GITHUB_ENV keeps the two steps that read it from having to agree on a path.
        run: echo "DEPSIS_E2E_JSON_REPORT=$RUNNER_TEMP/playwright-report.json" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install the PostgreSQL 18 client
        # The runner image ships an older psql, and bootstrap.sql uses `\if :{?var}`, which needs a
        # recent client. Pulling the client from PGDG matches what the target actually runs.
        run: |
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          psql --version

      - name: Migration and tenant-isolation gate
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-postgres
          DB_NAME: depsis_ci
          DB_DIR: packages/db
        run: bash tools/ci/migration-check.sh

      - name: The permission schema's constraints actually bite
        # Separate from the gate above because it asks a different question: that one measures
        # tenant isolation and reversibility across the whole schema, this one measures whether a
        # single migration's CHECK constraints refuse what they claim to refuse.
        #
        # It exists because one of them did not. `folder_grants_not_empty` was written as
        # `array_length(permissions, 1) >= 1`, which returns NULL on an empty array — and a CHECK
        # constraint PASSES on NULL. The constraint was written, reviewed, and enforced nothing.
        # Only writing an empty array to a real database found it.
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-postgres
        run: bash tools/ci/permissions-schema-check.sh

      - name: Tenant-context integration tests (P1-B)
        # The unit tests in apps/api run in the `static` job against a fake pool and settle the
        # chokepoint's control flow. These are the other half — the parts that are PostgreSQL's
        # behaviour rather than TypeScript's, and that ADR-0015 listed as unverified: that
        # SET LOCAL refuses a bind parameter, that set_config's context really does vanish when a
        # pooled connection is returned, and that the startup gate refuses an owner connection.
        #
        # They skip themselves when DEPSIS_TEST_DATABASE_URL is unset, which is why they can live
        # beside the code without needing a database on every developer's machine — and why the
        # variables have to be set HERE, or the job would report success having run nothing.
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-postgres
        run: |
          # Rootless podman, started here rather than left absent.
          #
          # `apps/api/src/apps` guards its container block on the socket EXISTING, so without this
          # the three tests that talk to a real runtime would skip — and a skip is what the guard
          # below refuses to accept. Excluding them would have been the cheaper fix and the worse
          # one: podman is preinstalled on this runner, so the choice was between measuring the
          # integration and explaining why we do not.
          #
          # The ROOTLESS socket, matching ADR-0019's deployment decision. The root socket would
          # also work and would test a configuration the product refuses to install code through.
          systemctl --user enable --now podman.socket || podman system service --time=0             "unix://${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/podman/podman.sock" &
          for _ in $(seq 1 30); do
            [ -S "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/podman/podman.sock" ] && break
            sleep 1
          done
          export DEPSIS_TEST_PODMAN_SOCKET="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/podman/podman.sock"
          echo "DEPSIS_TEST_PODMAN_SOCKET=$DEPSIS_TEST_PODMAN_SOCKET" >> "$GITHUB_ENV"
          ls -l "$DEPSIS_TEST_PODMAN_SOCKET" || echo "::warning::podman socket did not appear"

          psql -d postgres -c "ALTER ROLE depsis_owner PASSWORD 'ci-owner'"
          psql -d postgres -c "ALTER ROLE depsis_app   PASSWORD 'ci-app'"

          # A SECOND database, with the migrations applied and nothing claimed. The setup tests need
          # a system that has never been set up, and the first database has tenants in it by the
          # time they would run — so sharing one would leave them permanently skipped or, worse,
          # asserting against a state they did not create.
          psql -d postgres -c "DROP DATABASE IF EXISTS depsis_setup_ci"
          psql -d postgres -v db_name=depsis_setup_ci -f packages/db/bootstrap.sql
          DEPSIS_MIGRATION_DATABASE_URL="postgresql://depsis_owner:ci-owner@127.0.0.1:5432/depsis_setup_ci"             pnpm --filter @depsis/db run migrate:up

          export DEPSIS_TEST_DATABASE_URL="postgresql://depsis_app:ci-app@127.0.0.1:5432/depsis_ci"
          export DEPSIS_TEST_OWNER_DATABASE_URL="postgresql://depsis_owner:ci-owner@127.0.0.1:5432/depsis_ci"
          export DEPSIS_TEST_SETUP_DATABASE_URL="postgresql://depsis_app:ci-app@127.0.0.1:5432/depsis_setup_ci"
          export DEPSIS_TEST_SETUP_OWNER_DATABASE_URL="postgresql://depsis_owner:ci-owner@127.0.0.1:5432/depsis_setup_ci"
          pnpm --filter @depsis/api test:unit

      - name: Prove the integration tests were not silently skipped
        # A gated suite that quietly skips is worse than no suite: the job goes green having
        # measured nothing. This asserts the gate was actually open.
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-postgres
          DEPSIS_TEST_DATABASE_URL: postgresql://depsis_app:ci-app@127.0.0.1:5432/depsis_ci
          DEPSIS_TEST_OWNER_DATABASE_URL: postgresql://depsis_owner:ci-owner@127.0.0.1:5432/depsis_ci
          DEPSIS_TEST_SETUP_DATABASE_URL: postgresql://depsis_app:ci-app@127.0.0.1:5432/depsis_setup_ci
          DEPSIS_TEST_SETUP_OWNER_DATABASE_URL: postgresql://depsis_owner:ci-owner@127.0.0.1:5432/depsis_setup_ci
        run: |
          # --outputFile, NOT captured stdout. The application's Nest logger writes to stdout
          # while the suite runs, so capturing stdout captures log lines wrapped around the JSON.
          # Measured on Linux: 68KB of output beginning with a DbService log line, which JSON.parse
          # rejected. The first version of this step swallowed that in a catch, printed nothing, and
          # the shell's ${skipped:-0} default turned "could not measure" into "zero skipped" — so
          # the guard against a silently-skipping suite was itself silently measuring nothing, and
          # would have reported success on every run.
          # An ABSOLUTE path, expanded by this shell before pnpm runs: `--filter ... exec` executes
          # in apps/api, so a relative --outputFile lands there while the reader below looks in the
          # workspace root. Measured: ENOENT, which the reader correctly turns into a failure —
          # but a failure for the wrong reason is still a job nobody can trust.
          # Outside the workspace. Written into it, the report is an untracked JSON file that
          # `pnpm format:check` then reports as unformatted — harmless across CI's separate jobs,
          # but it broke a local full-pipeline run and would break any step added after this one.
          report="${RUNNER_TEMP:-/tmp}/vitest-report.json"
          # agent.integration.test.ts is excluded, not tolerated. It needs a running privileged
          # agent on a Unix socket, which this job has no way to provide, so it would skip here for
          # a legitimate reason — and "zero skipped" has to stay an absolute rule to be worth
          # anything. Excluding it keeps the rule absolute and keeps the omission visible in the
          # command rather than hidden in a tolerance. That pair is covered by P1-C on the VM.
          # Both packages. The worker's suite is gated on the same variables and lives elsewhere,
          # so checking only @depsis/api meant nine tests that exercise the queue under concurrency
          # were never looked at here — a guard with a blind spot the size of a whole package.
          for package in @depsis/api @depsis/worker; do
          echo "── $package"
          rm -f "$report"
          pnpm --filter "$package" exec vitest run \
            --exclude '**/agent.integration.test.ts' \
            --reporter=json --outputFile="$report" > /dev/null 2>&1 || true

          # Every way of failing to measure is now an error, not a zero.
          node -e '
            const fs = require("node:fs");
            let report;
            try {
              report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            } catch (e) {
              console.error("::error::could not read the vitest report: " + e.message);
              process.exit(1);
            }
            const tests = (report.testResults || []).flatMap((f) => f.assertionResults || []);
            if (tests.length === 0) {
              console.error("::error::the vitest report contains no tests at all");
              process.exit(1);
            }
            // Named exemptions, each with an argument — not a tolerated COUNT.
            //
            // The rule stays absolute: any skip that is not on this list fails the job. What
            // changed is granularity. The exclusion used to be per FILE, and
            // remote.integration.test.ts has twenty tests that run here plus one that cannot —
            // dropping the file to excuse the one would have thrown away the twenty.
            //
            // Anything joining this list needs its own sentence, not an analogy to these.
            const ALLOWED = [
              {
                // DEPSIS does not package zerotier-one, and a CI job has no business joining a
                // global peer-to-peer network to prove it can. The read path against a real
                // daemon is covered by tools/poc/p1-g-remote.sh on the VM.
                match: /against the real zerotier-one/,
                why: "needs a running zerotier-one daemon (P1-G covers it)",
              },
            ];

            const skipped = tests.filter((a) => a.status === "pending" || a.status === "skipped");
            const excused = [];
            const unexplained = [];
            for (const t of skipped) {
              const rule = ALLOWED.find((r) => r.match.test(t.fullName));
              (rule ? excused : unexplained).push(rule ? t.fullName + " — " + rule.why : t.fullName);
            }

            console.log(tests.length + " test(s) ran, " + skipped.length + " skipped (" +
                        excused.length + " excused, " + unexplained.length + " unexplained)");
            for (const line of excused) console.log("  excused: " + line);

            if (unexplained.length > 0) {
              console.error("::error::integration tests skipped with no recorded reason; a gate was not open");
              for (const line of unexplained.slice(0, 10)) console.error("  skipped: " + line);
              process.exit(1);
            }

            // The other direction, and the one a tolerance list makes newly possible: an
            // exemption whose tests started running again is an exemption nobody removed. Left
            // alone it grows into the tolerance this list exists to avoid.
            for (const rule of ALLOWED) {
              const stillNeeded = skipped.some((t) => rule.match.test(t.fullName));
              const existsAtAll = tests.some((t) => rule.match.test(t.fullName));
              if (existsAtAll && !stillNeeded) {
                console.error("::error::this exemption is no longer needed and must be removed: " +
                              rule.match);
                process.exit(1);
              }
            }
          ' "$report"
          done

  e2e:
    name: e2e (Playwright — desktop + mobile-360)
    runs-on: ubuntu-latest
    # The suite takes about five minutes on a sixteen-core box with eight workers; a two-core
    # runner is slower and the stack has to be built first. Thirty is generous for that and still
    # finite — the default is six HOURS, and the failure this bounds is a stack that came up but
    # never answers, which otherwise holds a runner all afternoon before anyone notices.
    timeout-minutes: 30
    # This job used to print a notice explaining what was missing: Playwright, a browser download,
    # and a stack the browser could reach. All three now exist, so it runs the suite instead.
    #
    # The stack is EXTERNAL to Playwright — `bash tools/dev/e2e-stack.sh` brings it up and this job
    # tears it down — rather than a `webServer` entry. e2e/playwright.config.ts carries the full
    # argument; the short version is that a stack that only comes up under the test runner is a
    # stack no developer can bring up before pushing, and `webServer` reports a failed migration as
    # a timeout.
    services:
      postgres:
        # The same definition as the `migrations` job, deliberately: the schema uses the built-in
        # uuidv7(), which does not exist before 18, and bootstrap.sql refuses to proceed without it.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-postgres
      # Outside the working tree. A JSON report written into the repository is an untracked file
      # that `pnpm format:check` then reports as unformatted — the same trap the migrations job's
      # vitest report fell into.
      #
      # `$RUNNER_TEMP`, not `${{ runner.temp }}`. The `runner` CONTEXT does not exist at job level
      # — it is only populated once a runner has been assigned — and using it here does not fail
      # the step, it makes GitHub reject THE WHOLE FILE before a single job starts. Measured:
      # every push since this job was added produced a `startup_failure` of zero seconds, and the
      # workflow's name in the API was its own path, which is what GitHub shows when it cannot
      # parse the file far enough to read `name:`.
      #
      # It is not simply written as `$RUNNER_TEMP` here either: a job-level `env:` value is a
      # literal string, so the variable would hold the eight characters `$RUNNER_TEMP` and
      # Playwright would create a directory by that name in the working tree — the very thing
      # this comment exists to prevent. It is exported by a step below instead, where a shell
      # expands it.
      # No silent fallback to an agent-less stack. Without an agent this job used to run with
      # eighteen of its tests gating themselves out with test.fixme — every mutation on the file
      # manager, which is the screen the appliance exists for — behind a green tick. The stack
      # script refuses to come up rather than take that path here.
      DEPSIS_E2E_REQUIRE_AGENT: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install the PostgreSQL 18 client
        # The runner image ships an older psql, and packages/db/bootstrap.sql — which
        # tools/dev/e2e-stack.sh runs twice — uses `\if :{?var}`, which needs a recent client.
        run: |
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          psql --version

      - name: Cache the browser
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the lockfile, because that is what pins @playwright/test — and a browser build
          # belongs to a Playwright version, not to a commit. A stale browser under a new
          # Playwright is refused at launch with a version mismatch rather than silently used.
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Chromium
        # `install-deps` on a cache hit, the full `install --with-deps` otherwise. The apt libraries
        # chromium links against live in the runner image and are NOT in the cached directory, so a
        # cache hit still needs them — skipping this step entirely on a hit would produce a browser
        # that fails to launch with a missing shared object.
        run: |
          if [ '${{ steps.browser.outputs.cache-hit }}' = 'true' ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Its own key rather than sharing the `rust` job's: that job builds --all-targets with
          # dev-dependencies and this one builds a single release binary, and one cache holding
          # both is a cache that misses for both.
          key: e2e-agent

      - name: Build the storage agent
        # A step of its own so a compile error is reported as a compile error rather than as
        # "the stack did not come up". The stack script would build it too; finding the binary
        # already there is the fast path.
        #
        # In this product a folder is a database row AND a directory, so with no agent every
        # mutation on the file manager answers 503. `systemd-socket-activate` — from the systemd
        # package, already on the runner image — hands it its two sockets the way the .socket units
        # do on an appliance. tools/dev/e2e-stack.sh carries the full argument.
        run: cargo build --locked --release --bin depsis-agent

      - name: Bring the stack up
        # Two databases, two API processes, two web origins, one privileged agent — the script
        # explains why at length. It builds the API and the web bundle itself, so a broken build
        # fails here, before a single browser starts, with the build's own error rather than a
        # wall of timeouts.
        run: bash tools/dev/e2e-stack.sh

      - name: Run the suite
        run: pnpm test:e2e

      - name: Prove the suite was not empty
        # ANTI FALSE GREEN, and the same discipline as the migrations job's skip gate above.
        #
        # A Playwright run that matched no files exits 0 and prints "no tests found". A testDir
        # typo, a renamed spec, or a `testIgnore` that grew too wide all land there — and every one
        # of them reports a green tick over zero measurements. This reads the JSON report and
        # refuses that, in three separate ways.
        #
        # `if: always()`, so that a run which produced no report at all is a failure of THIS step
        # with a readable message, rather than a step that quietly did not happen.
        if: always()
        run: |
          node -e '
            const fs = require("node:fs");
            let report;
            try {
              report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            } catch (e) {
              console.error("::error::could not read the Playwright report: " + e.message);
              process.exit(1);
            }

            // The report nests suites by directory and by describe block, so the specs have to be
            // walked out rather than read off the top level.
            const specs = [];
            const walk = (suite) => {
              for (const spec of suite.specs ?? []) specs.push(spec);
              for (const child of suite.suites ?? []) walk(child);
            };
            for (const suite of report.suites ?? []) walk(suite);
            const tests = specs.flatMap((spec) =>
              spec.tests.map((t) => ({ title: spec.title, ...t })),
            );

            if (tests.length === 0) {
              console.error("::error::the Playwright report contains no tests at all");
              process.exit(1);
            }

            const byProject = new Map();
            for (const t of tests) {
              const row = byProject.get(t.projectName) ?? { ran: 0, skipped: 0 };
              row.ran += 1;
              if (t.results[0]?.status === "skipped") row.skipped += 1;
              byProject.set(t.projectName, row);
            }
            // Printed to the log AND to the job summary. A skipped test is green on the summary
            // and measured nothing, and the count is the only place on the run page where the
            // difference between "56 passed" and "56 ran, 18 of them skipped" is visible at all —
            // otherwise it lives inside a report artefact nobody downloads on a green run.
            const lines = [];
            for (const [name, row] of byProject) {
              console.log(name + ": " + row.ran + " test(s), " + row.skipped + " skipped");
              lines.push("| " + name + " | " + (row.ran - row.skipped) + " | " + row.skipped + " |");
            }
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                "### Playwright\n\n| project | measured | skipped |\n| --- | --- | --- |\n" +
                  lines.join("\n") + "\n",
              );
            }

            // The job is NAMED "desktop + mobile-360" and that name is a promise. A project that
            // contributed nothing means the configuration moved, and the half of the suite that
            // only the narrow viewport can falsify — the dock is reachable, the page does not
            // scroll sideways — stopped being measured while the tick stayed green.
            //
            // "kurulum" is in the list even though the job name does not mention it, and it is the
            // one that most needed adding. Playwright errors on a run that matched NOTHING, never
            // on a single project that matched nothing — so a renamed setup.kurulum.spec.ts, or a
            // WIZARD_SPECS glob that drifted, would leave the wizard project contributing zero
            // tests and this job green. That is the first screen anybody who plugs the box in ever
            // sees. `row.ran === row.skipped` rather than a fixed count, because the project
            // legitimately carries one declared test.fixme.
            for (const required of ["desktop", "mobile-360", "kurulum"]) {
              const row = byProject.get(required);
              if (row === undefined || row.ran === row.skipped) {
                console.error("::error::the " + required +
                  " project ran no tests; this job claims to cover it");
                process.exit(1);
              }
            }

            // Every skip must say why. `test.fixme(condition, reason)` puts the sentence in the
            // report, so a plain `test.skip` — which carries none — fails here. That is the whole
            // point: a skipped test is green on the summary and measured nothing, and the only
            // thing separating an honest gate from a hidden failure is the recorded reason.
            const mute = tests.filter(
              (t) =>
                t.results[0]?.status === "skipped" &&
                !(t.annotations ?? []).some(
                  (a) => a.type === "fixme" && (a.description ?? "") !== "",
                ),
            );
            if (mute.length > 0) {
              console.error("::error::" + mute.length +
                " test(s) were skipped with no recorded reason; use test.fixme(cond, why)");
              for (const t of mute.slice(0, 10)) {
                console.error("  " + t.projectName + " › " + t.title);
              }
              process.exit(1);
            }
          ' "$DEPSIS_E2E_JSON_REPORT"

      - name: The stack's own logs
        # Printed on failure, because the browser-side artefacts below say what the page did and
        # these say what the API did. A 500 behind a failed assertion is invisible in a trace.
        if: failure()
        run: |
          for log in /tmp/depsis-e2e/*.log; do
            [ -f "$log" ] || continue
            echo "── $log"
            tail -80 "$log"
          done

      - name: Traces and screenshots
        # `retain-on-failure` and `only-on-failure` in the config mean these directories hold
        # exactly the runs that went wrong. An e2e failure nobody can look at is a test nobody
        # believes, and the next person deletes it.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Stop the stack
        if: always()
        run: bash tools/dev/e2e-stack.sh --down

  # ── Declared but not yet implemented ────────────────────────────────────────
  # These exist so their absence is visible in every CI run. Each is enabled by the
  # PoC named in its ADR.

  integration:
    name: integration (needs Debian VM — ADR-0012)
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice::Partially implemented. The PostgreSQL half now runs on every push"
          echo "in the 'migrations' job above (P1-A's schema assertions, ADR-0013/0014)."
          echo "What still needs the Hyper-V/Debian target: ZFS (P0-A/G), Samba ACLs (P0-B),"
          echo "filesystem events (P0-D) and the privileged agent (P0-E)."
          echo "Also P1-C (tools/poc/p1-c-api-agent.sh): the API and the agent talking over a real"
          echo "Unix socket, which needs root and socket activation. apps/api's"
          echo "agent.integration.test.ts is excluded from the migrations job for that reason."
