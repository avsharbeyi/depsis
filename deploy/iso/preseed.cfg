# DEPSIS kurulum ISO'sunun ön-yanıt dosyası (Debian 13 / d-i preseed).
#
# TASARIM: her şeyi otomatikleştir, İKİ ŞEYİ BİLEREK SOR.
#
#   1. Hangi diske kurulacağı. Diski silen kararı bir metin dosyası veremez — "en küçük diski
#      seç" gibi bir kural, yanlış kutuda yanlış diski siler ve bunu sessizce yapar.
#   2. İlk hesap ve parolası. ISO'ya gömülü sabit bir parola, aynı ISO'yla kurulan her cihazda
#      aynı parola demektir; bir kurulum kolaylığı değil, seri üretilmiş bir arka kapıdır.
#
# Geri kalan her soru burada yanıtlı. `auto=true priority=high` ile açıldığında (önyükleme
# menüsündeki DEPSIS girdisi bunu yapar) kurulum yalnız bu iki durakta durur.

# ── dil, klavye, saat ────────────────────────────────────────────────────────
d-i debian-installer/locale string tr_TR.UTF-8
d-i keyboard-configuration/xkb-keymap select trq
d-i time/zone string Europe/Istanbul
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# ── ağ ───────────────────────────────────────────────────────────────────────
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string depsis
d-i netcfg/get_domain string lan
# DHCP yoksa kurulum yine sorar; bir NAS'ın ağı olmadan kurulmasının anlamı yok.

# ── yansı ────────────────────────────────────────────────────────────────────
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# ── hesap: root kilitli, ilk kullanıcı SORULUR ───────────────────────────────
# root girişi kapalı olduğu için d-i ilk kullanıcıyı kendiliğinden sudo'ya alır.
d-i passwd/root-login boolean false

# ── disk: yöntem otomatik, DİSK SEÇİMİ SORULUR ───────────────────────────────
# `partman-auto/disk` bilerek YOK — kurulum "hangi disk?" diye durur. Seçimden sonrası
# sorusuz: tek bölüm + takas, ve onaylar burada verili. Veri diskleri BU EKRANDA DEĞİL,
# kurulumdan sonra DEPSIS'in kendi havuz sihirbazında seçilir; o sihirbaz üstünde bir şey
# olan diski zaten reddeder.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# ── apt kaynakları ───────────────────────────────────────────────────────────
# contrib: zfs-dkms oradan geliyor. non-free-firmware: gerçek donanımın ağ kartı için.
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates

# ── paketler: masaüstü YOK ───────────────────────────────────────────────────
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo git curl ca-certificates gnupg openssl iproute2
popularity-contest popularity-contest/participate boolean false

# ── önyükleyici ──────────────────────────────────────────────────────────────
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# ── DEPSIS yükü: kaynak + ilk açılış birimi ──────────────────────────────────
# ISO'daki /depsis dizini hedef diske kopyalanır ve ilk açılışta bağımlılıkları kurup
# tools/install/install.sh'ı çalıştıran systemd birimi etkinleştirilir. Betiğin kendisi
# /opt/depsis-install altında, okunabilir hâlde durur — ne çalışacağı kurulumdan önce de
# sonra da denetlenebilir (§19: "denetlenebilir bootstrap installer").
d-i preseed/late_command string \
    mkdir -p /target/opt/depsis-install; \
    cp -r /cdrom/depsis/. /target/opt/depsis-install/; \
    cp /cdrom/depsis/depsis-firstboot.service /target/etc/systemd/system/depsis-firstboot.service; \
    in-target chmod 0755 /opt/depsis-install/firstboot.sh; \
    in-target systemctl enable depsis-firstboot.service

d-i finish-install/reboot_in_progress note
