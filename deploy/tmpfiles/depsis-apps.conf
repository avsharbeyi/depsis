# /run/depsis-apps — podman soketi ve podman'ın kendi calisma dosyalari.
# Soket biriminin RuntimeDirectory'si dizini ROOT sahipliginde yaratti ve podman (depsis-apps)
# icine libpod/ acamadi — 83 kez arka arkaya. Sahiplik burada, acikca: depsis-apps yazar,
# depsis-api grubu sokete ulasir.
d /run/depsis-apps 0750 depsis-apps depsis-api -
