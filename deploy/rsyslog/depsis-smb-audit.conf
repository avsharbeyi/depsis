# Samba's DEPSIS audit stream → a file the worker follows.  ADR-0011 Layer 1.
#
# The agent writes these six lines into every generated share section:
#
#     vfs objects = full_audit
#     full_audit:prefix = %u|%I|%S
#     full_audit:success = create_file renameat unlinkat mkdirat close ftruncate linkat symlinkat
#     full_audit:failure = none
#     full_audit:facility = local5
#     full_audit:priority = notice
#
# so smbd emits one syslog line per change, on facility local5, priority notice.  Without the rule
# below those lines land in the general system log and the worker never sees them — DEPSIS still
# works, it just indexes SMB writes on the fifteen-minute walk instead of within seconds.
#
# Install:
#     install -d -m 0750 -o root -g depsis-api /var/log/depsis
#     cp deploy/rsyslog/depsis-smb-audit.conf /etc/rsyslog.d/49-depsis-smb-audit.conf
#     systemctl restart rsyslog
#
# The number 49 puts this before Debian's own 50-default.conf, which is what lets the `stop` below
# keep audit lines out of /var/log/syslog.  With them in it, a busy share writes tens of thousands
# of lines an hour into a file nobody reads.

# Sahiplik EYLEMİN ÜZERİNDE, dosyanın başında değil.
#
# Burada eskiden `$FileCreateMode 0640` / `$FileOwner root` / `$FileGroup depsis-api` duruyordu.
# Bunlar eski biçim GLOBAL direktiflerdir: bir kez okundular mı, o noktadan sonra rsyslog'un
# gördüğü HER omfile eylemi için geçerli kalırlar.  Bu dosya 49- adıyla, yani Debian'ın
# 50-default.conf'undan ÖNCE okunduğu için ayar oradaki /var/log/syslog ve /var/log/auth.log
# eylemlerine de sızıyordu: ilk logrotate döngüsünden sonra iki dosya da root:depsis-api 0640
# olarak yeniden yaratılıyor, ve web API'sinin hesabını ele geçiren biri sshd/sudo giriş
# kayıtlarını okuyabiliyordu.  Eylem parametreleri yalnız kendi eylemini bağlar.
#
# Worker depsis-api olarak koşuyor ve bu dosyayı okumak zorunda.  Asla yazmıyor.
if ($syslogfacility-text == 'local5' and $programname startswith 'smbd') then {
    action(type="omfile" file="/var/log/depsis/smb-audit.log"
           fileOwner="root" fileGroup="depsis-api" fileCreateMode="0640")
    stop
}
